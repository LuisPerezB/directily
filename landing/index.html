<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Predictily — Anticipa tus ventas. Optimiza tus decisiones.</title>
    <meta name="description" content="Predictily convierte las ventas que su empresa ya registra en pronósticos de demanda e ingresos, alertas de inventario y sugerencias de compra verificables. Sin reemplazar su ERP. Sin planes forzosos." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Predictily — Anticipa tus ventas. Optimiza tus decisiones." />
    <meta property="og:description" content="Pronósticos de demanda e ingresos, alertas de inventario y sugerencias de compra verificables, sobre los sistemas que su empresa ya usa." />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#0b7a83" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230B7A83'/%3E%3Cg transform='translate(8.5 8.6) scale(0.98)'%3E%3Cpath fill='%23FFFFFF' d='M8 5H25.5A14.5 14.5 0 0 1 25.5 34H20V43H8Z'/%3E%3Cpath fill='none' stroke='%230B7A83' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round' d='M8 29.5L17 22.5L22.5 27L32.5 16'/%3E%3Ccircle fill='%23F0A04B' stroke='%230B7A83' stroke-width='2' cx='33.6' cy='14.8' r='4.6'/%3E%3C/g%3E%3C/svg%3E" />
    <script>
      // Con scripts, las secciones entran con animación; sin ellos (o antes de cargar) el contenido ya escrito se ve entero.
      document.documentElement.classList.add('js')
      // Aplica el tema guardado antes de pintar, para que la página no parpadee.
      try {
        var t = localStorage.getItem('predictily.theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>Predictily: pronósticos de demanda e ingresos, alertas de inventario y sugerencias de compra. Active JavaScript para ver la página.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
