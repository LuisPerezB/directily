# ─────────────────────────────────────────────────────────────────────────────
# Predictily · nginx del servicio "web"
#   - Sirve la SPA (Vue) desde /usr/share/nginx/html
#   - /api, /sanctum, /up  → php-fpm (servicio backend:9000) vía FastCGI
#   - El motor Python NO se expone: solo es accesible desde la red interna.
# TLS: se termina delante (Caddy en docker-compose.prod.yml o nginx del host);
# ver infra/scripts/deploy.md.
# ─────────────────────────────────────────────────────────────────────────────

upstream predictily_php {
    server backend:9000;
    keepalive 8;
}

# HTTPS real informado por el proxy TLS frontal.
map $http_x_forwarded_proto $predictily_https {
    default "";
    https   on;
}

# IP real del cliente (auditoría y rate limiting en Laravel) cuando hay proxy frontal en red privada.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Límites básicos contra abuso (Laravel aplica además su propio rate limiting por usuario).
limit_req_zone $binary_remote_addr zone=predictily_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=predictily_api:10m rate=20r/s;

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Importaciones de hasta 20 MB (+ margen multipart).
    client_max_body_size 25m;
    client_body_timeout 120s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/csv application/json application/javascript
               application/xml image/svg+xml font/woff2;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── Autenticación: límite más estricto ─────────────────────────────────
    location ~ ^/api/v1/auth/(login|register) {
        limit_req zone=predictily_auth burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/laravel-fastcgi.conf;
    }

    # ── API Laravel, CSRF de Sanctum y healthcheck ─────────────────────────
    location ~ ^/(api|sanctum)(/|$) {
        limit_req zone=predictily_api burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/laravel-fastcgi.conf;
    }

    location = /up {
        access_log off;
        include /etc/nginx/snippets/laravel-fastcgi.conf;
    }

    # ── Recursos compilados por Vite (nombres con hash → caché larga) ───────
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # ── SPA: cualquier otra ruta sirve index.html (sin caché) ──────────────
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Archivos ocultos y de configuración nunca se sirven.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
