# Cabeceras de seguridad. nginx NO hereda add_header en bloques location que
# definen los suyos, por eso este snippet se incluye en cada location con add_header.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# CSP: todo se sirve desde el mismo origen (SPA + API). 'unsafe-inline' en estilos lo requieren
# los estilos dinámicos de Vue/ECharts. Las fuentes deben alojarse localmente (sin CDNs externos).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
# HSTS solo tiene efecto cuando el sitio se sirve por HTTPS (el proxy TLS frontal lo añade también).
