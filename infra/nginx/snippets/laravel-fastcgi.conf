# Todas las peticiones de API entran por el front controller de Laravel.
fastcgi_pass predictily_php;
fastcgi_keep_conn on;
include fastcgi_params;
fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
fastcgi_param SCRIPT_NAME     /index.php;
fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
fastcgi_param HTTPS           $predictily_https if_not_empty;
fastcgi_param HTTP_PROXY      "";   # mitigación httpoxy
fastcgi_read_timeout 130s;
fastcgi_buffers 16 16k;
fastcgi_buffer_size 32k;
