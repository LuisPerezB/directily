; Predictily · pool php-fpm
[www]
listen = 9000
; Laravel se configura con variables de entorno: no limpiarlas en los workers.
clear_env = no
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
request_terminate_timeout = 130s
ping.path = /ping
ping.response = pong
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
