openapi: 3.1.0
info:
  title: Predictily API — módulo analítico
  version: 1.0.0
  description: |
    Pronósticos, dashboard, precisión, inventario, alertas, escenarios y exportaciones
    (docs/06-contratos-integracion.md §3.8–3.12). Todas las rutas requieren autenticación
    (sesión SPA de Sanctum o token Bearer) y el encabezado `X-Tenant-ID` con el uuid de la
    empresa activa. Los ids de recursos de otra empresa responden 404; los filtros con ids de
    otra empresa responden 422.

    Reglas de negocio relevantes:
    - El entrenamiento nunca ocurre dentro de la petición: `POST /forecast-runs` responde 202 y
      el progreso se consulta en `GET /jobs/{id}`.
    - Los intervalos de semanas/meses solo se devuelven si el motor los precalculó; sumar
      cuantiles diarios no produce un intervalo válido (`intervals_available: false`).
    - El simulador es un cálculo determinista sobre supuestos explícitos, no una estimación causal.
    - Las recomendaciones de compra son sugerencias: Predictily no ejecuta pedidos.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
  - bearerToken: []
tags:
  - name: Pronósticos
  - name: Dashboard
  - name: Precisión
  - name: Inventario
  - name: Alertas
  - name: Escenarios
  - name: Exportaciones
paths:
  /forecast-runs:
    post:
      tags: [Pronósticos]
      summary: Solicitar una ejecución de pronóstico (asíncrona)
      description: |-
        Requiere la habilidad `forecast.run` (propietario, administrador, analista).

        **402 `plan_limit_exceeded`** (`limit` indica cuál): `horizons` si el plan no incluye el horizonte pedido; `max_forecast_runs_per_day`; y
        `max_series` (Starter/Growth/Enterprise) si las series activas de la empresa —pares sucursal × producto con ventas válidas en los últimos 90 días—
        superan el tope del plan (`current` y `max` en la respuesta). El conteo se cachea por empresa y día (10 min; una importación de ventas lo invalida) y
        corre con tiempo acotado: si no se puede medir a tiempo, el tope no se exige en esa petición (se registra un aviso).
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                horizon_days: { type: integer, enum: [7, 14, 15, 30, 60, 90], description: 'Por defecto el mayor horizonte que permita el plan' }
                cutoff_date:
                  type: string
                  format: date
                  description: Fecha de corte pasada; crea una ejecución `historical` (nunca vigente).
      responses:
        '202':
          description: Ejecución creada en cola
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/ForecastRun' } } } } }
        '402': { $ref: '#/components/responses/PlanLimit' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Ya hay una ejecución en cola o en proceso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  code: { type: string, const: forecast_run_in_progress }
                  active_run: { type: object, properties: { id: { type: integer }, version: { type: integer }, status: { type: string }, created_at: { type: string, format: date-time } } }
        '422': { $ref: '#/components/responses/Validation' }
    get:
      tags: [Pronósticos]
      summary: Listar ejecuciones (más reciente primero)
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: status, in: query, schema: { type: string, enum: [queued, running, completed, failed, cancelled] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Lista paginada
          content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedForecastRuns' } } }
  /forecast-runs/{id}:
    get:
      tags: [Pronósticos]
      summary: Detalle de una ejecución
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/ForecastRun' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /jobs/{id}:
    get:
      tags: [Pronósticos]
      summary: Estado y progreso de un trabajo asíncrono
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/TrainingJob' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /forecasts/series:
    get:
      tags: [Pronósticos]
      summary: Historia y pronóstico de un nodo de la jerarquía
      description: |
        Nodo: sin filtros → `total`; branch → `branch:{b}`; category → `category:{c}`;
        branch+category → `branch_category:{b}:{c}`; product → `product:{p}`; product+branch → `series:{b}:{p}`.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/Granularity'
        - $ref: '#/components/parameters/Horizon'
        - { name: history_days, in: query, schema: { type: integer, minimum: 7, maximum: 730, default: 90 } }
      responses:
        '200':
          description: Serie
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/SeriesResponse' } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
  /forecasts/products:
    get:
      tags: [Pronósticos]
      summary: Ranking de productos (pronóstico vs período histórico equivalente)
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/Horizon'
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/CategoryId'
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: sort, in: query, schema: { type: string, enum: [change_pct, -change_pct, forecast_units, -forecast_units, revenue, -revenue, name], default: -forecast_units } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: 'Lista paginada (o data vacía y run null si no hay pronóstico)'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/ProductForecast' } }
                      run: { $ref: '#/components/schemas/RunRef' }
                      horizon: { type: integer }
  /forecasts/categories:
    get:
      tags: [Pronósticos]
      summary: Pronóstico por categoría
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/Horizon'
        - $ref: '#/components/parameters/BranchId'
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200':
          description: Categorías
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        category: { type: object, properties: { id: { type: [integer, 'null'] }, name: { type: string } } }
                        history_units: { type: number }
                        forecast_units: { type: number }
                        change_pct: { type: [number, 'null'] }
                        trend: { type: string, enum: [up, down, flat] }
                        forecast_revenue: { type: [number, 'null'] }
                  run: { $ref: '#/components/schemas/RunRef' }
  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Resumen comercial (cuánto venderé, qué sube/baja, qué podría agotarse, inversión, confiabilidad)
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Horizon'
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Resumen (KPIs de pronóstico en null si no hay ejecución vigente)
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/DashboardSummary' } } } } }
  /reports/forecast-summary:
    get:
      tags: [Dashboard]
      summary: Resumen ejecutivo imprimible
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/Horizon' }, { $ref: '#/components/parameters/BranchId' }]
      responses:
        '200': { description: 'Reporte JSON con highlights, KPIs, riesgos, precisión y advertencias' }
  /accuracy/summary:
    get:
      tags: [Precisión]
      summary: Métricas de backtesting, precisión realizada y explicación en lenguaje sencillo
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/RunId' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/AccuracySummary' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /accuracy/comparison:
    get:
      tags: [Precisión]
      summary: Pronóstico de una ejecución pasada frente a ventas reales
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: run_id, in: query, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Puntos diarios; días censurados por quiebre de stock se excluyen de las métricas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      points:
                        type: array
                        items:
                          type: object
                          properties:
                            date: { type: string, format: date }
                            yhat: { type: number }
                            lo_80: { type: [number, 'null'] }
                            hi_80: { type: [number, 'null'] }
                            actual: { type: [number, 'null'] }
                            censored: { type: boolean }
                      metrics: { $ref: '#/components/schemas/Metrics' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
  /model-evaluations:
    get:
      tags: [Precisión]
      summary: Filas de model_evaluations de una ejecución
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: run_id, in: query, required: true, schema: { type: integer } }
        - { name: evaluation_type, in: query, description: 'Sin filtro no sale `shadow_prospective` (V2.5 · W3): se pide explícitamente o se usa GET /models/shadow-evaluations', schema: { type: string, enum: [backtest, selection_windows, realized, shadow_prospective] } }
        - { name: level, in: query, description: 'Sin filtro no sale `segment` (V2.5 · W3): se pide explícitamente o se usa GET /models/evaluations', schema: { type: string, enum: [overall, demand_class, horizon, horizon_total, branch, category, product, series, total, segment] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { description: Lista paginada }
  /models:
    get:
      tags: [Precisión]
      summary: Registro de modelos de la empresa
      description: |
        Estados (ADR-V2-07 y ADR-V25-07): `candidate`, `validated`, `approved`, `production`, `retired`, `rejected` y el legado `failed`, con
        `role` (`primary|fallback`) y `core`. El filtro `status` acepta también los nombres de la etapa 1 (`fallback` = production + role
        fallback, `archived` = retired, `rejected` = los validados no promovidos de la etapa 1 Y los rechazados); cada fila trae `legacy_status`.
        `family` filtra por familia de modelo (`model_family`). Cada fila trae el ciclo de vida (publicación y aprobación separada) y
        `serving_basis`: `approved` (aprobado por una persona distinta de quien lo publicó o entrenó), `legacy_pipeline` (legado del pipeline
        propio, se sirve como hasta ahora) o `not_approved` (no puede servirse ni restaurarse). Nunca expone la clave del almacén de objetos.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: status, in: query, schema: { type: string, enum: [candidate, validated, approved, production, retired, rejected, failed, fallback, archived] } }
        - { name: role, in: query, schema: { type: string, enum: [primary, fallback] } }
        - { name: core, in: query, schema: { type: string, enum: [demand, customer, supply, cost, scenario] } }
        - { name: family, in: query, description: 'Familia del modelo (model_family), p. ej. lightgbm_global', schema: { type: string, maxLength: 40, pattern: '^[a-z0-9_]+$' } }
        - { name: run_id, in: query, schema: { type: integer } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { description: Lista paginada de model_registry }
        '422': { $ref: '#/components/responses/ValidationError' }
  /models/evaluations:
    get:
      tags: [Precisión]
      summary: Evaluaciones de calidad de los modelos (por horizonte y segmento; Demand y Customer)
      description: |
        Explorador de `model_evaluations` (V2.5 · W3; V25-HOR-007, V25-AGD-011..014 y -016, V25-DEM-034). Solo lectura. A diferencia de
        `GET /model-evaluations` (la vista clásica, que NO muestra las filas nuevas), aquí salen las **métricas por segmento y horizonte** de Demand
        (`level=segment`, `level_key=<dimensión>:<valor>`; dimensiones `demand_class`, `category`, `branch`, `volume_tier`, `series_age`), la **calibración por
        segmento y las métricas de S05** del Customer Core (`core=customer`; dimensiones `frequency`, `value`, `tenure`, `history`; `level_key` como
        `h30:expected_orders` o `window`) y la evaluación prospectiva del shadow (`evaluation_type=shadow_prospective`).


        Cada fila declara su **denominador** (`quality.denominator.sum_actual`, en unidades) y su **cobertura** (`quality.sample`: días evaluables, días excluidos
        por clase —quiebre, fuente ausente, cierre—, series y ventanas). Un WAPE con denominador insuficiente o cero **nunca** se publica: `wape` es null,
        `quality.wape_unstable = true` y la métrica alternativa explícita va en `quality.alternative_metric` (MASE o error absoluto agregado). Un segmento con
        pocas observaciones trae `status = insufficient_data`, `figures_available = false` y **ninguna cifra de error**, solo los tamaños de muestra.


        Sin `run_id` ni `core_run_id` devuelve solo las filas de la ejecución de Demand vigente y del último entrenamiento de Customer (si el plan lo incluye);
        sin ninguna, una lista vacía. Las anteriores se piden con `run_id` o `core_run_id`. Un `run_id` o `core_run_id` de otra empresa responde 404. Los filtros
        booleanos aceptan `true`, `false`, `1` y `0`; otro valor responde 422. 402 si se pide `core=customer` y el plan no incluye el comportamiento de compra, o un `horizon` fuera del plan (sin `horizon`, los
        horizontes fuera del plan no aparecen). Habilidad requerida: `forecast.view`.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: core, in: query, schema: { type: string, enum: [demand, customer] } }
        - { name: run_id, in: query, description: 'Ejecución de pronóstico (forecast_run_id)', schema: { type: integer } }
        - { name: core_run_id, in: query, description: 'Ejecución del Customer Core', schema: { type: integer } }
        - { name: horizon, in: query, schema: { type: integer, enum: [7, 14, 15, 30, 60, 90] } }
        - { name: evaluation_type, in: query, description: 'backtest, selection_windows, realized, holdout, out_of_sample, shadow_prospective…', schema: { type: string, maxLength: 20, pattern: '^[a-z_]+$' } }
        - { name: level, in: query, schema: { type: string, enum: [overall, demand_class, horizon, horizon_total, branch, category, product, series, total, segment] } }
        - { name: dimension, in: query, description: 'Dimensión de segmento (implica level=segment)', schema: { type: string, enum: [demand_class, category, branch, volume_tier, series_age, frequency, value, tenure, history] } }
        - { name: level_key, in: query, description: 'Clave exacta, p. ej. demand_class:smooth', schema: { type: string, maxLength: 80 } }
        - { name: model_family, in: query, schema: { type: string, maxLength: 40, pattern: '^[a-z0-9_]+$' } }
        - { name: is_selected, in: query, description: 'true/false o 1/0', schema: { type: boolean } }
        - { name: is_baseline, in: query, description: 'true/false o 1/0', schema: { type: boolean } }
        - { name: status, in: query, description: 'Estado de la fila (metrics.status): ok | insufficient_data (Demand); calibrated | miscalibrated | insufficient_data (calibración por segmento del Customer Core); validated | not_validated | insufficient_data (validación de la ventana de recompra)', schema: { type: string, enum: [ok, insufficient_data, calibrated, miscalibrated, validated, not_validated] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ModelQualityEvaluation' } }
                  meta: { type: object, properties: { current_page: { type: integer }, per_page: { type: integer }, total: { type: integer }, last_page: { type: integer } } }
                  links: { type: object }
        '402': { $ref: '#/components/responses/PlanLimit' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
  /models/promotion-decisions:
    get:
      tags: [Precisión]
      summary: Decisiones de promoción de la política heredada y de la V2.5, por ejecución y alcance
      description: |
        Una fila por **política** (`legacy` o `v25`) y **alcance** (`global`, `class:<clase de demanda>`, `horizon:<H>`, este último informativo) de la ejecución
        (V2.5 · W3, ADR-V25-21). Las dos políticas se calculan siempre en paralelo; `is_effective` marca la que **gobernó lo servido**: por defecto la heredada
        (no cambia lo servido), y la V2.5 solo si la empresa fijó `promotion.governing_policy = v25` (`GET /tenant/effective-config?core=promotion`). La otra
        queda registrada como «sombra de decisión». `gates` trae el resultado de cada gate con su evidencia (`pass`, `fail`, `not_evaluable`, `not_applicable`,
        `pending`); `served_family` es lo que la política dejó servido (con `planned_family` y `fallback_applied` si el entrenamiento final recurrió a un
        respaldo). La aprobación humana separada (W4 · S06) aparece en `approval` y queda `pending` mientras nadie la complete.


        Sin `run_id` ni `core_run_id`: la ejecución de Demand vigente (sin ninguna vigente, lista vacía y `run = null`; nunca todo el historial). `summary` (solo con una
        ejecución de Demand) dice qué política gobernó, las huellas de ambas y en cuántos alcances la V2.5 habría servido otro modelo que la heredada; los alcances
        informativos `horizon:<H>` no cuentan. Los alcances de un horizonte que el plan no incluye no salen, y pedirlos con `scope=horizon:<H>` responde 402
        (`limit = horizons`). Un `run_id` o `core_run_id` de otra empresa responde 404. Habilidad requerida: `forecast.view`.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: core, in: query, schema: { type: string, enum: [demand, customer] } }
        - { name: run_id, in: query, description: 'Ejecución de pronóstico; por defecto la vigente', schema: { type: integer } }
        - { name: core_run_id, in: query, schema: { type: integer } }
        - { name: policy, in: query, schema: { type: string, enum: [legacy, v25] } }
        - { name: scope, in: query, description: 'Clave de alcance exacta, p. ej. global o class:intermittent', schema: { type: string, maxLength: 80 } }
        - { name: decision, in: query, schema: { type: string, enum: [promote, reject, keep_champion, publish_baseline, shadow] } }
        - { name: is_effective, in: query, description: 'true/false o 1/0', schema: { type: boolean } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Lista paginada de decisiones, la referencia de la ejecución y su resumen
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PromotionDecision' } }
                  meta: { type: object, properties: { current_page: { type: integer }, per_page: { type: integer }, total: { type: integer }, last_page: { type: integer } } }
                  links: { type: object }
                  run: { $ref: '#/components/schemas/PromotionRunRef' }
                  summary: { $ref: '#/components/schemas/PromotionSummary' }
        '402': { $ref: '#/components/responses/PlanLimit' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
  /models/shadow-evaluations:
    get:
      tags: [Precisión]
      summary: Evaluación prospectiva del challenger (shadow) frente a lo realizado
      description: |
        Shadow mode (V2.5 · W3, §8): el mejor candidato **no servido** de cada alcance predice el horizonte sin servirse (`shadow_forecast_values`) y, pasado el
        corte, se evalúa contra lo realmente vendido con la **misma censura de días** que la evaluación servida (quiebre, fuente ausente y cierre no son ceros).
        Cada fila (`evaluation_type = shadow_prospective`, nivel `overall` u `horizon`) trae el WAPE del challenger, su sesgo y su cobertura, y en `shadow` el
        WAPE del modelo servido sobre las mismas series y días no censurados para una comparación justa.


        `shadow_forecasts` lista, por familia, cuántos valores no servidos existen (y el rango de fechas de las PREDICCIONES) y su estado: `evaluated` o `pending`
        (todavía no hay ventas realizadas posteriores al corte que comparar; no es un cero). El período REALMENTE evaluado y el denominador van en `shadow.evaluated` y
        `shadow.denominator` de cada fila. Con menos ventas reales evaluadas que `demand.wape_min_denominator` el WAPE, el sesgo, el WAPE del servido y la mejora
        relativa son `null` (`shadow.wape_unstable = true`). Nunca devuelve los valores pronosticados. Sin `run_id`: la ejecución vigente (que normalmente aún está
        `pending`); las evaluaciones llegan cuando pasa el horizonte. Un `run_id` de otra empresa responde 404. Habilidad requerida: `forecast.view`.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: run_id, in: query, description: 'Por defecto, la ejecución vigente', schema: { type: integer } }
        - { name: horizon, in: query, schema: { type: integer, enum: [7, 14, 15, 30, 60, 90] } }
        - { name: level, in: query, schema: { type: string, enum: [overall, horizon] } }
        - { name: model_family, in: query, schema: { type: string, maxLength: 40, pattern: '^[a-z0-9_]+$' } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Evaluaciones del challenger y estado de sus predicciones no servidas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ModelQualityEvaluation' } }
                  meta: { type: object, properties: { current_page: { type: integer }, per_page: { type: integer }, total: { type: integer }, last_page: { type: integer } } }
                  links: { type: object }
                  run: { $ref: '#/components/schemas/PromotionRunRef' }
                  shadow_forecasts: { type: array, items: { $ref: '#/components/schemas/ShadowForecastSummary' } }
        '402': { $ref: '#/components/responses/PlanLimit' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
  /models/{id}:
    get:
      tags: [Precisión]
      summary: Detalle de un modelo con su historial de transiciones
      description: |
        Los campos de la lista más `events` (de la más antigua a la más reciente: de, a, actor, tipo de actor `user|system|cli`, motivo y
        evidencia: firma, gate de datos, política) y la decisión de promoción de la política asociada (`promotion_decision`). Un modelo de otra
        empresa responde 404. Habilidad `forecast.view`.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Modelo con eventos
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/ModelRegistryDetail' } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /models/{id}/validate:
    post:
      tags: [Precisión]
      summary: Validar un candidato (compuertas automáticas)
      description: |
        `candidate` → `validated` si pasa las compuertas: firma Ed25519 verificada del artefacto, gate de calidad de datos de su ejecución distinto de
        BLOCK, decisión de política no rechazada y compatibilidad (Customer). No es una decisión de negocio y **no vuelve servible** al modelo: solo la
        aprobación separada lo hace. Habilidad `forecast.run` para un candidato publicado por la CLI; un modelo que no entró por la publicación (retador
        del pipeline propio) exige `models.approve` (403 `forbidden`). Queda en `model_registry_events` y en auditoría (`models.validated`). Errores 409 (`code`): `model_transition_not_allowed`,
        `approval_artifact_not_verifiable|unsigned|mismatch|signature_invalid|without_checksum` (un modelo publicado sin `published_object_key` también
        es `approval_artifact_not_verifiable`), `approval_object_key_invalid`, `approval_data_gate_blocked|missing`, `approval_policy_rejected`,
        `model_without_slot`, `model_incompatible`.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/ModelDecisionBody' } } }
      responses:
        '200':
          description: Modelo validado
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/ModelRegistryDetail' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Transición o compuerta no superada (code en el cuerpo)' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /models/{id}/approve:
    post:
      tags: [Precisión]
      summary: Aprobar un modelo validado (aprobación separada)
      description: |
        `validated` → `approved`. Exige la habilidad `models.approve` (propietario y administrador) Y segregación de funciones: quien publicó el
        modelo (`published_by`) o disparó su entrenamiento (`training_jobs.user_id`, `forecast_runs.user_id`, `core_runs.user_id`) no puede aprobarlo
        (403 `approval_segregation_of_duties`). Re-verifica la firma, el gate de datos de W2-C (≠ BLOCK) y la compatibilidad; completa la decisión de
        promoción de W3 asociada (`approved_by`, `approved_at`). Aprobar no sirve el modelo: `POST /models/{id}/promote` lo pone en producción.
        Errores 409 como en `validate`. Queda en `model_registry_events` y en auditoría (`models.approved`).
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/ModelDecisionBody' } } }
      responses:
        '200':
          description: Modelo aprobado
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/ModelRegistryDetail' } } } } }
        '403': { description: 'Sin la habilidad models.approve (code forbidden) o aprobador responsable del modelo (code approval_segregation_of_duties)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Transición o compuerta no superada (code en el cuerpo)' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /models/{id}/reject:
    post:
      tags: [Precisión]
      summary: Rechazar un modelo (motivo obligatorio)
      description: |
        `candidate`, `validated` o `approved` (aún sin producción) → `rejected`, terminal. El motivo es obligatorio (5 a 1000 caracteres) y queda en
        `rejected_reason`, en el evento y en auditoría (`models.rejected`). Misma habilidad (`models.approve`) y misma segregación de funciones que
        aprobar (403 `approval_segregation_of_duties`). Rechazar un modelo aprobado retira la aprobación vigente (`approved_by` y `approved_at`
        quedan en nulo); el evento conserva quién y cuándo lo aprobó (`evidence.previous_approval`).
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 5, maxLength: 1000 } } } } }
      responses:
        '200':
          description: Modelo rechazado
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/ModelRegistryDetail' } } } } }
        '403': { description: 'Sin la habilidad models.approve (code forbidden) o responsable del modelo (code approval_segregation_of_duties)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Transición no permitida (code en el cuerpo)' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /models/{id}/promote:
    post:
      tags: [Precisión]
      summary: Poner un modelo aprobado en producción
      description: |
        `approved` → `production`. Retira (`retired`) al modelo que servía en el mismo alcance (Customer: el mismo slot `h<H>:<objetivo>`; los demás
        cores: la misma familia, clase de demanda y rol) en la MISMA transacción, y vuelve a verificar firma, gate de datos y compatibilidad. Habilidad
        `models.approve`; el aprobador no puede ser responsable del modelo (403 `approval_segregation_of_duties`). 402 si el plan no incluye el
        horizonte (Customer). `data.retired_model_ids` lista los retirados.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/ModelDecisionBody' } } }
      responses:
        '200':
          description: Modelo en producción
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/ModelRegistryDetail' } } } } }
        '402': { $ref: '#/components/responses/PlanLimit' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Transición o compuerta no superada (code en el cuerpo)' }
  /models/demand/rollback:
    post:
      tags: [Precisión]
      summary: Revertir el modelo servido de la demanda a una ejecución de producción anterior
      description: |
        Re-apunta la ejecución **vigente** a una ejecución de producción completada y **anterior**; restaura sus modelos
        `retired`→`production` y retira los actuales. No reentrena. Habilidad `forecast.run`; queda en auditoría
        (`models.demand_rolled_back`). Una ejecución de otra empresa responde 404.
        Errores 409 (`code`): `no_current_run`, `rollback_already_current`, `rollback_target_not_production`,
        `rollback_target_not_previous`, `rollback_target_without_models`, `rollback_target_without_forecasts`,
        `rollback_target_not_approved`, `rollback_artifact_mismatch`.
        V2.5 · W4 (ADR-V25-07): solo se restauran modelos aprobados por una persona distinta de quien los publicó o entrenó, o legados del pipeline
        propio (`serving_basis` = `legacy_pipeline`: origen positivo en una corrida enlazada o en la línea base de la migración, nunca validado por una
        persona ni publicado); cada cambio de estado deja su evento en `model_registry_events`.
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [run_id], properties: { run_id: { type: integer, minimum: 1 } } } } }
      responses:
        '200':
          description: Reversión aplicada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      from_run_id: { type: integer }
                      to_run_id: { type: integer }
                      to_version: { type: integer }
                      to_cutoff_date: { type: [string, 'null'], format: date }
                      to_data_snapshot_id: { type: [integer, 'null'] }
                      to_config_version: { type: [string, 'null'] }
                      restored_model_ids: { type: array, items: { type: integer } }
                      retired_model_ids: { type: array, items: { type: integer } }
                      artifacts_verified: { type: [boolean, 'null'], description: 'true = SHA-256 verificado; null = artefactos no visibles desde el backend' }
                      artifacts_verification: { $ref: '#/components/schemas/ArtifactVerification' }
                      note: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Reversión no permitida (code en el cuerpo)' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /inventory/recommendations:
    get:
      tags: [Inventario]
      summary: Recomendaciones de abastecimiento
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/CategoryId'
        - { name: risk_level, in: query, description: 'Uno o varios separados por coma', schema: { type: string, example: 'high,critical' } }
        - { name: type, in: query, schema: { type: string, enum: [reorder, stockout_risk, overstock, no_action] } }
        - { name: status, in: query, schema: { type: string, enum: [open, acknowledged, dismissed, ordered] } }
        - { name: search, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [-stockout_probability, stockout_probability, days_of_cover, -days_of_cover, -estimated_investment, -suggested_qty] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Lista paginada con `run` y `disclaimer`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Recommendation' } }
                      run: { $ref: '#/components/schemas/RunRef' }
                      disclaimer: { type: string }
  /inventory/recommendations/{id}:
    patch:
      tags: [Inventario]
      summary: Registrar el estado de una recomendación (no ejecuta pedidos)
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [open, acknowledged, dismissed, ordered] } } } } }
      responses:
        '200': { description: Actualizada }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /inventory/summary:
    get:
      tags: [Inventario]
      summary: Resumen de inventario y riesgos
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/BranchId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      snapshot_date: { type: [string, 'null'], format: date }
                      has_inventory: { type: boolean }
                      products_with_stock: { type: integer }
                      series_out_of_stock: { type: integer }
                      total_on_hand_value: { type: number }
                      series_without_cost: { type: integer }
                      risk_counts: { type: object, properties: { low: { type: integer }, medium: { type: integer }, high: { type: integer }, critical: { type: integer } } }
                      purchase_investment: { type: [number, 'null'] }
                      coverage_days_median: { type: [number, 'null'] }
  /alerts:
    get:
      tags: [Alertas]
      summary: Listar alertas
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: status, in: query, schema: { type: string, enum: [open, acknowledged, resolved] } }
        - { name: type, in: query, schema: { type: string } }
        - { name: severity, in: query, schema: { type: string, enum: [info, warning, critical] } }
      responses:
        '200': { description: Lista paginada de alertas }
  /alerts/{id}:
    patch:
      tags: [Alertas]
      summary: Reconocer o resolver una alerta
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [open, acknowledged, resolved] } } } } }
      responses:
        '200': { description: Actualizada }
        '404': { $ref: '#/components/responses/NotFound' }
  /scenarios/simulate:
    post:
      tags: [Escenarios]
      summary: Simulación determinista (no persiste)
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ScenarioRequest' } } }
      responses:
        '200': { description: Resultado, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/ScenarioResult' } } } } } }
        '402': { $ref: '#/components/responses/PlanLimit' }
        '422': { $ref: '#/components/responses/Validation' }
  /scenarios:
    get:
      tags: [Escenarios]
      summary: Escenarios guardados
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      responses:
        '200': { description: Lista paginada }
    post:
      tags: [Escenarios]
      summary: Simular y guardar un escenario
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ScenarioRequest'
                - type: object
                  required: [name]
                  properties: { name: { type: string, maxLength: 150 } }
      responses:
        '201': { description: Guardado (incluye `results`) }
  /scenarios/{id}:
    get:
      tags: [Escenarios]
      summary: Ver escenario guardado
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      tags: [Escenarios]
      summary: Eliminar escenario
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/Id' }]
      responses: { '204': { description: Eliminado }, '404': { $ref: '#/components/responses/NotFound' } }
  /exports/forecasts.csv:
    get:
      tags: [Exportaciones]
      summary: Pronóstico por producto (resumen o por período si se indica granularity)
      description: Requiere `data.export`. UTF-8 con BOM. Queda auditado (`data.exported`).
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/Horizon'
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/Granularity'
        - $ref: '#/components/parameters/Delimiter'
      responses:
        '200': { description: CSV, content: { text/csv: { schema: { type: string } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /exports/recommendations.csv:
    get:
      tags: [Exportaciones]
      summary: Recomendaciones de abastecimiento
      parameters: [{ $ref: '#/components/parameters/TenantHeader' }, { $ref: '#/components/parameters/RunId' }, { $ref: '#/components/parameters/Delimiter' }]
      responses: { '200': { description: CSV, content: { text/csv: { schema: { type: string } } } } }
  /exports/accuracy.csv:
    get:
      tags: [Exportaciones]
      summary: Evaluaciones de modelos
      description: 'El CSV de siempre: las filas por segmento y la evaluación prospectiva del shadow (V2.5 · W3) solo salen con `level=segment` o `evaluation_type=shadow_prospective`; el detalle de calidad está en GET /models/evaluations.'
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RunId'
        - { name: evaluation_type, in: query, schema: { type: string, enum: [backtest, selection_windows, realized, shadow_prospective] } }
        - { name: level, in: query, schema: { type: string, enum: [overall, demand_class, horizon, horizon_total, branch, category, product, series, total, segment] } }
        - $ref: '#/components/parameters/Delimiter'
      responses: { '200': { description: CSV, content: { text/csv: { schema: { type: string } } } } }
  /exports/sales-summary.csv:
    get:
      tags: [Exportaciones]
      summary: Resumen de ventas válidas por período
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/Granularity'
        - $ref: '#/components/parameters/Delimiter'
      responses: { '200': { description: CSV, content: { text/csv: { schema: { type: string } } } } }
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: predictily-session, description: 'SPA: GET /sanctum/csrf-cookie y luego enviar X-XSRF-TOKEN'}
    bearerToken: {type: http, scheme: bearer}
  parameters:
    TenantHeader: { name: X-Tenant-ID, in: header, required: true, schema: { type: string, format: uuid } }
    Id: { name: id, in: path, required: true, schema: { type: integer } }
    RunId: { name: run_id, in: query, description: 'Por defecto, la ejecución vigente', schema: { type: integer } }
    BranchId: { name: branch_id, in: query, schema: { type: integer } }
    CategoryId: { name: category_id, in: query, schema: { type: integer } }
    ProductId: { name: product_id, in: query, schema: { type: integer } }
    Granularity: { name: granularity, in: query, schema: { type: string, enum: [day, week, month] } }
    Horizon: { name: horizon, in: query, description: 'Por defecto settings.default_horizon_days de la empresa', schema: { type: integer, enum: [7, 14, 15, 30, 60, 90] } }
    Delimiter: { name: delimiter, in: query, schema: { type: string, enum: [',', ';'], default: ',' } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1 } }
    PerPage: { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
  responses:
    NotFound: { description: No existe o pertenece a otra empresa, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Sin permiso para la acción (code forbidden), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Validation: { description: Error de validación, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    PlanLimit:
      description: Límite del plan
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              code: { type: string, const: plan_limit_exceeded }
              limit: { type: string }
              current: { type: [number, 'null'] }
              max: { type: [number, 'null'] }
  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
        code: { type: string }
        errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
    ModelDecisionBody:
      type: object
      properties:
        reason: { type: [string, 'null'], maxLength: 1000, description: 'Justificación opcional (queda en el evento de auditoría)' }
    ModelRegistryEvent:
      type: object
      description: Una transición del ciclo de vida de un modelo (solo inserción)
      properties:
        id: { type: integer }
        from_status: { type: [string, 'null'], description: 'Nulo en la línea base' }
        to_status: { type: string, enum: [candidate, validated, approved, production, retired, rejected, failed] }
        actor_user_id: { type: [integer, 'null'] }
        actor_kind: { type: string, enum: [user, system, cli] }
        reason: { type: [string, 'null'] }
        evidence: { type: object, additionalProperties: true, description: 'Compuertas (firma, gate de datos, política), alcance y base de servicio' }
        created_at: { type: string, format: date-time }
    ModelRegistryDetail:
      type: object
      description: Modelo del registro con su historial; los campos de la lista de GET /models más los siguientes
      additionalProperties: true
      properties:
        id: { type: integer }
        version: { type: string }
        model_family: { type: string }
        status: { type: string, enum: [candidate, validated, approved, production, retired, rejected, failed] }
        serving_basis: { type: string, enum: [approved, legacy_pipeline, not_approved] }
        published_by: { type: [integer, 'null'] }
        published_env: { type: [string, 'null'] }
        published_at: { type: [string, 'null'], format: date-time }
        approved_by: { type: [integer, 'null'] }
        approved_at: { type: [string, 'null'], format: date-time }
        rejected_reason: { type: [string, 'null'] }
        previous_model_registry_id: { type: [integer, 'null'] }
        promotion_decision_id: { type: [integer, 'null'] }
        events: { type: array, items: { $ref: '#/components/schemas/ModelRegistryEvent' } }
        promotion_decision: { type: [object, 'null'], additionalProperties: true }
        published: { type: boolean }
        retired_model_ids: { type: array, items: { type: integer }, description: 'Solo en la respuesta de promote' }
    ModelQualityEvaluation:
      type: object
      description: >-
        Fila de `model_evaluations` con su segmento, denominador y cobertura. `quality` (Demand), `calibration` (Customer, nivel segmento) y `shadow`
        (evaluación prospectiva) son null cuando no aplican. Con `status = insufficient_data` no hay cifras de error (`figures_available = false`).
      properties:
        id: { type: integer }
        core: { type: string, enum: [demand, customer] }
        forecast_run_id: { type: [integer, 'null'] }
        core_run_id: { type: [integer, 'null'] }
        model_registry_id: { type: [integer, 'null'] }
        model_family: { type: string, description: 'selection = el modelo servido; seasonal_naive = baseline' }
        label: { type: string }
        roles: { type: array, items: { type: string, enum: [selected, baseline, best_statistical, ml] } }
        evaluation_type: { type: string }
        level: { type: string }
        level_key: { type: [string, 'null'] }
        segment:
          type: [object, 'null']
          properties:
            dimension: { type: string }
            value: { type: string }
        horizon_days: { type: [integer, 'null'] }
        is_baseline: { type: boolean }
        is_selected: { type: boolean }
        status: { type: [string, 'null'], description: 'ok | insufficient_data (Demand); calibrated | miscalibrated | insufficient_data (Customer, segmento); validated | not_validated | insufficient_data (Customer, ventana de recompra)' }
        figures_available: { type: boolean }
        wape: { type: [number, 'null'], description: 'null si el denominador es 0 o menor que el mínimo (wape_unstable) o la fila es insufficient_data' }
        mae: { type: [number, 'null'] }
        rmse: { type: [number, 'null'] }
        bias: { type: [number, 'null'] }
        coverage_80: { type: [number, 'null'] }
        coverage_95: { type: [number, 'null'] }
        n_obs: { type: integer }
        n_windows: { type: integer }
        cutoffs: { type: array, items: { type: string, format: date } }
        quality:
          type: [object, 'null']
          description: Calidad de una fila de Demand
          properties:
            metrics_version: { type: [string, 'null'] }
            status: { type: [string, 'null'] }
            insufficient_reasons: { type: array, items: { type: object, additionalProperties: true } }
            wape_status: { type: [string, 'null'], enum: [ok, unstable, undefined, null] }
            wape_unstable: { type: boolean }
            wape_raw: { type: [number, 'null'], description: 'WAPE crudo cuando el denominador es positivo pero menor que el mínimo' }
            denominator:
              type: [object, 'null']
              properties:
                sum_actual: { type: [number, 'null'], description: 'Σ de lo realmente vendido (unidades) sobre los días evaluables' }
                unit: { type: string }
                min_required: { type: [number, 'null'] }
            alternative_metric: { type: [object, 'null'], additionalProperties: true, description: 'Métrica alternativa explícita (aggregate_absolute_error o mase) con `used_because`' }
            mase: { type: [number, 'null'] }
            rmsse: { type: [number, 'null'] }
            sum_abs_error: { type: [number, 'null'] }
            pinball: { type: [object, 'null'], properties: { p10: { type: [number, 'null'] }, p50: { type: [number, 'null'] }, p90: { type: [number, 'null'] } } }
            interval_width: { type: [object, 'null'], additionalProperties: { type: [number, 'null'] }, description: 'Anchura media de los intervalos 80 y 95' }
            sample:
              type: [object, 'null']
              additionalProperties: true
              description: 'evaluable_days, excluded_days, total_days, evaluable_share, n_series, n_windows y exclusions por causa (stockout_days, missing_source_days, closed_days, scale_undefined)'
            stability:
              type: [object, 'null']
              properties:
                status: { type: [string, 'null'] }
                n_windows: { type: [integer, 'null'] }
                wape_mean: { type: [number, 'null'] }
                wape_std: { type: [number, 'null'] }
                wape_cv: { type: [number, 'null'] }
                unstable_across_windows: { type: [boolean, 'null'] }
            comparison:
              type: [object, 'null']
              description: Solo en la fila del modelo servido, frente al baseline
              properties:
                baseline_family: { type: [string, 'null'] }
                verdict: { type: [string, 'null'], enum: [better, similar, worse, not_comparable, not_available, null] }
                metric: { type: [string, 'null'], enum: [wape, aggregate_absolute_error, null] }
                value: { type: [number, 'null'] }
                baseline_value: { type: [number, 'null'] }
                relative_improvement: { type: [number, 'null'] }
                reason: { type: [string, 'null'] }
        calibration:
          type: [object, 'null']
          description: Calibración de un segmento del Customer Core (frecuencia, valor, antigüedad, historia)
          properties:
            status: { type: [string, 'null'], enum: [calibrated, miscalibrated, insufficient_data, null] }
            n: { type: [integer, 'null'] }
            n_positive: { type: [integer, 'null'] }
            base_rate: { type: [number, 'null'] }
            mean_predicted: { type: [number, 'null'] }
            mean_ratio: { type: [number, 'null'] }
            brier: { type: [number, 'null'] }
            log_loss: { type: [number, 'null'] }
            ece: { type: [number, 'null'] }
            reference_brier: { type: [number, 'null'] }
            brier_delta_vs_reference: { type: [number, 'null'] }
            reason: { type: [string, 'null'] }
        shadow:
          type: [object, 'null']
          description: Evaluación prospectiva del challenger (nunca servido)
          properties:
            served: { type: boolean, const: false }
            scope: { type: string }
            wape_status: { type: [string, 'null'], enum: [ok, unstable, undefined, null], description: 'Estabilidad del WAPE según lo realmente vendido en lo evaluado (misma regla que las filas de segmento)' }
            wape_unstable: { type: boolean, description: 'true: el WAPE, el sesgo, el WAPE del servido y la mejora relativa son null' }
            denominator:
              type: [object, 'null']
              properties:
                sum_actual: { type: [number, 'null'] }
                unit: { type: string }
                min_required: { type: [number, 'null'] }
            served_wape_same_series_days: { type: [number, 'null'] }
            relative_improvement_vs_served: { type: [number, 'null'] }
            n_served_compared: { type: [integer, 'null'] }
            sum_actual: { type: [number, 'null'] }
            n_series: { type: [integer, 'null'] }
            coverage_80_n: { type: [integer, 'null'] }
            evaluated:
              type: object
              description: 'Período REALMENTE evaluado (no el de las predicciones). Fechas y días son null en filas anteriores a W3-D.'
              properties:
                first_date: { type: [string, 'null'], format: date }
                last_date: { type: [string, 'null'], format: date }
                n_days: { type: [integer, 'null'] }
                n_series_days: { type: [integer, 'null'] }
                n_series: { type: [integer, 'null'] }
            exclusions: { type: object, additionalProperties: true }
        metrics: { type: [object, 'null'], additionalProperties: true, description: 'jsonb del motor, sin transformar' }
        extra: { type: [object, 'null'], additionalProperties: true }
        created_at: { type: [string, 'null'], format: date-time }
    PromotionGate:
      type: object
      properties:
        status: { type: string, enum: [pass, fail, not_evaluable, not_applicable, pending] }
        blocking: { type: boolean }
        message: { type: string }
        evidence: { type: object, additionalProperties: true }
    PromotionDecision:
      type: object
      properties:
        id: { type: integer }
        core: { type: string, enum: [demand, customer] }
        forecast_run_id: { type: [integer, 'null'] }
        core_run_id: { type: [integer, 'null'] }
        scope_key: { type: string, description: 'global, class:<clase>, horizon:<H>' }
        scope:
          type: object
          properties:
            type: { type: string }
            value: { type: [string, 'null'] }
        policy: { type: string, enum: [legacy, v25] }
        policy_version: { type: string, description: 'SHA-256 de los parámetros de la política' }
        candidate_family: { type: string }
        candidate_label: { type: string }
        champion_family: { type: [string, 'null'] }
        champion_label: { type: [string, 'null'] }
        candidate_model_registry_id: { type: [integer, 'null'] }
        champion_model_registry_id: { type: [integer, 'null'] }
        decision: { type: string, enum: [promote, reject, keep_champion, publish_baseline, shadow] }
        is_effective: { type: boolean, description: 'true = esta política gobernó lo servido en la ejecución' }
        informational: { type: boolean, description: 'Alcance informativo (p. ej. por horizonte): no gobierna lo servido' }
        served_family: { type: [string, 'null'], description: 'Lo que la política dejó servido en el alcance' }
        served_label: { type: [string, 'null'] }
        planned_family: { type: [string, 'null'], description: 'Familia planeada cuando el entrenamiento final recurrió a un respaldo' }
        fallback_applied: { type: boolean }
        gates: { type: object, additionalProperties: { $ref: '#/components/schemas/PromotionGate' } }
        gates_summary: { type: object, additionalProperties: { type: integer } }
        failed_gates: { type: array, items: { type: string } }
        metrics: { type: object, additionalProperties: true }
        reason: { type: string }
        approval:
          type: object
          description: Aprobación humana separada (W4 · S06)
          properties:
            status: { type: string, enum: [pending, approved] }
            approved_by: { type: [integer, 'null'] }
            approved_at: { type: [string, 'null'], format: date-time }
        decided_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
    PromotionRunRef:
      type: [object, 'null']
      properties:
        id: { type: integer }
        version: { type: integer }
        run_type: { type: string }
        cutoff_date: { type: [string, 'null'], format: date }
        is_current: { type: boolean }
    PromotionSummary:
      type: [object, 'null']
      description: Resumen de las decisiones de una ejecución de Demand; null si la ejecución no tiene decisiones (anterior a W3)
      properties:
        governing_policy: { type: [string, 'null'], enum: [legacy, v25, null] }
        governing_source: { type: string, enum: [run_config, decisions] }
        policies:
          type: object
          additionalProperties:
            type: object
            properties:
              policy_version: { type: [string, 'null'] }
              decisions: { type: integer }
              effective: { type: integer }
              by_decision: { type: object, additionalProperties: { type: integer } }
        agreement:
          type: object
          properties:
            scopes_compared: { type: integer }
            same_served: { type: integer }
            different:
              type: array
              items:
                type: object
                properties:
                  scope_key: { type: string }
                  legacy_served_family: { type: [string, 'null'] }
                  v25_served_family: { type: [string, 'null'] }
    ShadowForecastSummary:
      type: object
      description: Predicciones del challenger que no se sirven (nunca incluye los valores)
      properties:
        forecast_run_id: { type: integer }
        model_family: { type: string }
        label: { type: string }
        model_registry_id: { type: [integer, 'null'] }
        served: { type: boolean, const: false }
        n_values: { type: integer }
        n_nodes: { type: integer }
        first_target_date: { type: [string, 'null'], format: date }
        last_target_date: { type: [string, 'null'], format: date }
        status: { type: string, enum: [evaluated, pending] }
        n_obs_evaluated: { type: [integer, 'null'] }
    PaginationEnvelope:
      type: object
      properties:
        meta: { type: object, properties: { current_page: { type: integer }, per_page: { type: integer }, total: { type: integer }, last_page: { type: integer } } }
        links: { type: object }
    RunRef:
      type: [object, 'null']
      properties:
        id: { type: integer }
        version: { type: integer }
        generated_at: { type: [string, 'null'], format: date-time }
        cutoff_date: { type: [string, 'null'], format: date }
    TrainingJob:
      type: object
      properties:
        id: { type: integer }
        job_type: { type: string, enum: [forecast_pipeline, evaluate_actuals, readiness, retrain_check] }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        stage: { type: [string, 'null'] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        attempts: { type: integer }
        error_message: { type: [string, 'null'] }
        queued_at: { type: [string, 'null'], format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        duration_ms: { type: [integer, 'null'] }
        result: { type: [object, 'null'] }
        forecast_run_id: { type: [integer, 'null'] }
    HorizonSupport:
      type: object
      description: |-
        Respaldo de un horizonte. `insufficient_data` (ESTADO) = historia < 2×H o backtest sin ventanas de H días (no presentar como completo). El motivo
        es un CÓDIGO: `reason_code` = `coverage_insufficient` (historia/backtest insuficiente) o `insufficient_horizon` (sin ventanas completas de H días); `code`
        conserva el código histórico (`history_lt_2h`, `no_backtest`, `backtest_horizon_lt_h`, `no_evaluated_observations`, `no_independent_holdout`).
      properties:
        horizon: { type: integer, enum: [7, 14, 15, 30, 60, 90] }
        status: { type: string, enum: [ok, degraded, insufficient_data, not_computed, unknown] }
        reasons: { type: array, items: { type: object, properties: { code: { type: string }, reason_code: { type: string }, message: { type: string } } } }
        history_days: { type: [integer, 'null'] }
        required_history_days: { type: [integer, 'null'] }
        backtest_horizon_days: { type: [integer, 'null'] }
        independent_holdout: { type: [boolean, 'null'] }
        evaluated_obs: { type: [integer, 'null'] }
    DemandEnvelope:
      type: object
      description: Envoltura común de resultados (ADR-V2-03) para la demanda. `status` = estado técnico del trabajo; `quality_status` = aptitud estadística.
      properties:
        tenant_id: { type: integer }
        run_id: { type: integer }
        core: { type: string, enum: [demand] }
        run_version: { type: integer }
        status: { type: string }
        as_of: { type: [string, 'null'], format: date }
        horizon_start: { type: [string, 'null'], format: date }
        horizon_end: { type: [string, 'null'], format: date }
        target_definition: { type: object }
        entity_keys: { type: array, items: { type: string } }
        unit: { type: [string, 'null'] }
        currency: { type: [string, 'null'] }
        result_type: { type: string, enum: [forecast] }
        model_version: { type: [object, 'null'] }
        data_snapshot_id: { type: [integer, 'null'] }
        config_version: { type: [string, 'null'] }
        assumptions: { type: array, items: { type: string } }
        limitations: { type: array, items: { type: string } }
        limitation_codes: { type: array, items: { type: string } }
        quality_status: { type: [string, 'null'], enum: [ok, degraded, insufficient_data, not_configured, insufficient_evidence, null] }
        uncertainty_source: { type: string, enum: [empirical_holdout, conformal, model, unknown, none] }
        horizon_support: { description: 'Un HorizonSupport (series, listados) o un mapa horizonte → HorizonSupport (detalle de la ejecución)' }
        p50: { type: [boolean, 'null'], description: 'true si la mediana se evaluó y se publica' }
    ForecastRun:
      type: object
      properties:
        id: { type: integer }
        version: { type: integer }
        run_type: { type: string, enum: [production, historical] }
        status: { type: string, enum: [queued, running, completed, failed, cancelled] }
        triggered_by: { type: string }
        horizon_days: { type: integer }
        cutoff_date: { type: [string, 'null'], format: date }
        data_from: { type: [string, 'null'], format: date }
        data_to: { type: [string, 'null'], format: date }
        feature_set_version: { type: [string, 'null'] }
        config_version: { type: [string, 'null'], description: 'Hash de la configuración efectiva (etapa 2)' }
        data_snapshot_id: { type: [integer, 'null'], description: 'Huella de los insumos de la ejecución (data_snapshots)' }
        effective_config: { type: [object, 'null'] }
        evaluation_manifest: { type: [object, 'null'], description: 'Protocolo de evaluación (solo en el detalle de la ejecución)' }
        envelope: { $ref: '#/components/schemas/DemandEnvelope' }
        is_current: { type: boolean }
        options: { type: object }
        selection: { type: [object, 'null'] }
        summary: { type: [object, 'null'] }
        error_message: { type: [string, 'null'] }
        started_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        training_job: { $ref: '#/components/schemas/TrainingJob' }
    PaginatedForecastRuns:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/ForecastRun' } }
    SeriesResponse:
      type: object
      properties:
        node: { type: object, properties: { key: { type: string }, level: { type: string }, label: { type: string } } }
