              yhat: { type: number }
              lo_80: { type: [number, 'null'] }
              hi_80: { type: [number, 'null'] }
              lo_95: { type: [number, 'null'] }
              hi_95: { type: [number, 'null'] }
              revenue: { type: [number, 'null'] }
