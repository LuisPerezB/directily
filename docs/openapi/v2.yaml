        '409': {description: 'El registro ya fue resuelto o superado (`invalid_state`), o sobrescribiría una versión más nueva (`newer_version_exists`, con `context.current_versions`)'}
        '422':
          description: 'Sigue sin ser válido (`quarantine_still_invalid`, con `findings`) o un mapeo de valores fuera del vocabulario canónico'
