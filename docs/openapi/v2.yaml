    post:
      tags: [Core de Datos]
      summary: Liberar un registro de cuarentena
      description: 'Revalida con los mapeos de valores VIGENTES (la versión aprobada del mapeo SQL de la fuente, los de la importación y los `value_maps` que se envíen, que se validan contra el vocabulario canónico y, si la liberación tiene éxito, se guardan en la importación). Si el documento es válido lo escribe con `SalesDocumentWriter` en modo `incremental` (conocido desde la liberación) enlazado a su objeto Bronze; si no, 422 `quarantine_still_invalid` con los hallazgos que quedan. 409 `invalid_state` si ya fue liberado, descartado o superado. 409 `newer_version_exists` (con `context.current_versions`, la versión vigente) si el documento ya está en Silver con otro contenido, se escribió DESPUÉS de la cuarentena y no hay orden de fuente que decida: se descarta o se libera con `force=true`, que sobrescribe y queda auditado.


        Habilidad requerida: `imports.manage`.'
