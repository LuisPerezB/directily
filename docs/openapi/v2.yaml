          description: 'W5-D · perecibilidad: series con vida útil o lotes, merma FEFO proyectada (esperada y de demanda baja con los cuantiles ya persistidos), unidades vencidas en el estante y auditoría diaria del plan (`audit`). El detalle por serie (`series`, `audit.series`) solo con `?include=perishability_detail`. Un producto sin vida útil ni lotes se planifica como durable y se declara.'
