            family:
              type: [string, 'null']
            role:
              type: [string, 'null']
              enum: [primary, fallback, null]
        quality_flags:
          type: array
          items: {type: string}
          description: 'Banderas de la fila. Las de S05 (`orders_nested_adjusted`, `cold_start`, `window_beyond_validation`, `s05_unavailable`, `s05_failed`) están en docs/ml/CUSTOMER_REPURCHASE.md §14'
        expected_orders:
          type: [number, 'null']
          description: E(nº de pedidos en el horizonte), de un modelo de conteo propio (no se deriva de la probabilidad); null = no estimado (nunca un cero inventado)
        quantity_per_order:
          type: [number, 'null']
          description: E(cantidad por pedido | el pedido ocurre)
        expected_units:
          type: [number, 'null']
          description: expected_orders × quantity_per_order bajo independencia (supuesto documentado); difiere de expected_quantity, que supone un solo evento
        window:
          $ref: '#/components/schemas/CustomerWindow'
        segment:
          type: [string, 'null']
          description: 'Segmento con que se calibró la fila (p. ej. `frequency:high`)'
    CustomerWindow:
      type: object
      description: >-
        Ventana probable de recompra: cuantiles del tiempo hasta la siguiente compra contado desde `as_of`; nunca un día exacto. Las cifras solo salen cuando el
        estado las respalda (`estimated`, `overdue`); con `insufficient_data` (sin evidencia de cobertura validada, historial insuficiente), `censored` (producto
        sin stock al corte) o sin estado (corrida anterior a S05) los cuantiles son null. `overdue` = atrasado respecto a su patrón: no es abandono.
      properties:
        status:
          type: [string, 'null']
          enum: [estimated, insufficient_data, overdue, censored, null]
        p10_days: {type: [number, 'null']}
        p50_days: {type: [number, 'null']}
        p90_days: {type: [number, 'null']}
    CustomerProfile:
      type: object
