                  definitions: {type: object, additionalProperties: {type: string}}
                  status_map:
                    type: object
                    properties:
                      version: {type: string}
                      table:
                        type: array
                        items: {$ref: '#/components/schemas/AgendaStatusMapRow'}
        '402': {$ref: '#/components/responses/PlanLimit'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Validation'}
      x-ability: forecast.view
  /customers/{id}/predictions:
    get:
      tags: [Revenue Radar]
      summary: Predicciones de compra de un comprador (alias de /customer/predictions?customer_id=)
      description: |-
