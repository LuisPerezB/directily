            mip_gap, costos, unmet_units_total, note. Fecha de corte: as_of (datos hasta ese día; null si se desconoce), today (hoy en la zona horaria de la empresa),
            timezone y as_of_age_days (today - as_of: 0 = el plan se calculó con datos de hoy; > 0 = datos desactualizados, conviene regenerarlo; null = sin fecha de corte).'
