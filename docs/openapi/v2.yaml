      summary: Objetos Bronze de la empresa (metadatos)
      description: |-
        Metadatos de los objetos originales inmutables guardados antes de normalizar (SHA-256, tamaño, procedencia, versión de esquema, retención, estado). NUNCA incluye la clave del almacén ni el contenido. Solo la empresa activa.

        Habilidad requerida: `data.view`.
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      - {name: entity, in: query, schema: {type: string, pattern: '^[a-z_]{2,30}$'}}
      - {name: kind, in: query, schema: {type: string, enum: [file_upload, sql_extract, api_batch, bridge_batch]}}
      - {name: status, in: query, schema: {type: string, enum: [stored, processed, quarantined, purged]}}
      - {name: data_source_id, in: query, schema: {type: integer}}
      - {name: sha256, in: query, schema: {type: string, pattern: '^[a-f0-9]{64}$'}}
      - {name: received_from, in: query, schema: {type: string, format: date}}
      - {name: received_to, in: query, schema: {type: string, format: date}}
      - {name: per_page, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
      responses:
        '200':
          description: Objetos más recientes primero
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/BronzeObject'}
                  meta: {$ref: '#/components/schemas/PageMeta'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Validation'}
      x-ability: data.view
