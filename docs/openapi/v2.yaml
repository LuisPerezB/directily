  /radar/opportunities/materialize:
    post:
      tags: [Revenue Radar]
      summary: Proponer al Decision Engine las oportunidades de la predicción vigente
      description: |-
        Convierte la predicción de comportamiento vigente (producción, completada) en oportunidades por relación cliente × producto y las **propone al Decision Engine** por `RecommendationSink::propose()` (el Radar nunca escribe recomendaciones por su cuenta): contacto (P(≥ 1 compra) ≥ `min_probability` de la política `radar-v1`) y recuperación (ventana de recompra atrasada con historia suficiente). La economía unitaria, la disponibilidad, el puntaje, la prioridad, el vencimiento y el experimento los resuelve el Decision Engine. La recuperación y el riesgo a nivel de cliente los genera el propio Decision Engine (`predictily:decisions-generate`).

        Idempotente: con los mismos insumos no crea nada nuevo (`existing`). Una oportunidad que falla se cuenta en `failed` y no detiene las demás (`status = partial`). El comando `predictily:radar-materialize` hace lo mismo para todas las empresas (programado a las 04:50, tras la predicción diaria). 503 `decision_engine_unavailable` si el motor de decisiones no está registrado.

        Habilidad requerida: `forecast.run`.
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                horizons:
                  type: array
                  description: 'Solo estos horizontes (por defecto, todos los de la predicción que el plan permite).'
