                  type: object
                  description: '`{document_type: {"<crudo>": "<canónico>"}, status: {...}}`'
                  additionalProperties: true
                force:
                  type: boolean
                  default: false
                  description: 'Confirma explícitamente sobrescribir una versión vigente MÁS NUEVA del mismo documento (409 `newer_version_exists`); queda auditado'
      responses:
        '200':
          description: Registro liberado y resultado de la escritura
