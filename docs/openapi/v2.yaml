                  data: {$ref: '#/components/schemas/BronzeObject'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      x-ability: data.view
  /lineage/bronze/{id}/content:
    get:
      tags: [Linaje e identidades]
      summary: Descargar el contenido original de un objeto Bronze
      description: |-
        Solo propietario/administrador. Verifica el SHA-256 al leer y entrega SIEMPRE un adjunto binario (`application/octet-stream`, `nosniff`, nombre generado por el servidor). Cada descarga queda en la bitácora (`bronze.downloaded`). 410 `bronze_purged` si el contenido fue purgado por retención; 409 `bronze_integrity` si no coincide con su SHA-256 o falta en el almacén (queda `bronze.integrity_failed`).

        Habilidad requerida: `datasources.manage`.
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: Contenido original íntegro
          headers:
            X-Content-SHA256: {schema: {type: string}, description: SHA-256 del contenido verificado}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '409': {description: 'Integridad no verificable (code bronze_integrity)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '410': {description: 'Contenido purgado por retención (code bronze_purged)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      x-ability: datasources.manage
  /lineage/reconciliation:
    get:
      tags: [Linaje e identidades]
      summary: Informes de reconciliación fuente → Bronze → Silver → Gold
      description: |-
        Informes por carga (`import`, `sync`) y por ventana (`window`, comando `predictily:reconcile`). Una capa sin datos o no comparable se reporta con su razón en `unavailable_layers` y en una discrepancia `layer_not_compared`: nunca se inventan cifras y nunca hay `balanced` sin comparar. `from`/`to` devuelven los informes cuya ventana se solapa con ese rango.

        Habilidad requerida: `data.view`.
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      - {name: scope, in: query, schema: {type: string, enum: [import, sync, window]}}
      - {name: entity, in: query, schema: {type: string, pattern: '^[a-z_]{2,30}$'}}
      - {name: status, in: query, schema: {type: string, enum: [balanced, explained, unexplained]}}
      - {name: from, in: query, schema: {type: string, format: date}}
      - {name: to, in: query, schema: {type: string, format: date}}
      - {name: per_page, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
      responses:
        '200':
          description: Informes más recientes primero
          content:
