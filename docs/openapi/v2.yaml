  # <<< W2-B
  # >>> W5-A revenue radar y agenda comercial (ADR-V25-12; V25-AGD-001..021)
  /radar/summary:
    get:
      tags: [Revenue Radar]
      summary: Resumen del Revenue Radar por horizonte (oportunidades y valor potencial)
      description: |-
        Conteos por horizonte y tipo, clientes distintos, desglose por estado heredado e inventario **dentro de cada horizonte** (`by_horizon[h]`), y valor potencial **por horizonte**. Nada se suma entre horizontes (las ventanas se solapan y se contaría dos veces la misma compra): `totals` cuenta relaciones **distintas** (tipo, cliente, producto) y lleva su unidad en `unit`. `value` es el **pronóstico** de las relaciones cliente × producto (`basis_code = forecast_units_x_last_net_price`), rotulado **«Oportunidad potencial, atribución no demostrada»**: un supuesto (unidades esperadas × último precio neto), no una venta confirmada ni causada por el contacto; `contribution` solo suma las oportunidades que el Decision Engine valoró con costo confiable y `contribution_unavailable` dice cuántas no la tienen. `customer_level` es lo de **nivel de cliente** (recuperación y riesgo): su importe es la **caída observada del gasto neto** (`basis_code = observed_spend_decline`), que no es pronóstico ni contribución y **no se suma a `value`**.

        Las oportunidades del grupo de control de un experimento no se cuentan; `control_withheld` (cuántas se retienen) solo lo ve quien tiene `decisions.approve` y solo sin filtro de cliente o producto (con uno revelaría a qué cliente pertenece). La lista base es la de trabajo (vigentes, sin pedido recibido ni descartadas). Sin oportunidades propuestas pero con predicción vigente, `message` indica cómo generarlas. Sin predicción: `envelope.quality_status = insufficient_data`, nunca ceros inventados.

        Fachada sobre las recomendaciones del Decision Engine (no duplica su lógica). Plan sin Customer: 402 `features.customer`; horizonte fuera del plan: 402.

        Habilidad requerida: `forecast.view`.
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      - {$ref: '#/components/parameters/RadarFilterHorizon'}
      - {$ref: '#/components/parameters/RadarFilterKind'}
      - {$ref: '#/components/parameters/RadarFilterCustomer'}
      - {$ref: '#/components/parameters/RadarFilterProduct'}
      - {$ref: '#/components/parameters/RadarFilterSeller'}
