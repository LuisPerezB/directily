  /intelligence/events/{id}/verify:
    post:
      tags: [Factor Intelligence]
      summary: Verificar un evento propuesto
      description: 'SEGREGACIÓN: lo verifica un usuario distinto de quien lo propuso (403 `segregation_of_duties`). **Versión revisada:** el cuerpo (o el encabezado `If-Match`)
        debe traer el `review_token` del evento que el revisor leyó; sin él 422 `review_token_required`, y si el contenido cambió después de su lectura 409 `event_changed_since_review`
        (la comparación se hace con la fila bloqueada). Sin `published_at` no puede verificarse para uso predictivo (422 `published_at_required`); la procedencia debe estar completa
        (URL, autoridad, jurisdicción: 422 `provenance_incomplete`); uno vencido no se verifica (422 `event_expired`). Al verificar se fija `available_at` = el mayor entre ahora
        y `published_at`: el evento no existía para un backtest anterior.


        Habilidad requerida: `settings.manage`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [review_token]
              properties:
                review_token: {type: string, description: 'Versión revisada (campo `review_token` del evento); alternativa: encabezado If-Match'}
                note: {type: string, maxLength: 2000}
                corroboration:
                  type: string
                  enum: [single_source, corroborated, official]
      responses:
        '200':
          description: Evento verificado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/IntelligenceEvent'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Validation'}
      x-ability: settings.manage
