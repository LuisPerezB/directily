            is_generic: {type: boolean}
            segment:
              type: [string, 'null']
        status:
          type: string
          enum: [predicted, no_individual_prediction, no_candidate_relations, no_prediction_run]
        fallback:
          type: [string, 'null']
          description: Motivo cuando no hay predicción individual (código genérico, sin historial, sin relaciones)
