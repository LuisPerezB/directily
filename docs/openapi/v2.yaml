      description: 'Sugerencias: Predictily no envía pedidos ni compromete fondos.


        Devuelve la cabecera con totales y la fecha de corte (`plan.as_of`, `plan.today`, `plan.as_of_age_days`), el resumen de líneas y de demanda no atendida
        (`lines_summary`, `shortfalls_summary`), las sucursales del plan y una VISTA PREVIA acotada (las primeras 20) de `lines` y `shortfalls`: el listado completo
        y paginado está en `GET /supply/plans/{id}/lines` y `GET /supply/plans/{id}/shortfalls`. `actionable_now` de una línea significa «su fecha de emisión es la
        fecha de corte del plan», que solo equivale a «emitir hoy» cuando `plan.as_of_age_days` es 0.


        `balance` (balance por nodo y período del motor; cientos de KB en un plan real) es opt-in: por defecto vale `null` («no solicitado») y solo trae datos con
        `?include=balance`. Un valor de `include` fuera de la lista blanca responde 422.


        Habilidad requerida: `forecast.view`.'
