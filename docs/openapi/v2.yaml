                  type: object
                  additionalProperties: {type: number, exclusiveMinimum: 0, maximum: 100}
                  description: '{product_id: peso}'
                shortage_penalties:
                  type: object
                  additionalProperties: {type: number, exclusiveMinimum: 0}
                  description: '{product_id: penalización}'
                config:
                  type: object
                  properties:
                    holding_cost_rate_annual: {type: number}
