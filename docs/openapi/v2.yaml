      - {$ref: '#/components/parameters/RadarFilterCategory'}
      - {$ref: '#/components/parameters/RadarFilterState'}
      - {$ref: '#/components/parameters/RadarFilterStatus'}
      - {$ref: '#/components/parameters/RadarOrderBy'}
      - {$ref: '#/components/parameters/RadarDirection'}
      - {$ref: '#/components/parameters/Page'}
      - {$ref: '#/components/parameters/PerPage'}
      responses:
