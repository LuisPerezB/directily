  /decisions/{id}/transition:
    post:
      tags: [Decision Engine]
      summary: Transición del workflow (idempotente, con segregación de funciones y bloqueo optimista)
      description: |-
        Workflow `suggested → assigned → reviewed → approved | rejected → in_progress → executed → measured → closed` (+ `expired`). Una transición fuera de la tabla responde 409 `decision_transition_not_allowed`. `measured` y `expired` solo los pone el sistema.

        | Hacia | Desde | Habilidad | Reglas |
        |---|---|---|---|
        | `assigned` | `suggested` (asignar), `assigned` (reasignar) | `decisions.manage` | `expected_version` obligatorio; `assignee_user_id`: miembro con `decisions.manage`. Las de control no se asignan (409 `control_group_not_actionable` para quien aprueba; 404 para los demás). |
        | `reviewed` | `assigned` | `decisions.manage` | `expected_version` obligatorio. |
        | `approved` | `reviewed` | `decisions.approve` | `expected_version` obligatorio. Segregación: no aprueba quien la propuso ni quien debe ejecutarla (403 `decision_segregation_of_duties`). |
        | `rejected` | `reviewed` (rechazo formal) | `decisions.approve` | `expected_version` y `reason` obligatorios; misma segregación. |
        | `rejected` | `suggested`, `assigned` (descartar) | `decisions.manage` | `expected_version` y `reason` obligatorios. |
        | `in_progress` | `approved`; `reviewed` solo si no es sensible | `decisions.manage` | Una acción sensible (reposición, inventario-demanda, presupuesto, escenarios, sobre presupuesto o sobre el umbral de costo de la empresa) no pasa de `reviewed` sin aprobación (409 `decision_approval_required`). Quien aprobó no la ejecuta (403). Solo la persona asignada (o un supervisor con `decisions.approve`). |
        | `executed` | `in_progress` | `decisions.manage` | Mismas reglas de ejecución. Registrar la ejecución NO escribe en el ERP ni envía mensajes: la persona hizo la acción fuera de Predictily. |
        | `closed` | `measured` | `decisions.manage` | `expected_version` obligatorio. |

        **Idempotencia**: `idempotency_key` obligatorio; repetir la **misma petición** (misma clave, destino, usuario y cuerpo) devuelve el mismo resultado sin otro evento (`meta.idempotent_replay = true`) **si el rol sigue teniendo la habilidad con la que se hizo** (si no, 403); la misma clave con otro destino, otro cuerpo u otro usuario responde 409 `idempotency_key_reused`. **Concurrencia**: `expected_version` (la `version` leída) es **obligatoria en toda transición** (422 si falta) y, desfasada, responde 409 `decision_version_conflict` con `context.current_version`; la `version` es el id del último evento que cambia el estado o el seguimiento (los comentarios del sistema, como un refresco de linaje, no cuentan); la fila se bloquea durante la decisión. **Grupo de control**: para quien no tiene `decisions.approve` una recomendación de control responde 404, idéntico al de un id inexistente, antes de cualquier otra comprobación. Toda transición queda en `decision_events` (y en auditoría).

        Habilidad mínima: `decisions.manage`; la de aprobar o rechazar formalmente es `decisions.approve`.
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DecisionTransitionRequest'}
      responses:
        '200':
          description: Recomendación tras la transición (o su repetición idempotente)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/DecisionRecommendation'}
                  meta:
                    type: object
                    properties:
                      idempotent_replay: {type: boolean}
                      event_id: {type: integer}
        '403': {description: 'Sin la habilidad (code forbidden, required_ability) o segregación de funciones (code decision_segregation_of_duties, context.roles)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: 'code: decision_transition_not_allowed, decision_version_conflict, decision_approval_required, control_group_not_actionable, idempotency_key_reused', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {$ref: '#/components/responses/Validation'}
      x-ability: decisions.manage
  # <<< W5-B decision engine
  # >>> W5-C outcomes y ROI honestos (ADR-V25-14; §12)
  /decisions/outcomes:
    get:
      tags: [Outcomes y ROI]
      summary: Resultados medidos de las recomendaciones (lista con filtros)
      description: |-
        Solo lectura. Une cada recomendación con la acción registrada y el evento observable posterior en su **ventana fija** (`as_of + 1 … as_of + horizonte`), medida solo cuando la ventana cerró **más un margen de espera** (`settling_lag_days`, provisional, «a aprobar en el piloto»). Las ventas se leen **as-of** (tal como se conocían al cierre de ventana + margen): un documento ingerido después no entra en esa medición y se cuenta aparte (`evidence.source.late_lines_not_counted`). Las devoluciones y notas de crédito con fecha posterior al cierre de la ventana pero conocidas al corte se restan de las compras de la ventana (`evidence.observation.returns_after_window`); las posteriores al corte se informan sin restarse.

        Se miden **también** las ejecutadas, rechazadas, caducadas, no contactadas y el grupo de control (`action_kind`: `contacted`, `executed`, `not_contacted`, `not_executed`, `rejected`, `expired`, `control`). Una acción registrada **después** de cerrar la ventana no cuenta como atendida ni genera costo de contacto (`evidence.action.action_registered_after_window_at`). Lo aún no medible (ventana abierta o en espera) no aparece aquí: es «previsto» (`forecast`) y se informa en `GET /decisions/roi`.

        **Clasificación honesta** (`classification`) de cada FILA: `observed` (lo ocurrido; no se atribuye a ninguna acción) o `temporally_associated` (hubo una compra **posterior** a una acción registrada, sin contrafactual: NO causal). `incremental_estimated` es un resultado AGREGADO del experimento (`GET /decisions/roi`), no de una fila: ninguna fila se estampa con él (compre o no, la hayan contactado o no). `causally_attributable` **no lo produce** esta versión. Lo de nivel producto (reposición, inventario-demanda, presupuesto, escenarios) es siempre `observed`: no se afirma que una compra al proveedor cause las ventas posteriores.

        **Lo asociado a la acción** está en `after_action`: SOLO las compras emitidas después de la acción (netas de las devoluciones emitidas también después) y su contribución. La ventana completa (`observed_units`, `observed_net_amount`, `contribution`) es observación y puede incluir compras anteriores a la acción.

        **Contribución, no ingresos brutos**: `contribution` = importe neto − unidades netas × costo unitario **confiable** (W5-B); es `null` (con `contribution_status = unknown` y `contribution_reasons`) cuando el costo no es confiable y `0` cuando no hubo compra. `contact_cost` es el costo de la acción de la recomendación solo si hubo una acción registrada dentro de la ventana (`null` si no hay costo configurado: desconocido, no cero).

        **Control y experimento**: quien no puede aprobar (`decisions.approve`) no recibe NINGUNA información del control ni del experimento (ExperimentRedaction de W5-B): no se listan los resultados del control, `experiment_group` no aparece, `evidence` no trae `experiment`, `itt`, `unit` ni claves de experimento, y filtrar por `experiment_group` o `experiment_key` no devuelve nada. Sin datos personales: el comprador se identifica por id y código externo; `observed_ref` es `sale:<id>`.

        Habilidad requerida: `decisions.view`. Aislada por empresa.
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      - {name: kind, in: query, description: 'Uno o varios tipos de recomendación separados por coma.', schema: {type: string, example: 'contact,recovery'}}
      - {name: classification, in: query, description: 'Una o varias clasificaciones separadas por coma.', schema: {type: string, example: 'observed,temporally_associated'}}
      - {name: action_kind, in: query, description: 'Una o varias acciones separadas por coma.', schema: {type: string, example: 'rejected,expired,control'}}
      - {name: observed_event, in: query, description: 'Uno o varios eventos observables separados por coma.', schema: {type: string, example: 'purchase,stockout'}}
      - {name: horizon_days, in: query, schema: {type: integer, minimum: 1, maximum: 730}}
      - {name: experiment_key, in: query, description: 'Solo con decisions.approve; para los demás no devuelve nada.', schema: {type: string, maxLength: 80}}
      - {name: experiment_group, in: query, description: 'Solo con decisions.approve; para los demás no devuelve nada (no se revela quién quedó en cada grupo).', schema: {type: string, enum: [treatment, control]}}
      - {name: recommendation_id, in: query, schema: {type: integer}}
      - {name: customer_id, in: query, schema: {type: integer}}
      - {name: product_id, in: query, schema: {type: integer}}
      - {name: assigned_user_id, in: query, description: 'Responsable de la recomendación al medirla.', schema: {type: integer}}
      - {name: contribution_known, in: query, description: 'true = solo con contribución conocida; false = solo con contribución desconocida (costo no confiable).', schema: {type: boolean}}
      - {name: from, in: query, description: 'Periodo: corte (`as_of`) de la recomendación desde esta fecha.', schema: {type: string, format: date}}
      - {name: to, in: query, description: 'Periodo: corte (`as_of`) de la recomendación hasta esta fecha.', schema: {type: string, format: date}}
      - {name: sort, in: query, schema: {type: string, enum: ['-measured_at', measured_at, '-window_to', window_to, '-observed_net_amount', '-contribution', '-id', id], default: '-measured_at'}}
      - {$ref: '#/components/parameters/Page'}
      - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200':
          description: Resultados de la empresa activa
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/DecisionOutcome'}
                  meta: {$ref: '#/components/schemas/PageMeta'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Validation'}
      x-ability: decisions.view
  /decisions/roi:
    get:
      tags: [Outcomes y ROI]
      summary: ROI honesto con su método (potencial vs. observado vs. incremento estimado)
      description: |-
        Solo lectura. Separa siempre, sin sumarlos entre sí:

        - **Oportunidad potencial** (`summary.potential`): contribución esperada de las recomendaciones accionables, **por tipo y horizonte** (`cells`); no hay total entre tipos ni horizontes (contarían dos veces la misma venta). «Oportunidad potencial, atribución no demostrada»; no es ingreso recuperado.
        - **Observación** (`summary.observed`, `summary.associated`): lo ocurrido después, con **contribución conocida** (no ingresos brutos) y **sin doble conteo**: varias recomendaciones pueden observar la misma línea de venta (horizontes de 7 y 30 días, contacto y recuperación), así que los totales se deduplican por línea de venta distinta; la suma por recomendación queda aparte (`per_recommendation`) como detalle no aditivo. `associated` suma SOLO lo posterior a la acción registrada (neto de las devoluciones posteriores).
        - **Incremento estimado** (`experiments`, `roi`): solo con un experimento con grupo de control analizado por **intención de tratamiento** (ITT): tasa de conversión (diferencia de proporciones, intervalo de Newcombe) y contribución por unidad (diferencia de medias, **intervalo percentil bootstrap con semilla registrada**; el de Welch solo como diagnóstico), con tamaños de muestra e intervalo. El intervalo monetario exige un mínimo de **compradores por grupo** (`min_buyers_per_arm`, 10 por defecto, provisional) y varianza distinta de cero: si no, `contribution.status = not_estimable` y no hay cifra monetaria. Cada cliente entra una sola vez por experimento y horizonte; se informan las unidades descartadas por grupo (`dropped_units`) y el cociente de muestras frente a la fracción de control registrada (`sample_ratio`).

        **`roi.status`**: `potential_unproven` (sin grupo de control o con muestra insuficiente: **no hay cifra de ROI** y nunca se presenta como probado), `incremental_estimated` (incremento de contribución neto de costos de contacto, con intervalo; `significant = false` si el intervalo incluye 0), `incremental_conversion_only` (hay estimación de conversión pero no de contribución: sin cifra monetaria) o `multiple_experiments` (varios experimentos u horizontes no son aditivos: filtrar). `roi.proven` es siempre `false` y `roi.causal_claims` es `0`: esta versión no produce atribución causal. `roi.data_origin_warning` aparece mientras el origen de los datos no esté declarado como real (`data_origin`).

        **Quien no puede aprobar** (`decisions.approve`) no recibe información del control ni del experimento: se omiten `experiments`, `funnel.control_held_out`, `by_action_kind.control`, `control_baseline` y las filas del control dentro de los desgloses; `roi` solo muestra su estado, etiqueta y método, sin datos por grupo.

        **Periodo**: por el corte (`as_of`) de la recomendación. **Sin `from`/`to` se toman los últimos 180 días**; el rango no puede superar 730 días (422 `to`). Las filas se leen por bloques con paginación por clave (memoria acotada).

        **Costos**: el contacto es el `action_cost` de cada recomendación atendida dentro de la ventana (desconocido, no cero, si no está configurado); el costo de contacto del ROI sale de las unidades de tratamiento del propio análisis, no del filtro de tipo. El uso de plataforma (`tenant_usage_records`, W4) son **cantidades** y solo se convierte en dinero con los precios que la empresa configure (`outcomes.usage_prices`); sin precios `total_cost` es `null` (`no_price_model`).

        Los filtros de `kind` no aplican al análisis ITT (la unidad es el cliente). `limitations` enumera los límites del método.

        Habilidad requerida: `decisions.view`. Aislada por empresa.
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      - {name: kind, in: query, description: 'Uno o varios tipos de recomendación separados por coma (un valor desconocido devuelve un informe vacío, no «todos»).', schema: {type: string, example: 'contact'}}
      - {name: horizon_days, in: query, schema: {type: integer, minimum: 1, maximum: 730}}
      - {name: experiment_key, in: query, description: 'Solo con decisions.approve (para los demás no devuelve nada). Solo resultados de ese experimento: excluye lo aún previsto (no se conoce su experimento).', schema: {type: string, maxLength: 80}}
      - {name: from, in: query, description: 'Corte (`as_of`) desde esta fecha. Por omisión, 180 días antes de `to`.', schema: {type: string, format: date}}
      - {name: to, in: query, description: 'Corte (`as_of`) hasta esta fecha. Por omisión, hoy (zona de la empresa). El rango no puede superar 730 días.', schema: {type: string, format: date}}
      - {name: group_by, in: query, schema: {type: string, enum: [kind, horizon, segment, owner], default: kind}}
      responses:
        '200':
          description: Informe de ROI y outcomes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/OutcomeRoiReport'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {description: 'Validación: fechas inválidas, `to` anterior a `from`, o periodo de más de 730 días', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
      x-ability: decisions.view
  # <<< W5-C outcomes y ROI honestos
  # >>> W6-A seguridad Enterprise (ADR-V25-15; §15)
  # Rutas de CUENTA (`/auth/mfa/*` salvo el desafío, `/auth/tokens*`, `/admin/users/{user}/mfa-reset`, y `GET|POST /tenants`, `PUT /auth/password` en core.yaml): exigen una sesión de la SPA o un
  # token de INICIO DE SESIÓN completo (habilidades `*`, sin empresa). Un token restringido, de conector o ligado a una empresa recibe 403 `token_scope_insufficient`.
  /auth/mfa/challenge:
    post:
      tags: [Seguridad Enterprise]
      summary: Completar el inicio de sesión con el segundo factor
      description: |-
        Segundo paso de `POST /auth/login` cuando la persona tiene MFA activo (el primero responde 202 `mfa_required` con un `challenge` de un solo uso y corta vida, 5 minutos por defecto). Se envía el desafío y un código TOTP de 6 dígitos (RFC 6238, ventana de ±1 paso) o un código de recuperación. La respuesta es la de un inicio de sesión normal (sesión con cookie en la SPA; token Bearer en clientes API) y el acceso nace con el segundo factor «fresco».

        Un código TOTP no se acepta dos veces (el paso usado queda registrado). Cada intento, correcto o no, se cuenta antes de comprobarse, en tres niveles: 5 fallos seguidos desde una IP bloquean esa combinación persona + IP 15 minutos (423 `mfa_locked`, con `Retry-After`; la víctima, desde su IP, sigue pudiendo entrar), 30 fallos de cualquier persona desde una IP bloquean la IP, y 15 fallos seguidos de la persona desde varias IP la bloquean en todas partes. Durante un bloqueo ni un código correcto se acepta. Un desafío inexistente, vencido o ya usado responde 422 `mfa_challenge_invalid`; un desafío que otra petición está verificando en ese instante, 409 `mfa_challenge_busy` (se completa una sola vez, aunque se envíe en paralelo). Ninguna respuesta ni registro incluye el secreto o un código.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge]
              properties:
                challenge: {type: string, maxLength: 100}
                code: {type: string, description: 'Código TOTP de 6 dígitos. Obligatorio si no se envía recovery_code.'}
                recovery_code: {type: string, description: 'Código de recuperación de un solo uso (AAAA-BBBB-CCCC-DDDD).'}
      responses:
        '200':
          description: Inicio de sesión completado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: {$ref: '#/components/schemas/User'}
                      token: {type: string, description: 'Solo para clientes sin sesión (no SPA).'}
                      token_type: {type: string}
                      expires_at: {type: [string, 'null'], format: date-time}
                      mfa_method: {type: string, enum: [totp, recovery]}
                      recovery_codes_remaining: {type: integer, description: 'Solo cuando se usó un código de recuperación.'}
        '409': {description: 'Otra petición está verificando este mismo desafío (`mfa_challenge_busy`)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: 'Código incorrecto (`mfa_invalid_code`), desafío vencido o ya usado (`mfa_challenge_invalid`) o datos faltantes', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '423': {description: 'Bloqueo por intentos fallidos (`mfa_locked`, con `retry_after` y `Retry-After`)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {$ref: '#/components/responses/Error'}
  /auth/mfa:
    get:
      tags: [Seguridad Enterprise]
      summary: Estado propio del segundo factor
      description: |-
        Ruta de cuenta (403 `token_scope_insufficient` con un token restringido). Si está activo o pendiente de verificar el primer código, cuántos códigos de recuperación quedan (y cuántos están calculados con una clave de la aplicación anterior: `recovery_codes_on_previous_key`; regenerarlos antes de retirar `APP_PREVIOUS_KEYS`), el bloqueo vigente, si una política (empresa o plataforma) lo hace obligatorio (`required_by_policy`: entonces no se puede desactivar) y si el segundo factor de ESTA sesión o token está fresco para las acciones sensibles. Nunca devuelve el secreto ni los códigos.
      responses:
        '200':
          description: Estado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/MfaStatus'}
    delete:
      tags: [Seguridad Enterprise]
      summary: Desactivar el segundo factor
      description: |-
        Reautenticación con la contraseña y un código TOTP (o de recuperación). Borra el secreto, los códigos de recuperación y el estado de bloqueo, y revoca los demás tokens de inicio de sesión y las demás sesiones web (y cookies «recordarme») de la persona; los tokens de conector se conservan. 409 `mfa_required_by_policy` si una política de la empresa (propietarios y administradores) o de la plataforma (superadministrador) lo exige.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string}
                code: {type: string}
                recovery_code: {type: string}
      responses:
        '200': {description: 'Desactivado (`data.enabled` = false, `data.revoked_login_tokens`)'}
        '409': {description: 'No está activo (`mfa_not_enabled`) o una política lo exige (`mfa_required_by_policy`)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {$ref: '#/components/responses/Validation'}
        '423': {description: 'Bloqueo por intentos fallidos (`mfa_locked`)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /auth/mfa/setup:
    post:
      tags: [Seguridad Enterprise]
      summary: Iniciar la activación del segundo factor (secreto TOTP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, description: 'Contraseña ACTUAL: quien solo tiene una sesión o un token no puede enrolar su propio autenticador. Un error cuenta contra el mismo bloqueo que los códigos (422 `mfa_invalid_password`).'}
      description: |-
        Ruta de cuenta. Genera un secreto aleatorio de 160 bits (Base32) y la URI `otpauth://` para la aplicación autenticadora. El secreto se guarda CIFRADO con la clave de la aplicación y se devuelve SOLO aquí; el segundo factor aún no está activo hasta verificar el primer código (`/auth/mfa/confirm`). Repetir la llamada con la activación pendiente reemplaza el secreto. 409 `mfa_already_enabled` si ya está activo. Se audita como `mfa.enrolment_started` (sin el secreto).
      responses:
        '201':
          description: Secreto de activación
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/MfaSetup'}
        '409': {description: 'Ya está activo (`mfa_already_enabled`)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /auth/mfa/confirm:
    post:
      tags: [Seguridad Enterprise]
      summary: Verificar el primer código y activar el segundo factor
      description: |-
        Con un código TOTP válido activa el segundo factor, entrega los 10 códigos de recuperación (de un solo uso; se muestran UNA vez y se guardan solo como hash con clave de la aplicación), deja el segundo factor fresco y revoca los demás tokens de inicio de sesión y las demás sesiones web de la persona, que se emitieron sin segundo factor (la sesión o el token actual se conserva). Exige la contraseña actual. 409 `mfa_not_pending` si no hay activación pendiente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, password]
              properties:
                code: {type: string, description: 'Código TOTP de 6 dígitos'}
                password: {type: string, description: 'Contraseña ACTUAL (422 `mfa_invalid_password` si no es correcta)'}
      responses:
        '200':
          description: Activado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/MfaRecoveryCodes'}
        '409': {description: 'Sin activación pendiente (`mfa_not_pending`) o ya activo (`mfa_already_enabled`)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: 'Código incorrecto (`mfa_invalid_code`)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '423': {description: 'Bloqueo por intentos fallidos (`mfa_locked`)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /auth/mfa/step-up:
    post:
      tags: [Seguridad Enterprise]
      summary: Verificar el segundo factor para acciones sensibles (step-up)
      description: |-
        Quien tiene MFA activo debe haberlo verificado hace menos de 10 minutos (`security.mfa.step_up_ttl_seconds`) para las acciones sensibles: ajustes y política de seguridad de la empresa, usuarios y roles comerciales, fuentes de datos, tokens y dispositivos del Bridge, aprobación y promoción de modelos, aprobación o rechazo de decisiones, exportaciones, consentimiento, eliminación de la empresa y las modificaciones de plataforma. Sin él esas rutas responden 403 `mfa_step_up_required`. La marca vive en la sesión (SPA) o atada al token (cliente API) y desaparece con ellos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: {type: string}
                recovery_code: {type: string}
      responses:
        '200':
          description: Verificado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      verified: {type: boolean}
                      method: {type: string, enum: [totp, recovery]}
                      fresh_until: {type: [string, 'null'], format: date-time}
        '409': {description: 'MFA no activo (`mfa_not_enabled`)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: 'Código incorrecto o repetido (`mfa_invalid_code`)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '423': {description: 'Bloqueo por intentos fallidos (`mfa_locked`)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /auth/mfa/recovery-codes:
    post:
      tags: [Seguridad Enterprise]
      summary: Generar códigos de recuperación nuevos
      description: Exige la contraseña actual y un código TOTP vigente (no basta la sesión). Los códigos anteriores dejan de valer. Se muestran una sola vez.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, password]
              properties:
                code: {type: string}
                password: {type: string}
      responses:
        '200':
          description: Códigos nuevos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/MfaRecoveryCodes'}
        '409': {description: 'MFA no activo (`mfa_not_enabled`)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: 'Código incorrecto (`mfa_invalid_code`)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '423': {description: 'Bloqueo por intentos fallidos (`mfa_locked`)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /auth/tokens:
    get:
      tags: [Seguridad Enterprise]
      summary: Mis tokens de API
      description: 'Ruta de cuenta (403 `token_scope_insufficient` con un token restringido, de conector o ligado a una empresa). Los tokens de la persona (inicio de sesión, conector y personales) con su tipo, habilidades, empresa, último uso y caducidad. Nunca devuelve el valor del token.'
      responses:
        '200':
          description: Tokens propios
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/ApiTokenSummary'}
    post:
      tags: [Seguridad Enterprise]
      summary: Emitir un token personal con alcance mínimo y caducidad
      description: |-
        Ruta de cuenta: solo con una sesión o un token de inicio de sesión completo (403 `token_scope_insufficient` con cualquier otro: un token NUNCA emite otro con más alcance que el suyo ni para otra empresa). El token nace ATADO a una empresa de la que la persona es miembro (404 si no), con habilidades EXPLÍCITAS que no superan las de su rol efectivo en ella (nunca `*`; 422 con la lista de las no permitidas) y con caducidad (30 días por defecto; `expires_in_days` hasta 365). Máximo 25 tokens personales activos. Quien tiene MFA activo necesita el segundo factor fresco (403 `mfa_step_up_required`). El valor se muestra UNA vez; se guarda solo su hash. Revocarlo (`DELETE /auth/tokens/{id}`) surte efecto en la siguiente petición.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant, name, abilities]
              properties:
                tenant: {type: string, format: uuid}
                name: {type: string, minLength: 2, maxLength: 80}
                abilities: {type: array, minItems: 1, maxItems: 40, items: {type: string, example: data.view}}
                expires_in_days: {type: integer, minimum: 1, maximum: 365}
      responses:
        '201':
          description: Token emitido
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/ApiTokenCreated'}
        '403': {description: 'Token restringido (`token_scope_insufficient`) o segundo factor no fresco (`mfa_step_up_required`)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Validation'}
  /auth/tokens/revoke-others:
    post:
      tags: [Seguridad Enterprise]
      summary: Revocar todos mis demás tokens
      description: 'Cierra «las otras sesiones» de clientes API: revoca todos los tokens propios salvo el actual. Los de conector se conservan salvo `include_connectors`.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                include_connectors: {type: boolean, default: false}
      responses:
        '200':
          description: Cantidad revocada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      revoked: {type: integer}
  /auth/tokens/{id}:
    delete:
      tags: [Seguridad Enterprise]
      summary: Revocar un token propio
      description: 'Borra el token: la siguiente petición con él responde 401 (Sanctum lo relee de la base en cada petición; no hay caché). El id de un token ajeno responde 404.'
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '204': {description: Revocado}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/users/{user}/mfa-reset:
    post:
      tags: [Seguridad Enterprise]
      summary: Restablecer el segundo factor de una persona (plataforma)
      description: |-
        Solo el superadministrador de la plataforma (con el segundo factor fresco). Camino único cuando se perdieron el dispositivo y los códigos de recuperación: el segundo factor es de la PERSONA, no de la empresa, así que un administrador de empresa no puede quitarlo. Exige un motivo (verificación de identidad realizada), borra el estado del segundo factor y revoca los tokens de inicio de sesión y TODAS las sesiones web de la persona. Se audita como `mfa.reset_by_platform`.
      parameters:
      - {name: user, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10, maxLength: 500}
      responses:
        '200': {description: 'Restablecido (`data.mfa_enabled` = false, `data.revoked_login_tokens`)'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Validation'}
  /tenant/tokens:
    get:
      tags: [Seguridad Enterprise]
      summary: Tokens ligados a la empresa (administración)
      description: 'Los tokens con `tenant_id` = la empresa activa, de cualquier persona (conectores y personales), con su dueño, habilidades y caducidad. Nunca devuelve el valor. Habilidad requerida: `users.manage` (sensible: segundo factor fresco si tiene MFA).'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      responses:
        '200':
          description: Tokens de la empresa
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/TenantTokenSummary'}
        '403': {$ref: '#/components/responses/Forbidden'}
      x-ability: users.manage
  /tenant/tokens/{id}:
    delete:
      tags: [Seguridad Enterprise]
      summary: Revocar un token de la empresa (administración)
      description: 'Revocación inmediata de un token ligado a la empresa activa (el de otra empresa, o uno de inicio de sesión sin empresa, responde 404). Se audita con `by: admin`. Habilidad requerida: `users.manage`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      - {$ref: '#/components/parameters/Id'}
      responses:
        '204': {description: Revocado}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      x-ability: users.manage
  /tenant/users/{user}/commercial-role:
    put:
      tags: [Seguridad Enterprise]
      summary: Asignar el rol comercial y su alcance a un miembro
      description: |-
        El rol comercial (`gerente`, `vendedor`, `servicio`) se SUMA al rol de acceso y nunca lo reemplaza. **vendedor**: ve y actúa solo sobre las recomendaciones asignadas a él y las SIN asignar de los clientes de su cartera (clientes, zonas o segmentos de `commercial_scope`); lo asignado a otra persona nunca se muestra y sin cartera ni asignaciones no ve nada. **gerente**: ve todo el equipo; con alcance, solo su cartera y la de su equipo. Las vistas de EQUIPO (outcomes, ROI, materialización, compromisos, conciliación y entrenamiento del Customer Core) responden 403 `commercial_scope_forbidden` a un alcance restringido; alias y cambio de código de un cliente solo se admiten sobre clientes visibles (404 si no, también en las escrituras); una ruta de clientes sin clasificar en el registro responde 403 (falla cerrado). **servicio**: solo lectura (techo de habilidades del rol de consulta, cualquiera sea su rol de acceso). El alcance solo referencia clientes, segmentos y personas de la misma empresa (422 si no). Solo un propietario modifica a otro propietario; «servicio» no se asigna a un propietario (422 `commercial_role_not_allowed`). `commercial_role: null` lo quita y limpia el alcance. Solo se admiten esos tres valores o null (cualquier otro, en cualquier mayúscula, es 422); un valor guardado inesperado (dato dañado) se lee como el alcance MÁS restrictivo —sin clientes y en solo lectura— y nunca como «sin rol comercial». Habilidad requerida: `users.manage` (sensible).
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      - {name: user, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CommercialRoleUpdate'}
      responses:
        '200':
          description: Rol comercial vigente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/CommercialRoleResult'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Validation'}
      x-ability: users.manage
  /tenant/security-policy:
    get:
      tags: [Seguridad Enterprise]
      summary: Política de seguridad de la empresa
      description: 'Si el MFA es obligatorio para propietarios y administradores y cuántos de ellos aún no lo tienen activo. Habilidad requerida: `settings.manage`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      responses:
        '200':
          description: Política vigente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/SecurityPolicy'}
        '403': {$ref: '#/components/responses/Forbidden'}
      x-ability: settings.manage
    put:
      tags: [Seguridad Enterprise]
      summary: Hacer obligatorio el MFA para propietarios y administradores
      description: |-
        Con `mfa_required_for_privileged` = true, propietarios y administradores sin segundo factor pueden iniciar sesión y activarlo (`/auth/mfa/*`) pero no operar la empresa (403 `mfa_enrollment_required`) hasta hacerlo, y no pueden desactivarlo después. Quien activa la política debe tener ya su propio MFA (422 `mfa_required_to_enable_policy`): no se bloquea a sí mismo. Se audita. Habilidad requerida: `settings.manage` (sensible).
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_required_for_privileged]
              properties:
                mfa_required_for_privileged: {type: boolean}
      responses:
        '200':
          description: Política vigente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/SecurityPolicy'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Validation'}
      x-ability: settings.manage
  # <<< W6-A seguridad Enterprise
components:
  parameters:
    MappingId:
      name: mapping
      in: path
      required: true
      schema: {type: integer}
    CoreName:
      name: core
      in: path
      required: true
      schema:
        type: string
        enum: [demand, customer, supply, cost, scenario, quality_gates, promotion]
    ExportId:
      name: export
      in: path
      required: true
      schema: {type: integer}
    CustomerHorizon:
      name: horizon
      in: query
      description: 'Horizonte de comportamiento de compra. Por defecto 30 (o el mayor que permita el plan). Fuera del plan: 402.'
      schema:
        type: integer
        enum: [7, 14, 15, 30, 90]
    # >>> W5-A revenue radar (parámetros de filtro compartidos por el resumen, las oportunidades y la agenda)
    RadarFilterHorizon:
      name: horizon
      in: query
      description: 'Horizonte de la oportunidad (catálogo de Customer). Fuera del plan: 402.'
      schema: {type: integer, enum: [7, 14, 15, 30, 90]}
    RadarFilterKind:
      name: kind
      in: query
      description: 'contact = contacto; recovery = recuperación; customer_risk = riesgo de cliente.'
      schema: {type: string, enum: [contact, recovery, customer_risk]}
    RadarFilterCustomer: {name: customer_id, in: query, description: 'Comprador (de la empresa activa; de otra: 422).', schema: {type: integer}}
    RadarFilterProduct: {name: product_id, in: query, description: 'SKU (de la empresa activa; de otra: 422).', schema: {type: integer}}
    RadarFilterSeller:
      name: seller_id
      in: query
      description: 'Vendedor = usuario asignado a la oportunidad (miembro de la empresa activa). Es un FILTRO: se compone con el alcance comercial del rol vendedor (W6-A), no lo amplía.'
      schema: {type: integer}
    RadarFilterSegmentId: {name: segment_id, in: query, description: 'Segmento comercial del comprador.', schema: {type: integer}}
    RadarFilterSegment:
      name: segment
      in: query
      description: 'Segmento de calibración de la fila del modelo, p. ej. `frequency:high`.'
      schema: {type: string, maxLength: 60, pattern: '^[a-z_]+:[a-z0-9_]+$'}
    RadarFilterZone: {name: zone, in: query, description: 'Zona comercial del comprador.', schema: {type: string, maxLength: 80}}
    RadarFilterCategory: {name: category_id, in: query, description: 'Categoría del producto.', schema: {type: integer}}
    RadarFilterState:
      name: state
      in: query
      description: 'Estado heredado de la agenda V2.2; sin gestión es `pendiente`. Con este filtro se ve exactamente ese estado.'
      schema: {type: string, enum: [pendiente, contactado, interesado, pedido_recibido, pospuesto, descartado]}
    RadarFilterStatus:
      name: status
      in: query
      description: 'Estado del workflow del Decision Engine. Con este filtro se ve exactamente ese estado.'
      schema: {type: string, enum: [suggested, assigned, reviewed, approved, rejected, in_progress, executed, measured, closed, expired]}
    RadarFilterAsOf: {name: as_of, in: query, description: 'Fecha de corte de la predicción de origen (AAAA-MM-DD).', schema: {type: string, format: date}}
    RadarOrderBy:
      name: order_by
      in: query
      description: 'Orden (lista blanca). Por defecto `score` descendente, luego valor bruto esperado e `id` (determinista).'
      schema: {type: string, enum: [score, priority, expected_gross_value, expected_contribution, probability, as_of, horizon_days]}
    RadarDirection: {name: direction, in: query, schema: {type: string, enum: [asc, desc]}}
    # <<< W5-A revenue radar (parámetros)
  schemas:
    # >>> W5-A revenue radar y agenda comercial (esquemas)
    RadarWindow:
      type: object
      description: 'Ventana de recompra: cuantiles de los días hasta la siguiente compra desde el corte; nunca un día exacto. Solo con estado estimated u overdue hay cifras.'
      properties:
        status: {type: [string, 'null'], enum: [estimated, insufficient_data, overdue, censored, null]}
        p10_days: {type: [number, 'null']}
        p50_days: {type: [number, 'null']}
        p90_days: {type: [number, 'null']}
    RadarOpportunity:
      type: object
      description: 'Oportunidad del Revenue Radar (recomendación contact, recovery o customer_risk del Decision Engine). Sin nombres ni datos personales: solo el código del comprador.'
      properties:
        id: {type: integer, description: 'Identificador estable de la recomendación'}
        kind: {type: string, enum: [contact, recovery, customer_risk]}
        entity_type: {type: string, enum: [customer_product, customer]}
        as_of: {type: string, format: date}
        horizon_days: {type: integer}
        source_run_id: {type: [integer, 'null'], description: 'Corrida del Customer Core de origen'}
        customer:
          type: object
          properties:
            id: {type: integer}
            code: {type: [string, 'null']}
            type: {type: [string, 'null']}
            zone: {type: [string, 'null']}
            segment:
              type: [object, 'null']
              properties:
                id: {type: integer}
                code: {type: string}
                name: {type: string}
        product:
          type: [object, 'null']
          description: 'null en el riesgo de cliente (sin producto)'
          properties:
            id: {type: integer}
            sku: {type: [string, 'null']}
            name: {type: [string, 'null']}
            unit: {type: [string, 'null']}
            category:
              type: [object, 'null']
              properties:
                id: {type: integer}
                name: {type: string}
        state: {type: string, enum: [pendiente, contactado, interesado, pedido_recibido, pospuesto, descartado], description: 'Estado heredado de la agenda V2.2'}
        status: {type: string, enum: [suggested, assigned, reviewed, approved, rejected, in_progress, executed, measured, closed, expired], description: 'Estado del workflow'}
        priority: {type: integer}
        score: {type: [number, 'null']}
        score_formula_version: {type: string}
        policy: {type: [string, 'null'], description: 'Política que originó la oportunidad (p. ej. radar-v1:<huella>)'}
        probability: {type: [number, 'null'], description: 'P(≥ 1 compra en el horizonte); null en el riesgo de cliente'}
        expected_orders: {type: [number, 'null'], description: 'E(nº de pedidos) servido por el modelo de conteo; null si no se estimó'}
        quantity_per_order: {type: [number, 'null']}
        expected_units: {type: [number, 'null']}
        window: {$ref: '#/components/schemas/RadarWindow'}
        model_segment: {type: [string, 'null']}
        activity:
          type: [object, 'null']
          description: 'Ficha de actividad (solo en el riesgo de cliente): ausencia respecto al patrón propio, no abandono'
          properties:
            inactivity_status: {type: string}
            inactivity_risk: {type: [number, 'null']}
            behavior_change: {type: string}
            days_since_last_purchase: {type: [integer, 'null']}
            median_interval_days: {type: [number, 'null']}
        value:
          type: object
          properties:
            expected_gross_value: {type: [number, 'null'], description: 'Supuesto: unidades vendibles × último precio neto; no es una venta confirmada'}
            expected_contribution: {type: [number, 'null'], description: 'Null si el costo no es confiable'}
            cost_status: {type: string, enum: [reliable, unreliable, unknown]}
            cost_reasons: {type: array, items: {type: string}}
            action_cost: {type: [number, 'null']}
            incremental_estimate: {type: [number, 'null'], description: 'Solo con evidencia de uplift'}
            attribution:
              type: object
              properties:
                label: {type: string, enum: [potential_unproven, incremental_estimated, causally_attributable]}
                text: {type: string, example: 'Oportunidad potencial, atribución no demostrada'}
            basis: {type: string}
        inventory:
          type: object
          additionalProperties: true
          description: 'Disponibilidad al corte según el Decision Engine: status known (available = existencias − reservado; in_transit aparte), unknown (sin fotografía vigente: no es cero) o not_applicable (riesgo de cliente)'
        owner_user_id: {type: [integer, 'null']}
        assigned_user:
          type: [object, 'null']
          properties:
            id: {type: integer}
            name: {type: [string, 'null']}
        experiment_group: {type: [string, 'null'], enum: [treatment, null], description: 'Solo se incluye con decisions.approve; las de control nunca se listan'}
        expires_at: {type: [string, 'null'], format: date-time}
        next_step: {type: [string, 'null']}
        follow_up:
          type: object
          properties:
            last_feedback_at: {type: [string, 'null'], format: date-time}
            snoozed_until: {type: [string, 'null'], format: date}
    RadarEvent:
      type: object
      description: 'Evento inmutable del historial de una oportunidad (decision_events)'
      properties:
        id: {type: integer}
        event: {type: string, enum: [transition, feedback, assignment, comment]}
        at: {type: [string, 'null'], format: date-time}
        from_agenda_status: {type: [string, 'null']}
        agenda_status: {type: [string, 'null']}
        from_status: {type: [string, 'null']}
        to_status: {type: [string, 'null']}
        actor_kind: {type: string, enum: [user, system]}
        actor_user_id: {type: [integer, 'null']}
        note: {type: [string, 'null']}
        interest: {type: [boolean, 'null']}
        snoozed_until: {type: [string, 'null'], format: date}
        implied_workflow_status: {type: [string, 'null']}
        workflow_sync: {type: [string, 'null'], enum: [applied, unchanged, not_applicable, skipped, null], description: 'Resultado de la sincronización con el workflow; viene de un evento `comment` (kind workflow_sync) enlazado al seguimiento, que nunca se modifica'}
        workflow_sync_reason: {type: [string, 'null']}
        workflow_status_after: {type: [string, 'null']}
        workflow_event_id: {type: [integer, 'null']}
    RadarOpportunityDetail:
      allOf:
      - {$ref: '#/components/schemas/RadarOpportunity'}
      - type: object
        properties:
          explanation: {type: array, items: {type: object, additionalProperties: true}, description: 'Factores verificables, sin PII'}
          assumptions: {type: array, items: {}}
          constraints: {type: array, items: {type: object, additionalProperties: true}, description: 'Siempre objetos con `code` (un texto suelto se normaliza a {code: note, note})'}
          uncertainty: {type: object, additionalProperties: true}
          model_versions: {type: object, additionalProperties: true}
          interval: {type: object, additionalProperties: true}
          source:
            type: object
            properties:
              core_run_id: {type: [integer, 'null']}
              forecast_run_id: {type: [integer, 'null']}
              data_snapshot_id: {type: [integer, 'null']}
          allowed_feedback: {type: array, items: {type: string}, description: 'Destinos de seguimiento permitidos desde el estado vigente (vacío si es final o no admite seguimiento)'}
          history:
            type: array
            items: {$ref: '#/components/schemas/RadarEvent'}
    AgendaStatusMapRow:
      type: object
      description: 'Mapeo (radar-agenda-map-v1) de un estado heredado de la Agenda V2.2 al workflow Enterprise'
      properties:
        legacy: {type: string, enum: [pendiente, contactado, interesado, pedido_recibido, pospuesto, descartado]}
        workflow: {type: [string, 'null'], description: 'Estado de workflow que implica; null = el workflow no cambia'}
        note: {type: string}
        allowed_next: {type: array, items: {type: string}}
    RadarSummary:
      type: object
      properties:
        as_of: {type: [string, 'null'], format: date}
        totals:
          type: object
          description: 'Relaciones DISTINTAS (tipo, cliente, producto), sin repetir por horizonte.'
          properties:
            opportunities: {type: integer}
            customers: {type: integer}
            unit: {type: string}
        by_horizon:
          type: object
          description: 'Claves = horizontes. Nada se suma entre horizontes: el valor, los estados y el inventario se informan dentro de cada uno.'
          additionalProperties:
            type: object
            properties:
              opportunities: {type: integer}
              customers: {type: integer}
              by_kind: {type: object, additionalProperties: {type: integer}}
              by_state:
                type: object
                description: 'Recuento por estado heredado de ese horizonte (incluye los finales; sin el grupo de control)'
                additionalProperties: {type: integer}
              inventory:
                type: object
                properties:
                  known: {type: integer}
                  unknown: {type: integer}
                  below_expected: {type: integer, description: 'El Decision Engine limitó el valor a lo disponible'}
                  not_applicable: {type: integer}
              value:
                type: object
                description: 'Valor PRONOSTICADO de las relaciones cliente × producto; no incluye lo de nivel de cliente'
                properties:
                  currency: {type: string}
                  scope: {type: string, enum: [customer_product]}
                  opportunities: {type: integer}
                  attribution:
                    type: object
                    properties:
                      label: {type: string}
                      text: {type: string}
                  gross_value: {type: [number, 'null']}
                  gross_value_opportunities: {type: integer}
                  contribution: {type: [number, 'null'], description: 'Solo suma las valoradas con costo confiable'}
                  contribution_opportunities: {type: integer}
                  contribution_unavailable: {type: integer}
                  basis_code: {type: string, enum: [forecast_units_x_last_net_price]}
                  basis: {type: string}
              customer_level:
                type: object
                description: 'Recuperación y riesgo a nivel de cliente: importe OBSERVADO (caída del gasto neto entre dos ventanas); no es pronóstico ni contribución y no se suma a `value`'
                properties:
                  opportunities: {type: integer}
                  customers: {type: integer}
                  currency: {type: string}
                  observed_spend_decline: {type: [number, 'null']}
                  observed_spend_decline_opportunities: {type: integer}
                  basis_code: {type: string, enum: [observed_spend_decline]}
                  basis: {type: string}
        control_withheld: {type: integer, description: 'Solo con decisions.approve y sin filtro de cliente o producto: oportunidades en el grupo de control de un experimento (no se listan ni se asignan)'}
        label: {type: string}
        notes: {type: array, items: {type: string}}
        run_id: {type: [integer, 'null']}
    RadarAgendaGroup:
      type: object
      properties:
        customer:
          type: object
          properties:
            id: {type: integer}
            code: {type: [string, 'null']}
            type: {type: [string, 'null']}
            zone: {type: [string, 'null']}
            segment: {type: [object, 'null'], additionalProperties: true}
        opportunities_count: {type: integer}
        best_score: {type: [number, 'null']}
        top_priority: {type: integer}
        states: {type: object, additionalProperties: {type: integer}}
        next_action: {type: [string, 'null']}
        opportunities:
          type: array
          items: {$ref: '#/components/schemas/RadarOpportunity'}
    RadarFeedbackRequest:
      type: object
      required: [state, idempotency_key]
      properties:
        state: {type: string, enum: [pendiente, contactado, interesado, pedido_recibido, pospuesto, descartado]}
        note: {type: [string, 'null'], maxLength: 500, description: 'Texto libre; se enmascaran correos y números de 10/13 dígitos'}
        idempotency_key: {type: string, minLength: 8, maxLength: 120, pattern: '^[A-Za-z0-9._:-]+$'}
        snoozed_until: {type: [string, 'null'], format: date, description: 'Obligatoria con state = pospuesto: posterior a hoy y a lo sumo en un año'}
    RadarFeedbackResult:
      type: object
      properties:
        data:
          type: object
          properties:
            opportunity: {$ref: '#/components/schemas/RadarOpportunityDetail'}
            event: {$ref: '#/components/schemas/RadarEvent'}
            replayed: {type: boolean}
        status_map:
          type: object
          properties:
            version: {type: string}
    RadarMaterialization:
      type: object
      properties:
        status: {type: string, enum: [completed, partial, no_run]}
        run_id: {type: [integer, 'null']}
        as_of: {type: [string, 'null'], format: date}
        horizons: {type: array, items: {type: integer}}
        policy: {type: string}
        candidates: {type: integer}
        created: {type: integer}
        existing: {type: integer}
        failed: {type: integer}
        created_by_kind: {type: object, additionalProperties: {type: integer}}
        errors: {type: array, items: {type: string}}
    CustomerDemand:
      type: object
      properties:
        customer:
          type: object
          properties:
            id: {type: integer}
            code: {type: [string, 'null']}
            type: {type: [string, 'null']}
            is_generic: {type: boolean}
            zone: {type: [string, 'null']}
            segment: {type: [object, 'null'], additionalProperties: true}
        horizon_days: {type: integer}
