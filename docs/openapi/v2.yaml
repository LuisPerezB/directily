      summary: Oportunidades del Revenue Radar (lista de trabajo con filtros y paginación)
      description: |-
        Oportunidades cliente × producto (y de cliente) que el Decision Engine guardó como recomendaciones de contacto, recuperación y riesgo de cliente, con su probabilidad, `expected_orders` (E(nº de pedidos) servido por el modelo de conteo), cantidad por pedido, unidades, ventana de recompra (cuantiles solo con estado `estimated` u `overdue`; nunca un día exacto), valor bruto esperado, contribución (null sin costo confiable; `value.cost_status` y `cost_reasons` lo dicen), disponibilidad de inventario al corte (`unknown` si no hay fotografía vigente: nunca cero), puntaje con la versión de su fórmula, prioridad, estado de workflow (`status`) y estado heredado de la agenda (`state`). Sin nombres ni datos personales: solo el código del comprador.

        **Lista de trabajo.** Sin `state` ni `status`: vigentes (ni vencidas, medidas, cerradas ni rechazadas) y sin pedido recibido ni descartadas. Con `state` se ve exactamente ese estado heredado (sin gestión = `pendiente`); con `status`, exactamente ese estado de workflow. Las del **grupo de control** de un experimento nunca aparecen. Orden por defecto determinista: `score` descendente (nulos al final), valor bruto esperado descendente e `id`.

        `seller_id` filtra por el usuario asignado. TODO(W6): el alcance por cartera del rol vendedor llega en W6 (diseñado, no implementado); hoy los roles owner/admin/analyst/viewer ven toda la empresa.

