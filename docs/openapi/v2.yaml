# Rutas de la etapa 2 (OpenAPI 3.1). Se edita a mano junto a core.yaml y analytics.yaml; `python infra/scripts/merge_openapi.py` los une, valida y contrasta con las rutas reales.
openapi: 3.1.0
info: {title: Predictily API pública — etapa 2 (v2), version: 2.0.0, description: 'Rutas de la etapa 2 del core común: Core de Datos (fuentes SQL de solo
    lectura, cobertura, calendario, compromisos, almacenes y unidades), plataforma (configuración efectiva y extensiones), Comportamiento de compra (Customer
    Core), Abastecimiento (planes, costos, simulaciones, escenarios, verificación causal) y asistente conversacional opcional.


    Complementa `core.yaml` y `analytics.yaml` (parámetros y respuestas compartidos: `TenantHeader`, `Id`, `Page`, `PerPage`, `NotFound`, `Forbidden`, `Validation`,
    `PlanLimit`, `Error`); `infra/scripts/merge_openapi.py` los une en `predictily-api.yaml`.


    **Envoltura común** (ADR-V2-03): los resultados llevan `envelope` con empresa, ejecución, fecha de corte, horizonte, definición del objetivo, unidad,
    moneda, tipo de resultado, versión del modelo, huella de datos, configuración, supuestos, limitaciones, `quality_status` y `uncertainty_source`. El
    estado técnico (`status`) es distinto de `quality_status`.


    **Habilidades**: cada operación indica la habilidad que exige (`x-ability`). **Horizontes**: demanda 7/14/30/60/90; compra 7/30/90; un horizonte fuera
    del plan responde 402 `plan_limit_exceeded`.'}
servers:
- {url: /api/v1}
security:
- sessionCookie: []
- bearerToken: []
tags:
- {name: Core de Datos}
- {name: Plataforma}
- {name: Comportamiento de compra}
- {name: Abastecimiento}
- {name: Asistente}
paths:
  /assistant/messages:
    post:
      tags: [Asistente]
      summary: Consultar resultados ya calculados en lenguaje natural
      description: 'El modelo solo elige herramientas de una lista blanca (solo lectura, dentro de la empresa activa, con la habilidad y el plan de la ruta
        equivalente) y explica lo que devuelven. NUNCA calcula: si el texto incluye cifras que no proceden de las herramientas se descarta (`ungrounded_rejected`).
        Sin herramienta aplicable responde que no puede (`no_applicable_tool`). No se registra el contenido de la conversación; solo metadatos de uso en
        auditoría.


        Habilidad requerida: `data.view`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssistantMessageRequest'}
      responses:
        '200':
          description: Respuesta con las cifras y su procedencia tal como las devolvieron las herramientas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/AssistantReply'}
        '402': {$ref: '#/components/responses/PlanLimit'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Validation'}
        '429':
          description: '`assistant_rate_limited` (por usuario) o `assistant_quota_exceeded` (tope diario por empresa); cabecera Retry-After'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '502':
          description: '`assistant_provider_error`: el proveedor falló o expiró'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: '`assistant_disabled` (con `reason`): sin clave, desactivado por configuración o proveedor desconocido'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
      x-ability: data.view
  /assistant/status:
    get:
      tags: [Asistente]
      summary: Disponibilidad del asistente conversacional (opcional)
      description: 'El asistente es una capa OPCIONAL (ADR-V2-12): su ausencia o desactivación no afecta a los cuatro cores. Nunca devuelve la clave ni
        la configuración del proveedor.


        Habilidad requerida: `data.view`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      responses:
        '200':
          description: Estado, herramientas disponibles para el usuario y límites
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/AssistantStatus'}
        '403': {$ref: '#/components/responses/Forbidden'}
      x-ability: data.view
  /calendar-events:
    get:
      tags: [Core de Datos]
      summary: Calendario con alcance (empresa + público)
      description: 'Habilidad requerida: `data.view`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      - name: from
        in: query
        schema: {type: string, format: date}
      - name: to
        in: query
        schema: {type: string, format: date}
      - name: scope
        in: query
        schema:
          type: string
          enum: [country, region, tenant, branch, category, product, sector]
      - name: category
        in: query
        schema: {type: string}
      - name: status
        in: query
        schema:
          type: string
          enum: [planned, confirmed, cancelled]
      - name: include_public
        in: query
        schema: {type: boolean, default: true}
      - name: as_of
        in: query
        schema: {type: string, format: date-time}
        description: Solo revisiones con known_at ≤ corte; las de known_at desconocido se excluyen
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 2000}
      responses:
        '200':
          description: Eventos (una revisión por evento)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/CalendarEvent'}
                  meta:
                    type: object
                    properties:
                      as_of:
                        type: [string, 'null']
                        format: date-time
                      rule: {type: string}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Validation'}
      x-ability: data.view
    post:
      tags: [Core de Datos]
      summary: Crear un evento propio
      description: 'Pasa por el importador (revisiones, known_at). El calendario público es de solo lectura.


        Habilidad requerida: `catalog.manage`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CalendarEventInput'}
      responses:
        '201':
          description: Evento creado (revisión 0)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/CalendarEvent'}
                  result: {type: object, additionalProperties: true}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Validation'}
      x-ability: catalog.manage
  /calendar-events/{id}:
    patch:
      tags: [Core de Datos]
      summary: Modificar un evento propio (nueva revisión)
      description: 'Habilidad requerida: `catalog.manage`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                category: {type: string}
                ends_on: {type: string, format: date}
                status:
                  type: string
                  enum: [planned, confirmed, cancelled]
                known_at:
                  type: [string, 'null']
                  format: date-time
      responses:
        '200':
          description: Última revisión
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/CalendarEvent'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`stale_revision`: solo la última revisión puede modificarse'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/Validation'}
      x-ability: catalog.manage
    delete:
      tags: [Core de Datos]
      summary: Cancelar un evento propio (el historial se conserva)
      description: 'Habilidad requerida: `catalog.manage`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: Evento con estado cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/CalendarEvent'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`stale_revision`: solo la última revisión del evento puede cancelarse'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
      x-ability: catalog.manage
  /commitments:
    get:
      tags: [Core de Datos]
      summary: Listar compromisos comerciales (cotizaciones, pedidos, contratos)
      description: 'Los compromisos NO son ventas y no se suman a la demanda; la esperanza de compra no duplica lo comprometido.


        Habilidad requerida: `data.view`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      - name: type
        in: query
        schema:
          type: string
          enum: [quote, order, contract]
      - name: status
        in: query
        schema: {type: string}
      - name: customer_id
        in: query
        schema: {type: integer}
      - name: product_id
        in: query
        schema: {type: integer}
      - name: from
        in: query
        schema: {type: string, format: date}
      - name: to
        in: query
        schema: {type: string, format: date}
      - name: as_of
        in: query
        schema: {type: string, format: date-time}
        description: Reconstruye el estado conocido al corte (status_at_cutoff, pending_total, flags)
      - name: per_page
        in: query
        schema: {type: integer, minimum: 1, maximum: 100}
      responses:
        '200':
          description: Lista paginada, o la vista reconstruida al corte si se envía `as_of`
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Commitment'}
                  meta: {type: object, additionalProperties: true}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Validation'}
      x-ability: data.view
    post:
      tags: [Core de Datos]
      summary: Crear o actualizar un compromiso (idempotente por tipo + identificador externo)
      description: '422 `validation_failed` con los errores del importador.


        Habilidad requerida: `imports.manage`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CommitmentInput'}
      responses:
        '200':
          description: Actualizado o sin cambios
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Commitment'}
                  result:
                    type: string
                    enum: [updated, unchanged]
        '201':
          description: Creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Commitment'}
                  result:
                    type: string
                    enum: [created]
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Validation'}
      x-ability: imports.manage
  /commitments/{id}:
    get:
      tags: [Core de Datos]
      summary: Detalle de un compromiso con sus revisiones
      description: 'Habilidad requerida: `data.view`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: Compromiso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Commitment'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      x-ability: data.view
  /commitments/{id}/cancel:
    post:
      tags: [Core de Datos]
      summary: Cancelar un compromiso (agrega una revisión)
      description: 'Habilidad requerida: `imports.manage`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                cancelled_at:
                  type: [string, 'null']
                  format: date-time
                known_at:
                  type: [string, 'null']
                  format: date-time
      responses:
        '200':
          description: Compromiso cancelado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Commitment'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`already_cancelled`'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/Validation'}
      x-ability: imports.manage
  /customer/customers/{id}/profile:
    get:
      tags: [Comportamiento de compra]
      summary: 'Perfil de un comprador: frecuencia, productos probables, inactividad'
      description: 'Un código genérico (consumidor final) o un comprador sin historial devuelve `no_individual_prediction` con el motivo: no se inventa
        una identidad recurrente.


        Habilidad requerida: `forecast.view`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      - {$ref: '#/components/parameters/Id'}
      - {$ref: '#/components/parameters/CustomerHorizon'}
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/CustomerProfile'}
                  envelope: {$ref: '#/components/schemas/ResultEnvelope'}
        '402': {$ref: '#/components/responses/PlanLimit'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      x-ability: forecast.view
  /customer/evaluation:
    get:
      tags: [Comportamiento de compra]
      summary: 'Evaluación del entrenamiento: protocolo, calibración y métricas por horizonte'
      description: 'Habilidad requerida: `forecast.view`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      - {$ref: '#/components/parameters/CustomerHorizon'}
      - name: run_id
        in: query
        schema: {type: integer}
      responses:
        '200':
          description: Manifiesto del protocolo (bloques train/calibration/selection/holdout y maduración de etiquetas) y métricas (Brier, log loss, curvas
            de calibración, precision@k)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      run_id:
                        type: [integer, 'null']
                      as_of:
                        type: [string, 'null']
                        format: date
                      manifest:
                        type: [object, 'null']
                        additionalProperties: true
                      metrics: {type: object, additionalProperties: true}
                      models:
                        type: object
                        additionalProperties: true
                        description: Modelo servido por horizonte (clave = horizonte). Siempre objeto, también vacío o con claves numéricas
                      summary:
                        type: [object, 'null']
                        additionalProperties: true
                      notes:
                        type: array
                        items: {type: string}
                    additionalProperties: true
                  envelope: {$ref: '#/components/schemas/ResultEnvelope'}
        '402': {$ref: '#/components/responses/PlanLimit'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      x-ability: forecast.view
  /customer/predictions:
    get:
      tags: [Comportamiento de compra]
      summary: Predicciones de compra por comprador × producto
      description: 'Los montos esperados son supuestos (esperanza × último precio neto), no ventas confirmadas. 422 `horizon_not_available` si la corrida
        se abstuvo de ese horizonte.


        Habilidad requerida: `forecast.view`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      - {$ref: '#/components/parameters/CustomerHorizon'}
      - name: customer_id
        in: query
        schema: {type: integer}
      - name: product_id
        in: query
        schema: {type: integer}
      - name: min_probability
        in: query
        schema: {type: number, minimum: 0, maximum: 1}
      - name: order_by
        in: query
        schema:
          type: string
          enum: [probability, expected_quantity, expected_amount, quantity_if_purchase]
      - name: direction
        in: query
        schema:
          type: string
          enum: [asc, desc]
      - name: run_id
        in: query
        schema: {type: integer}
      - {$ref: '#/components/parameters/PerPage'}
      - {$ref: '#/components/parameters/Page'}
      responses:
        '200':
          description: 'Predicciones de la corrida vigente (o `run_id`); sin corrida: lista vacía y `envelope.quality_status = insufficient_data`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/CustomerPrediction'}
                  meta: {$ref: '#/components/schemas/PageMeta'}
                  envelope: {$ref: '#/components/schemas/ResultEnvelope'}
                  ranking_source:
                    type: [string, 'null']
                    enum: [model, popularity, recency, null]
                  definitions:
                    type: object
                    additionalProperties: {type: string}
        '402': {$ref: '#/components/responses/PlanLimit'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Validation'}
      x-ability: forecast.view
  /customer/reconciliation:
    get:
      tags: [Comportamiento de compra]
      summary: Reconciliación demanda agregada vs compradores
      description: 'Habilidad requerida: `forecast.view`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      - {$ref: '#/components/parameters/CustomerHorizon'}
      - name: status
        in: query
        schema:
          type: string
          enum: [ok, inconsistent, aggregate_unavailable, aggregate_incomplete]
      - name: product_id
        in: query
        schema: {type: integer}
      - name: run_id
        in: query
        schema: {type: integer}
      responses:
        '200':
          description: Filas por producto (inconsistentes primero) y resumen
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/CustomerReconciliationRow'}
                  summary:
                    type: object
                    properties:
                      status_counts:
                        type: object
                        additionalProperties: {type: integer}
                    additionalProperties: true
                  policy: {}
                  envelope: {$ref: '#/components/schemas/ResultEnvelope'}
        '402': {$ref: '#/components/responses/PlanLimit'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      x-ability: forecast.view
  /customer/runs:
    post:
      tags: [Comportamiento de compra]
      summary: Entrenar o predecir comportamiento de compra (asíncrono)
      description: '`train` entrena y evalúa (un `as_of` anterior a hoy crea una corrida `historical` que no se promueve). `predict` recalcula variables
        al día con los modelos en producción; no espera ventas nuevas.


        Habilidad requerida: `forecast.run`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operation:
                  type: string
                  enum: [train, predict]
                horizons:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items:
                    type: integer
                    enum: [7, 30, 90]
                as_of: {type: string, format: date}
              required: [operation]
      responses:
        '202':
          description: Corrida en cola
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/CustomerRun'}
        '402': {$ref: '#/components/responses/PlanLimit'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: '`customer_run_in_progress`: una sola corrida activa por operación'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/Validation'}
      x-ability: forecast.run
    get:
      tags: [Comportamiento de compra]
      summary: Listar corridas del Customer Core
      description: 'Habilidad requerida: `forecast.view`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      - name: operation
        in: query
        schema:
          type: string
          enum: [train, predict]
      - name: status
        in: query
        schema: {type: string}
      - {$ref: '#/components/parameters/Page'}
      - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200':
          description: Corridas (más reciente primero)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/CustomerRun'}
                  meta: {$ref: '#/components/schemas/PageMeta'}
        '403': {$ref: '#/components/responses/Forbidden'}
      x-ability: forecast.view
  /customer/runs/{id}:
    get:
      tags: [Comportamiento de compra]
      summary: Detalle de una corrida
      description: 'Habilidad requerida: `forecast.view`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: Corrida
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/CustomerRun'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      x-ability: forecast.view
  /data-coverage:
    get:
      tags: [Core de Datos]
      summary: Cobertura (completitud) de las fuentes
      description: 'Los ceros de demanda y los negativos de compra solo se generan dentro de la cobertura; fuera de ella el dato es AUSENTE.


        Habilidad requerida: `data.view`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      responses:
        '200':
          description: Declaraciones y cobertura efectiva por entidad
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/DataCoverage'}
                  effective:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        complete_from:
                          type: [string, 'null']
                          format: date
                        complete_through:
                          type: [string, 'null']
                          format: date
                        rule:
                          type: string
                          enum: [declared_by_user, min_over_sources, none]
                        basis:
                          type: [string, 'null']
        '403': {$ref: '#/components/responses/Forbidden'}
      x-ability: data.view
    put:
      tags: [Core de Datos]
      summary: Declarar la cobertura de una fuente
      description: '`complete_through` no puede ser futura.


        Habilidad requerida: `imports.manage`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entity: {type: string}
                complete_from:
                  type: [string, 'null']
                  format: date
                complete_through: {type: string, format: date}
                data_source_id:
                  type: [integer, 'null']
                branch_id:
                  type: [integer, 'null']
                notes:
                  type: [string, 'null']
                  maxLength: 500
              required: [entity, complete_through]
      responses:
        '200':
          description: Cobertura guardada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/DataCoverage'}
                  effective: {type: object, additionalProperties: true}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Validation'}
