        key: {type: string, maxLength: 40, pattern: '^[A-Za-z0-9_-]+$'}
        name:
          type: [string, 'null']
          maxLength: 150
        price_change_pct:
          oneOf:
          - {type: number, minimum: -0.9, maximum: 5}
          - type: array
            items: {type: number, minimum: -0.9, maximum: 5}
          description: Fracción (0.05 = 5 %), escalar o lista por período; el escalar y cada elemento comparten los límites -0.9..5
        discount_pct:
          oneOf:
          - {type: number, minimum: 0, maximum: 0.95}
          - type: array
            items: {type: number, minimum: 0, maximum: 0.95}
          description: Fracción (0.05 = 5 %), escalar o lista por período; el escalar y cada elemento comparten los límites 0..0.95
        cost_change_pct:
          oneOf:
          - {type: number, minimum: -0.9, maximum: 5}
          - type: array
            items: {type: number, minimum: -0.9, maximum: 5}
          description: Fracción (0.05 = 5 %), escalar o lista por período; el escalar y cada elemento comparten los límites -0.9..5
        demand_change_pct:
          oneOf:
          - {type: number, minimum: -0.95, maximum: 5}
          - type: array
            items: {type: number, minimum: -0.95, maximum: 5}
          description: Fracción (0.05 = 5 %), escalar o lista por período; el escalar y cada elemento comparten los límites -0.95..5
        use_cost_forecast: {type: boolean}
        plan_run_id:
          type: [integer, 'null']
          description: Plan de reposición completado de la empresa
        supply_fill_rate: {type: number, minimum: 0, maximum: 1}
        lead_time_delta_days: {type: integer, minimum: -60, maximum: 180}
        extra_supply:
          type: array
          items:
            type: object
            properties:
              branch_id: {type: integer}
              product_id: {type: integer}
              period: {type: integer}
              units: {type: number}
            required: [branch_id, product_id, period, units]
      required: [key]
    ScenarioEvaluationRequest:
      type: object
      properties:
        name:
          type: [string, 'null']
          maxLength: 150
        horizon_days: {type: integer, minimum: 7, maximum: 180}
        period_days:
          type: integer
          enum: [1, 7, 14, 30]
        forecast_run_id:
          type: [integer, 'null']
        cost_forecast_run_id:
          type: [integer, 'null']
        filters:
          type: object
          properties:
            branch_id:
              type: [integer, 'null']
            category_id:
              type: [integer, 'null']
            product_id:
              type: [integer, 'null']
        undated_receipt_policy:
          type: string
          enum: [lead_time_end, observed_lead_time, exclude]
        strategies:
          type: array
          minItems: 1
          maxItems: 8
          items: {$ref: '#/components/schemas/ScenarioStrategy'}
      required: [strategies]
    ScenarioEvaluation:
      type: object
      properties:
        run_id: {type: integer}
        status: {type: string}
        name:
          type: [string, 'null']
        horizon_days:
          type: [integer, 'null']
        request:
          type: [object, 'null']
          additionalProperties: true
        results:
          type: [object, 'null']
          additionalProperties: true
          description: Estrategias comparadas sobre la misma base, inputs[] clasificados observed|forecasted|assumed, coherence y ranking_by_gross_margin
    CausalCheckRequest:
      type: object
      properties:
        product_id:
          type: [integer, 'null']
        branch_id:
          type: [integer, 'null']
        as_of:
          type: [string, 'null']
          format: date
        treatment:
          type: [string, 'null']
        outcome:
          type: [string, 'null']
        unit_of_analysis:
          type: [string, 'null']
        estimand:
          type: [string, 'null']
        horizon_days:
          type: [integer, 'null']
        population:
          type: [string, 'null']
        price_change_pct:
          type: [number, 'null']
          minimum: -0.95
          maximum: 5
        confounders_controlled:
          type: array
          items: {type: string}
        unobserved_confounders_acknowledged:
          type: array
          items: {type: string}
        identification_assumptions_acknowledged:
          type: array
          items: {type: string}
    CausalCheckResult:
      type: object
      description: 'Siempre quality_status = insufficient_evidence: ningún estimador causal está habilitado (ADR-V2-11).'
      properties:
        data: {type: object, additionalProperties: true, description: 'verdict, requisitos verificados, effect = null, estimator_enabled = false, conditional_simulation.available
            = true'}
        envelope: {$ref: '#/components/schemas/ResultEnvelope'}
    AssistantTool:
      type: object
      properties:
        name: {type: string}
        available_to_you: {type: boolean, description: false si su rol o token no tiene la habilidad exigida por la ruta de resultados equivalente}
    AssistantStatus:
      type: object
      properties:
        enabled: {type: boolean}
        reason:
          type: [string, 'null']
          description: missing_api_key | disabled_by_config | provider_disabled | unknown_provider | disabled_for_plan | invalid_base_url | missing_model
        provider: {type: string}
        model:
          type: [string, 'null']
        tools:
          type: array
          items: {$ref: '#/components/schemas/AssistantTool'}
        limits:
          type: object
          properties:
            max_message_chars: {type: integer}
            max_history_messages: {type: integer}
            rate_per_minute: {type: integer}
            daily_limit_per_tenant:
              type: [integer, 'null']
            max_tool_rounds: {type: integer}
        usage_today:
          type: object
          properties:
            count: {type: integer}
            limit:
              type: [integer, 'null']
        notice: {type: string}
    AssistantMessageRequest:
      type: object
      properties:
        message: {type: string, minLength: 1, maxLength: 1000, description: Tamaño máximo configurable (CONVERSATION_MAX_MESSAGE_CHARS)}
        history:
          type: array
          maxItems: 6
          items:
            type: object
            properties:
              role:
                type: string
                enum: [user, assistant]
              content: {type: string, maxLength: 1500}
            required: [role, content]
          description: Contexto previo opcional; los datos personales (correos, cédula/RUC) se enmascaran antes de salir al proveedor
      required: [message]
    AssistantFigure:
      type: object
      description: Resultado de UNA herramienta de lista blanca. Las cifras del asistente salen siempre de aquí, nunca del texto del modelo.
      properties:
        tool: {type: string}
        arguments: {type: object, additionalProperties: true}
        status:
          type: string
          enum: [ok, no_data, forbidden, plan_limit, invalid_arguments, not_found, tool_not_allowed, error]
        message:
          type: [string, 'null']
        data:
          type: [object, 'null']
          additionalProperties: true
          description: Cifras tal como las devolvió la herramienta (servicio interno de resultados)
        envelope:
          anyOf:
          - {$ref: '#/components/schemas/ResultEnvelope'}
          - {type: 'null'}
          description: Procedencia (envoltura ADR-V2-03 del core que produjo la cifra)
    AssistantReply:
      type: object
      properties:
        status:
          type: string
          enum: [answered, no_applicable_tool, tool_denied, no_answer, ungrounded_rejected]
        answer: {type: string, description: Explicación en texto. Si el texto del modelo incluía cifras que no proceden de las herramientas se descarta
            (ungrounded_rejected)}
        figures:
          type: array
          items: {$ref: '#/components/schemas/AssistantFigure'}
        grounding:
          type: object
          properties:
            checked: {type: boolean}
            ungrounded_numbers:
              type: array
              items: {type: string}
        provider:
          type: object
          properties:
            name: {type: string}
            model:
              type: [string, 'null']
        usage:
          type: object
          properties:
            prompt_tokens: {type: integer}
            completion_tokens: {type: integer}
            rounds: {type: integer}
            tool_calls: {type: integer}
        notice: {type: string}
    PromotionRevision:
      type: object
      properties:
        revision: {type: integer}
        name: {type: string}
        promo_type: {type: string}
        discount_pct:
          type: [number, 'null']
        starts_on:
          type: [string, 'null']
          format: date
        ends_on:
          type: [string, 'null']
          format: date
        branch_id:
          type: [integer, 'null']
        product_id:
          type: [integer, 'null']
        category_id:
          type: [integer, 'null']
        known_at:
          type: [string, 'null']
          format: date-time
        deleted: {type: boolean}
        source: {type: string}
        recorded_at:
          type: [string, 'null']
          format: date-time
