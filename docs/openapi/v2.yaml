        schema: {type: string, maxLength: 100, example: balance}
      - name: actionable_now
        in: query
        description: Filtra la vista previa de `lines`
        schema: {type: boolean}
      - name: product_id
        in: query
        description: Filtra la vista previa de `lines`
        schema: {type: integer}
      - name: supplier_id
        in: query
        description: Filtra la vista previa de `lines`
