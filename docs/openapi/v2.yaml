          items:
            type: object
            properties:
              id: {type: integer}
              code: {type: string}
              name: {type: string}
        constraints:
          type: array
          items: {type: object, additionalProperties: true}
        solver:
          type: [object, 'null']
          additionalProperties: true
        diagnosis: {}
        infeasibility: {}
        alternative_plan: {}
