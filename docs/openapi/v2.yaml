    # <<< W2-F factor-intelligence schemas
    # >>> W5-B decision engine schemas
    DecisionRecommendation:
      type: object
      description: 'Recomendación del Decision Engine con el contrato de §11. Sin PII. Los mapas JSON (`model_versions`, `interval`, `availability`, `uncertainty`) salen siempre como objeto.'
      properties:
        id: {type: integer}
        kind: {type: string, enum: [contact, recovery, customer_risk, replenishment, inventory_mismatch, budget_constraint, scenario]}
        as_of: {type: string, format: date, description: Fecha de corte de los insumos}
        horizon_days: {type: integer}
        entity_type: {type: string, enum: [customer_product, customer, product_branch, product]}
        customer: {type: [object, 'null'], properties: {id: {type: integer}, external_code: {type: string}}}
        product: {type: [object, 'null'], properties: {id: {type: integer}, sku: {type: string}, name: {type: string}, unit: {type: string}}}
        branch: {type: [object, 'null'], properties: {id: {type: integer}, code: {type: string}, name: {type: string}}}
        source:
          type: object
          description: Fuente y huella de los insumos
          properties:
            core_run_id: {type: [integer, 'null']}
            forecast_run_id: {type: [integer, 'null']}
            data_snapshot_id: {type: [integer, 'null']}
        model_versions: {type: object, additionalProperties: true}
        probability: {type: [number, 'null'], description: 'Probabilidad de la magnitud usada (compra en contacto; quiebre en reposición); null si no aplica'}
        interval: {type: object, additionalProperties: true}
        assumptions: {type: array, items: {}}
        constraints: {type: array, items: {type: object, additionalProperties: true}, description: 'Restricciones activas (`code`: stock_below_expected_units, out_of_stock, over_budget, budget, moq, ...)'}
        availability: {type: object, additionalProperties: true, description: 'Existencias, reservado, disponible y tránsito al corte (el tránsito NO cuenta como disponible); `status = unknown` si no hay foto vigente (nunca cero)'}
        currency: {type: string}
        action_cost: {type: [number, 'null'], description: 'Costo de contacto (gasto) o desembolso de compra (capital comprometido); null si no se conoce'}
        expected_gross_value: {type: [number, 'null']}
        expected_contribution: {type: [number, 'null'], description: 'Solo con costo confiable; null en otro caso (ver uncertainty.cost y uncertainty.expected_contribution_null_because)'}
        incremental_estimate: {type: [number, 'null'], description: 'Solo con evidencia de uplift; null si no la hay'}
        incremental_evidence: {type: [object, 'null']}
        attribution_label: {type: string, enum: [potential_unproven, incremental_estimated, causally_attributable]}
        attribution_note: {type: string}
        score: {type: [number, 'null'], description: 'Valor esperado menos gasto de la acción; ver docs/decision/ECONOMIC_PRIORITIZATION.md'}
        score_formula_version: {type: string, description: SHA-256 de los parámetros efectivos de la fórmula con la que se calculó}
        uncertainty: {type: object, additionalProperties: true}
        explanation: {type: array, items: {type: object, additionalProperties: true}, description: 'Factores verificables con su fuente (sin PII); `value_calculation` trae los insumos del cálculo'}
        policy: {type: [string, 'null']}
        priority: {type: integer, minimum: 1, maximum: 5, description: '1 = la más alta; determinista por la posición del score dentro de su grupo (tipo, entidad, corte y, en contacto/recuperación/riesgo, horizonte): cada recomendación nueva reordena el grupo'}
        owner_user_id: {type: [integer, 'null']}
        assigned_user_id: {type: [integer, 'null']}
        status: {type: string, enum: [suggested, assigned, reviewed, approved, rejected, in_progress, executed, measured, closed, expired]}
        agenda_status: {type: [string, 'null'], enum: [pendiente, contactado, interesado, pedido_recibido, pospuesto, descartado, null]}
        experiment_group: {type: [string, 'null'], enum: [treatment, control, null], description: 'Solo con decisions.approve'}
        proposed_by:
          type: object
          properties:
            kind: {type: string, enum: [system, user]}
            user_id: {type: [integer, 'null']}
        expires_at: {type: [string, 'null'], format: date-time}
        next_step: {type: [string, 'null']}
        version: {type: [integer, 'null'], description: 'Id del último evento: se manda como expected_version al revisar'}
        requires_approval: {type: [boolean, 'null']}
        allowed_transitions: {type: array, items: {$ref: '#/components/schemas/DecisionAllowedTransition'}}
        events: {type: array, items: {$ref: '#/components/schemas/DecisionEvent'}, description: Solo en el detalle}
        created_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: [string, 'null'], format: date-time}
    DecisionAllowedTransition:
      type: object
      properties:
        action: {type: string, enum: [assign, reassign, review, approve, reject, dismiss, start, start_without_approval, execute, close]}
        to_status: {type: string}
        ability: {type: [string, 'null']}
        requires:
          type: object
          properties:
            assignee: {type: boolean}
            reason: {type: boolean}
            expected_version: {type: boolean}
        allowed: {type: boolean}
        blocked_by: {type: [string, 'null'], description: 'forbidden, decision_segregation_of_duties, decision_approval_required o control_group_not_actionable'}
    DecisionEvent:
      type: object
      description: Evento de auditoría de una recomendación (nunca se actualiza ni se borra).
      properties:
        id: {type: integer}
        event: {type: string, enum: [transition, feedback, assignment, comment]}
        from_status: {type: [string, 'null']}
        to_status: {type: [string, 'null']}
        agenda_status: {type: [string, 'null']}
        actor_user_id: {type: [integer, 'null']}
        actor_kind: {type: string, enum: [user, system]}
        reason: {type: [string, 'null']}
        payload: {type: object, additionalProperties: true}
        created_at: {type: string, format: date-time}
    DecisionTransitionRequest:
      type: object
      required: [to_status, idempotency_key, expected_version]
      properties:
        to_status: {type: string, enum: [assigned, reviewed, approved, rejected, in_progress, executed, closed]}
        idempotency_key: {type: string, minLength: 8, maxLength: 120, pattern: '^[A-Za-z0-9._:-]+$', description: Una clave por intento lógico; reintentar con la misma no repite la transición}
        expected_version: {type: integer, minimum: 1, description: 'Obligatorio en toda transición humana (bloqueo optimista): la `version` leída'}
        reason: {type: [string, 'null'], maxLength: 1000, description: 'Obligatorio (≥ 5 caracteres) al rechazar o descartar'}
        assignee_user_id: {type: [integer, 'null'], description: 'Obligatorio al asignar o reasignar'}
    DecisionSummary:
      type: object
      properties:
        by_status: {type: object, additionalProperties: {type: integer}}
        by_kind: {type: object, additionalProperties: {type: integer}}
        by_attribution_label: {type: object, additionalProperties: {type: integer}}
        awaiting_assignment: {type: integer}
        awaiting_approval: {type: integer}
        expiring_within_24h: {type: integer}
        control_group_units: {type: integer, description: Solo con decisions.approve}
        attribution_note: {type: string}
    DecisionSettings:
      type: object
      properties:
        settings: {type: object, additionalProperties: true, description: 'Valores efectivos; `experiment_seed` es `[registrada]` o null'}
        defaults: {type: object, additionalProperties: true}
        score_formula:
          type: object
          properties:
            id: {type: string}
            revision: {type: integer}
            version: {type: string, description: SHA-256 de los parámetros efectivos}
            parameters: {type: object, additionalProperties: true}
        currency: {type: string}
        note: {type: string}
    DecisionSettingsUpdate:
      type: object
      description: Solo las claves enviadas cambian. Todos los valores por defecto son provisionales.
      properties:
        control_fraction: {type: number, minimum: 0, maximum: 0.5, description: 'Fracción de clientes en control; 0 = sin experimento'}
        experiment_key: {type: string, minLength: 3, maxLength: 80}
        experiment_seed: {type: [string, 'null'], minLength: 8, maxLength: 120}
        horizons: {type: array, items: {type: integer, enum: [7, 14, 15, 30, 90]}, minItems: 1, maxItems: 5}
        contact_cost: {type: [number, 'null'], minimum: 0, description: 'Costo de un contacto; null = no configurado'}
        contact_source: {type: string, enum: [radar, engine], default: radar, description: 'Quién produce los contactos y recuperaciones cliente × producto: el Radar (predictily:radar-materialize; por defecto, ADR-V25-12) o el Decision Engine (predictily:decisions-generate); la huella de idempotencia es la misma y usar ambos nunca duplica'}
        contact_min_probability: {type: number, minimum: 0, maximum: 1}
        max_contact_per_horizon: {type: integer, minimum: 1, maximum: 2000}
        max_supply_candidates: {type: integer, minimum: 1, maximum: 5000, default: 500, description: 'Tope de candidatos por grupo de reposición, inventario-demanda y presupuesto; entran los más urgentes'}
        expiry_days:
          type: object
          properties:
            recovery: {type: integer, minimum: 1, maximum: 365}
            customer_risk: {type: integer, minimum: 1, maximum: 365}
            inventory_mismatch: {type: integer, minimum: 1, maximum: 365}
            budget_constraint: {type: integer, minimum: 1, maximum: 365}
            scenario: {type: integer, minimum: 1, maximum: 365}
        approval_required_kinds: {type: array, items: {type: string, enum: [contact, recovery, customer_risk, replenishment, inventory_mismatch, budget_constraint, scenario]}}
        approval_cost_threshold: {type: [number, 'null'], minimum: 0}
        unreliable_cost_weight: {type: number, minimum: 0, maximum: 1}
        cost_reliability:
          type: object
          properties:
            window_days: {type: integer, minimum: 7, maximum: 730}
            min_observations: {type: integer, minimum: 1, maximum: 100}
            min_coverage: {type: number, minimum: 0, maximum: 1}
            max_cv: {type: number, minimum: 0, maximum: 5}
        inventory_max_age_days: {type: integer, minimum: 0, maximum: 90}
        excess_demand_ratio: {type: number, minimum: 0, maximum: 1}
    # <<< W5-B decision engine schemas
    # >>> W5-C outcomes y ROI honestos (esquemas)
    DecisionOutcome:
      type: object
      description: |-
        Resultado medido de una recomendación (V2.5 · W5-C; ADR-V25-14): acción registrada, evento observable posterior en la ventana fija, contribución (no ingresos brutos) y clasificación honesta, con la evidencia completa de la medición. `causally_attributable` no lo produce esta versión e `incremental_estimated` es un resultado agregado del informe, no de una fila.
      properties:
        id: {type: integer}
        recommendation:
          type: object
          properties:
            id: {type: integer}
            kind: {type: string, enum: [contact, recovery, customer_risk, replenishment, inventory_mismatch, budget_constraint, scenario]}
            status: {type: string, description: 'Estado de la recomendación AHORA (puede haber pasado a `measured`/`closed` tras medirla)'}
            as_of: {type: string, format: date}
            horizon_days: {type: integer}
            entity_type: {type: string}
            priority: {type: integer}
            assigned_user_id: {type: [integer, 'null']}
            customer: {type: [object, 'null'], properties: {id: {type: integer}, external_code: {type: string}}}
            product: {type: [object, 'null'], properties: {id: {type: integer}, sku: {type: string}, name: {type: string}}}
            expected_contribution: {type: [number, 'null'], description: 'Lo esperado al generar; NULL si el costo no era confiable'}
            attribution_label_at_generation: {type: string, enum: [potential_unproven, incremental_estimated, causally_attributable], description: 'La etiqueta al generar no cambia al medir; la clasificación medida está en `classification`'}
        action_kind: {type: string, enum: [contacted, executed, not_contacted, not_executed, rejected, expired, control], description: 'Qué pasó con la recomendación DENTRO de la ventana. `control` = retenida a propósito en el experimento. Una acción registrada tras cerrar la ventana no cuenta (not_contacted / not_executed)'}
        action_label: {type: [string, 'null']}
        action_at: {type: [string, 'null'], format: date-time, description: 'PRIMER momento en que quedó REGISTRADA la acción (cota conservadora: la acción real pudo ser anterior)'}
        window:
          type: object
          properties:
            from: {type: string, format: date, description: as_of + 1}
            to: {type: string, format: date, description: as_of + horizonte}
            knowledge_cutoff: {type: [string, 'null'], format: date, description: 'Fecha local hasta la que se leyeron las ventas (to + margen de espera)'}
        observed_event: {type: string, enum: [purchase, no_purchase, product_sales, stockout, no_sell_through], description: '`no_sell_through` = al cierre de la ventana la disponibilidad no bajó respecto de la de la recomendación (observación de existencias, no un diagnóstico de exceso)'}
        observed_ref: {type: [string, 'null'], description: 'Referencia sin datos personales (`sale:<id>`)'}
        observed_units: {type: [number, 'null'], description: 'Unidades netas de devoluciones (nunca negativas) de la VENTANA COMPLETA'}
        observed_net_amount: {type: [number, 'null'], description: 'Importe neto de la ventana completa (observación; incluye compras anteriores a la acción)'}
        contribution: {type: [number, 'null'], description: 'Importe neto − unidades netas × costo unitario confiable, de la ventana completa. `null` si el costo no es confiable; 0 si no hubo compra'}
        contribution_status: {type: [string, 'null'], enum: [known, unknown, not_applicable_no_purchase, null]}
        contribution_reasons: {type: array, items: {type: string}, description: 'Por qué el costo no es confiable (códigos de W5-B)'}
        after_action:
          type: [object, 'null']
          description: 'SOLO lo posterior a la acción registrada (compras emitidas después, netas de las devoluciones emitidas también después) y su contribución: lo único asociable a la acción. `null` si no hubo acción registrada dentro de la ventana'
          properties:
            units: {type: number}
            net_amount: {type: number}
            contribution: {type: [number, 'null']}
            contribution_status: {type: [string, 'null'], enum: [known, unknown, not_applicable_no_purchase, null]}
            contribution_reasons: {type: array, items: {type: string}}
            purchase_lines: {type: integer}
        contact_cost: {type: [number, 'null'], description: 'action_cost de la recomendación si hubo una acción registrada dentro de la ventana; 0 sin acción; null si hubo acción y no hay costo configurado (desconocido) o si es un tipo por producto'}
        classification: {type: string, enum: [forecast, observed, temporally_associated, incremental_estimated, causally_attributable], description: 'Las filas son `observed` o `temporally_associated`'}
        classification_label: {type: string}
        classification_note: {type: string, description: 'Lo que la clasificación SÍ y NO afirma'}
        method: {type: string, enum: [itt, quasi_experiment, none], description: 'Siempre `none` en las filas: el ITT es un método del agregado'}
        evidence:
          type: object
          additionalProperties: true
          description: |-
            Ventana y margen de espera (`window`), lectura as-of (`source`: corte de conocimiento, huella SHA-256 de las líneas leídas, líneas tardías no contadas, líneas revisadas o retiradas después), acción (`action`), alcance (`scope`), observación (`observation`, incluidas `returns_after_window` y `purchases_before/after_action`), `after_action`, contribución (`contribution`: por producto, desconocidos y motivos), `unit_costs`, `lines` (venta, línea, producto, unidades, importe, devolución, posterior a la acción; para deduplicar entre recomendaciones; `lines_truncated` si hay más de 100) y `classification_reason`. Solo para quien puede aprobar: `experiment`, `itt` y `unit`. Sin datos personales.
        measured_at: {type: [string, 'null'], format: date-time}
        experiment_group: {type: [string, 'null'], enum: [treatment, control, null], description: 'Solo con decisions.approve'}
    OutcomeExperiment:
      type: object
      description: 'Análisis por intención de tratamiento de un experimento y horizonte. Solo para quien puede aprobar. Cada parte se publica solo si su base lo permite; si no, no hay diferencia ni intervalo.'
      properties:
        experiment_key: {type: [string, 'null'], description: 'null = unidades con grupo que no se pudieron atribuir a un experimento (clave no registrada o ambigua)'}
        horizon_days: {type: integer}
        method: {type: string, enum: [itt]}
        status: {type: string, enum: [estimated, insufficient_sample, no_control_group, no_treatment_group, heterogeneous_control_fraction, not_analysed]}
        confidence_level: {type: number}
        z: {type: number}
        min_group_size: {type: integer, description: 'Provisional, «a aprobar en el piloto»; piso de 20'}
        min_buyers_per_arm: {type: integer, description: 'Compradores mínimos por grupo para publicar el intervalo monetario; provisional, piso de 5'}
        sample:
          type: object
          properties:
            treatment: {type: integer}
            control: {type: integer}
            treatment_converted: {type: integer}
            control_converted: {type: integer}
        control_fractions: {type: array, items: {type: number}}
        sample_ratio:
          type: object
          description: 'Cociente de muestras (SRM): proporción observada de control frente a la fracción registrada al asignar (χ², 1 g.l.)'
          properties:
            status: {type: string, enum: [ok, mismatch, not_evaluable]}
            expected_control_fraction: {type: [number, 'null']}
            observed_control_share: {type: [number, 'null']}
            chi_square: {type: number}
            p_value: {type: number}
            threshold: {type: number}
            note: {type: string}
        dropped_units:
          type: object
          description: 'Clientes descartados del análisis por grupo declarado en la recomendación'
          properties:
            repeat_customer: {$ref: '#/components/schemas/OutcomeArmCounts'}
            unverified_assignment: {$ref: '#/components/schemas/OutcomeArmCounts'}
            conflicting_groups: {$ref: '#/components/schemas/OutcomeArmCounts'}
        contamination:
          type: object
          properties:
            control_units_with_registered_action: {type: integer}
        estimators: {type: object, additionalProperties: {type: string}}
        conversion:
          type: object
          properties:
            rate_treatment: {type: [number, 'null']}
            rate_control: {type: [number, 'null']}
            difference: {type: [number, 'null']}
            ci_low: {type: [number, 'null']}
            ci_high: {type: [number, 'null']}
            significant: {type: [boolean, 'null'], description: 'El intervalo excluye 0'}
        contribution:
          type: object
          properties:
            status: {type: string, enum: [estimated, insufficient_sample, not_estimable, not_estimated]}
            reason: {type: [string, 'null'], description: 'contribution_population_below_min_group_size · buyers_below_min_per_arm · zero_variance · bootstrap_budget_exceeded · o el estado del experimento si no se estimó'}
            population: {$ref: '#/components/schemas/OutcomeArmCounts'}
            buyers: {$ref: '#/components/schemas/OutcomeArmCounts'}
            excluded_unreliable_cost: {$ref: '#/components/schemas/OutcomeArmCounts'}
            mean_treatment: {type: number}
            mean_control: {type: number}
            difference_per_unit: {type: number}
            ci_low: {type: number, description: 'Percentil del bootstrap'}
            ci_high: {type: number}
            significant: {type: boolean}
            interval:
              type: object
              properties:
                method: {type: string, enum: [bootstrap_percentile]}
                engine: {type: string}
                resamples: {type: integer, description: 'Remuestreos efectivos (pueden ser menos que los pedidos si el cómputo supera el tope)'}
                resamples_requested: {type: integer}
                seed: {type: integer, description: 'Semilla registrada: mismos datos y semilla, mismo intervalo'}
                seed_derivation: {type: string}
                resampling: {type: string}
                std_error: {type: number}
            tail_diagnostic:
              type: object
              description: 'Cola de la contribución de quienes compran. Ningún intervalo no paramétrico alcanza su nivel nominal con muestras de decenas o cientos de unidades cuando pocos compradores concentran el importe (cobertura medida de 74 a 94 %): con `heavy_tailed` el ROI añade el motivo `heavy_tailed_contribution` y el intervalo monetario debe leerse como indicativo'
              properties:
                buyer_cv: {type: number, description: 'Coeficiente de variación de los valores de quien compra (umbral 1,5)'}
                largest_buyer_share_of_arm: {type: number, description: 'Mayor participación de un solo comprador en el total de su grupo (umbral 0,25)'}
                heavy_tailed: {type: boolean}
                thresholds: {type: object, additionalProperties: {type: number}}
                note: {type: string}
            diagnostic_welch:
              type: object
              description: 'Solo diagnóstico: NO es el intervalo publicado (subestima la incertidumbre con contribución cero-inflada y de cola pesada)'
              properties:
                std_error: {type: number}
                ci_low: {type: number}
                ci_high: {type: number}
                note: {type: string}
        incremental:
          type: [object, 'null']
          properties:
            basis: {type: string}
            treated_units: {type: integer}
            contribution: {type: number}
            ci_low: {type: number}
            ci_high: {type: number}
        note: {type: string}
        contact_cost:
          type: object
          description: 'De las unidades de tratamiento del propio análisis (sin el filtro de tipo)'
          properties:
            total: {type: number}
            actions: {type: integer}
            actions_cost_unknown: {type: integer}
            basis: {type: string}
    OutcomeArmCounts:
      type: object
      properties:
        treatment: {type: integer}
        control: {type: integer}
    OutcomeRoi:
      type: object
      description: 'ROI honesto. `proven` es siempre false y `causal_claims` es 0 en esta versión. Quien no puede aprobar solo recibe status, label, value, proven, causal_claims, currency y message.'
      properties:
        status: {type: string, enum: [potential_unproven, incremental_estimated, incremental_conversion_only, multiple_experiments]}
        label: {type: string}
        proven: {type: boolean}
        causal_claims: {type: integer}
        currency: {type: string}
        value: {type: [number, 'null'], description: 'Siempre null sin estimación (potential_unproven, multiple_experiments y el detalle oculto)'}
        reasons: {type: array, items: {type: string}, description: 'no_control_group, insufficient_sample, contact_cost_unknown, buyers_below_min_per_arm, sample_ratio_mismatch, platform_usage_not_monetized…'}
        message: {type: string}
        associated_note: {type: string}
        data_origin_warning: {type: string, description: 'Presente mientras el origen de los datos no esté declarado como real (sin declarar: «origen no verificado»; demo o simulado: los importes NO son reales)'}
        experiments: {type: array, items: {type: string}, description: 'Con multiple_experiments: «clave|horizonte» de cada experimento estimado'}
        experiment_key: {type: string}
        horizon_days: {type: integer}
        confidence_level: {type: number}
        conversion: {type: object, additionalProperties: true}
        sample: {type: object, additionalProperties: {type: integer}}
        sample_ratio: {type: object, additionalProperties: true}
        incremental_contribution: {type: [object, 'null'], additionalProperties: true}
        contact_cost: {type: object, additionalProperties: true}
        net_incremental_contribution:
          type: [object, 'null']
          description: 'Incremento − costos de contacto, con intervalo; null si el costo de algún contacto es desconocido'
          properties:
            estimate: {type: number}
            ci_low: {type: number}
            ci_high: {type: number}
            significant: {type: boolean}
        roi_ratio: {type: [object, 'null'], additionalProperties: true, description: 'neto / costo de contacto, con intervalo; null sin costo de contacto'}
        net_after_platform_usage: {type: [object, 'null'], additionalProperties: true, description: 'Solo con precios de uso configurados'}
    OutcomeRoiReport:
      type: object
      description: 'Informe de ROI y outcomes honesto (V2.5 · W5-C). Separa oportunidad potencial, observación e incremento estimado; nunca los suma.'
      properties:
        method: {type: object, additionalProperties: true, description: 'Método, clasificaciones y parámetros provisionales vigentes'}
        filters:
          type: object
          properties:
            kind: {type: [array, 'null'], items: {type: string}}
            horizon_days: {type: [integer, 'null']}
            from: {type: string, format: date, description: 'Efectivo (con el valor por omisión aplicado si no se indicó)'}
            to: {type: string, format: date}
            period_days: {type: integer}
            period_defaulted: {type: boolean, description: 'true si `from` o `to` se tomaron por omisión (últimos 180 días)'}
            period_default_days: {type: integer}
            period_max_days: {type: integer}
            period_basis: {type: string}
            experiment_key: {type: [string, 'null']}
            group_by: {type: string, enum: [kind, horizon, segment, owner]}
        currency: {type: string}
        today: {type: string, format: date}
        data_origin:
          type: object
          description: 'Origen declarado de los datos (`tenants.settings.data_origin`; las empresas de demostración declaran `demo`). Sin declarar no se supone real; demo o simulado: los importes NO son resultados reales.'
          properties:
            value: {type: [string, 'null'], enum: [real, demo, simulated, null]}
            declared: {type: boolean}
            note: {type: string}
        summary: {$ref: '#/components/schemas/OutcomeRoiSummary'}
        experiments: {type: array, items: {$ref: '#/components/schemas/OutcomeExperiment'}, description: 'Solo con decisions.approve'}
        costs:
          type: object
          properties:
            contact: {type: object, additionalProperties: true}
            platform_usage: {type: object, additionalProperties: true}
        roi: {$ref: '#/components/schemas/OutcomeRoi'}
        breakdown:
          type: object
          properties:
            group_by: {type: string, enum: [kind, horizon, segment, owner]}
            rows:
              type: array
              items:
                allOf:
                - {$ref: '#/components/schemas/OutcomeRoiSummary'}
                - type: object
                  properties:
                    key: {type: string}
                    label: {type: string}
                    contact_cost: {type: object, additionalProperties: true}
        limitations: {type: array, items: {type: string}}
    OutcomeRoiSummary:
      type: object
      properties:
        funnel:
          type: object
          properties:
            recommendations: {type: integer}
            superseded_not_counted: {type: integer, description: 'Reemplazadas por una más nueva: no son otra oportunidad'}
            identified: {type: integer}
            control_held_out: {type: integer, description: 'Solo con decisions.approve'}
            actionable: {type: integer}
            measured: {type: integer}
            measured_actionable: {type: integer}
            forecast_pending: {type: object, description: 'Previsto (aún sin medir): ventana abierta, en espera de documentos tardíos o medible y aún sin medir', additionalProperties: {type: integer}}
            attended: {type: integer}
            action_rate: {type: [number, 'null']}
            responded_after_action: {type: integer}
            response_rate: {type: [number, 'null'], description: 'Asociación temporal, no efecto'}
            notes: {type: object, additionalProperties: {type: string}}
        by_classification: {type: object, additionalProperties: {type: integer}, description: 'Incluye `forecast` (virtual: no se persiste). `incremental_estimated` es siempre 0 en las filas'}
        by_action_kind: {type: object, additionalProperties: {type: integer}, description: '`control` solo con decisions.approve'}
        potential:
          type: object
          properties:
            label: {type: string}
            cells:
              type: array
              description: 'Una celda por tipo y horizonte; no se suman'
              items:
                type: object
                properties:
                  kind: {type: string}
                  horizon_days: {type: integer}
                  recommendations: {type: integer}
                  expected_contribution: {type: number}
                  recommendations_without_reliable_cost: {type: integer}
                  expected_gross_value: {type: number}
            note: {type: string}
        observed:
          type: object
          description: 'Compras de clientes en la ventana, deduplicadas por línea de venta (cliente × producto × venta × línea)'
          properties:
            label: {type: string}
            customers: {type: integer}
            purchase_lines: {type: integer}
            units: {type: number}
            net_amount: {type: number}
            contribution_known: {type: number}
            pairs_with_unknown_contribution: {type: integer}
            recommendations_with_purchase: {type: integer}
            rows_without_line_detail: {type: integer, description: 'Resultados sin detalle de líneas (más de 100 o anteriores a este formato): se suman por recomendación'}
            per_recommendation: {$ref: '#/components/schemas/OutcomePerRecommendation'}
            note: {type: string}
        associated:
          type: object
          description: 'SOLO lo posterior a la acción registrada, deduplicado'
          properties:
            label: {type: string}
            recommendations: {type: integer}
            customers: {type: integer}
            units: {type: number}
            net_amount: {type: number}
            contribution_known: {type: number}
            pairs_with_unknown_contribution: {type: integer}
            rows_without_line_detail: {type: integer}
            per_recommendation: {$ref: '#/components/schemas/OutcomePerRecommendation'}
            note: {type: string}
        control_baseline: {type: object, additionalProperties: true, description: 'Solo con decisions.approve'}
        supply: {type: object, additionalProperties: true, description: 'Quiebres, `no_sell_through` y ventas del producto observados en los tipos por producto'}
    OutcomePerRecommendation:
      type: object
      description: 'Suma por recomendación, solo para el detalle: NO es aditiva (varias recomendaciones pueden observar la misma venta)'
      properties:
        rows: {type: integer}
        units: {type: number}
        net_amount: {type: number}
        contribution_known: {type: number}
        rows_with_known_contribution: {type: integer}
        rows_with_unknown_contribution: {type: integer}
        note: {type: string}
    # <<< W5-C outcomes y ROI honestos (esquemas)
    # >>> W6-A seguridad Enterprise (esquemas)
    MfaStatus:
      type: object
      properties:
        enabled: {type: boolean}
        pending: {type: boolean, description: 'Hay un secreto generado aún sin verificar'}
        enabled_at: {type: [string, 'null'], format: date-time}
        recovery_codes_remaining: {type: integer}
        recovery_codes_on_previous_key: {type: integer, description: 'Códigos sin usar calculados con una clave de la aplicación anterior (APP_PREVIOUS_KEYS): regenerar antes de retirarla'}
        locked_until: {type: [string, 'null'], format: date-time, description: 'Bloqueo vigente por intentos fallidos'}
        required_by_policy: {type: boolean, description: 'Una política de la empresa o de la plataforma exige mantenerlo activo'}
        step_up:
          type: object
          properties:
            fresh: {type: boolean, description: 'Esta sesión/token verificó el segundo factor dentro de la ventana'}
            fresh_until: {type: [string, 'null'], format: date-time}
            ttl_seconds: {type: integer}
    MfaSetup:
      type: object
      properties:
        secret: {type: string, description: 'Secreto Base32 (160 bits). Se muestra solo en esta respuesta.'}
        otpauth_uri: {type: string, description: 'URI otpauth://totp/… para el código QR'}
        issuer: {type: string}
        digits: {type: integer, example: 6}
        period: {type: integer, example: 30}
        algorithm: {type: string, example: SHA1}
    MfaRecoveryCodes:
      type: object
      properties:
        enabled: {type: boolean}
        recovery_codes: {type: array, items: {type: string, example: ABCD-EFGH-JKMN-PQRS}, description: 'En claro SOLO en esta respuesta; la base guarda únicamente su hash'}
        recovery_codes_note: {type: string}
        revoked_login_tokens: {type: integer}
    ApiTokenSummary:
      type: object
      properties:
        id: {type: integer}
        kind: {type: string, enum: [login, connector, personal, other]}
        name: {type: string}
        tenant: {type: [string, 'null'], format: uuid}
        abilities: {type: array, items: {type: string}}
        current: {type: boolean, description: 'Es el token con el que se hizo esta petición'}
        expired: {type: boolean}
        last_used_at: {type: [string, 'null'], format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
        created_at: {type: [string, 'null'], format: date-time}
    ApiTokenCreated:
      type: object
      properties:
        token: {type: string, description: 'Valor del token (Authorization: Bearer …). Se muestra una sola vez.'}
        token_type: {type: string, example: Bearer}
        token_note: {type: string}
        id: {type: integer}
        name: {type: string}
        tenant: {type: string, format: uuid}
        abilities: {type: array, items: {type: string}}
        expires_at: {type: string, format: date-time}
    TenantTokenSummary:
      type: object
      properties:
        id: {type: integer}
        kind: {type: string, enum: [login, connector, personal, other]}
        name: {type: string}
        user:
          type: [object, 'null']
          properties:
            id: {type: integer}
            name: {type: string}
            email: {type: string}
        abilities: {type: array, items: {type: string}}
        expired: {type: boolean}
        last_used_at: {type: [string, 'null'], format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
        created_at: {type: [string, 'null'], format: date-time}
    CommercialScope:
      type: object
      description: 'Cartera del rol comercial. La cartera de clientes es la unión de los clientes listados, los de las zonas comerciales y los de los segmentos. Todo de la misma empresa.'
      properties:
        customer_ids: {type: array, maxItems: 500, items: {type: integer}}
        zones: {type: array, maxItems: 100, items: {type: string, maxLength: 80}}
        segment_ids: {type: array, maxItems: 100, items: {type: integer}}
        team_user_ids: {type: array, maxItems: 200, items: {type: integer}, description: 'Gerente: personas cuyas asignaciones ve'}
    CommercialRoleUpdate:
      type: object
      required: [commercial_role]
      properties:
        commercial_role: {type: [string, 'null'], enum: [gerente, vendedor, servicio, null]}
        commercial_scope: {$ref: '#/components/schemas/CommercialScope'}
    CommercialRoleResult:
      type: object
      properties:
        user_id: {type: integer}
        access_role: {$ref: '#/components/schemas/Role'}
        commercial_role: {type: [string, 'null'], enum: [gerente, vendedor, servicio, null]}
        commercial_role_label: {type: [string, 'null']}
        commercial_scope: {$ref: '#/components/schemas/CommercialScope'}
    SecurityPolicy:
      type: object
      properties:
        mfa_required_for_privileged: {type: boolean}
        privileged_members: {type: integer, description: 'Propietarios y administradores de la empresa'}
        privileged_without_mfa: {type: integer}
        note: {type: string}
    # <<< W6-A seguridad Enterprise (esquemas)
