          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
      x-ability: forecast.run
  /radar/opportunities/{id}/feedback:
    post:
      tags: [Revenue Radar]
      summary: Registrar el seguimiento de una oportunidad (estados heredados de la Agenda V2.2)
      description: |-
        Cambia el estado heredado de la agenda (`pendiente`, `contactado`, `interesado`, `pedido_recibido`, `pospuesto`, `descartado`) con autor, fecha, estado previo, estado nuevo y nota. **Auditable e inmutable**: cada cambio inserta un evento `feedback` en `decision_events` (nunca se edita ni se borra) y una fila en la auditoría general. **Idempotente**: `idempotency_key` (obligatoria, 8–120 caracteres) identifica la petición; repetirla devuelve el mismo evento con **200** (`replayed = true`, cabecera `Idempotent-Replayed`); la primera vez responde **201**; la misma clave con otro contenido, **409** `idempotency_key_reused`. Concurrencia: la fila se bloquea durante el cambio.

        Transición válida según la matriz de `status_map` (`pedido_recibido` y `descartado` son finales); inválida: 422 `invalid_transition` con los destinos permitidos. `pospuesto` exige `snoozed_until` (posterior a hoy, a lo sumo en un año **y no posterior al vencimiento de la oportunidad**: 422 `snooze_beyond_expiry`): la oportunidad sale de la agenda hasta esa fecha. La nota es texto libre acotado a 500 caracteres y se enmascaran correos y números de 10/13 dígitos.

        **Mapeo al workflow** (`radar-agenda-map-v1`, sin perder historial): el evento registra el estado de workflow que implica el estado heredado (`implied_workflow_status`: contactado e interesado → `in_progress`, pedido_recibido → `executed`, descartado → `rejected`, pendiente → `suggested`/`assigned`, pospuesto → sin cambio). La transición implicada la aplica el workflow de W5-B COMO CUALQUIER OTRA (habilidades del rol, segregación de funciones, aprobación de acciones sensibles, bloqueo optimista); si el workflow no la admite desde el estado actual (p. ej. `suggested`/`assigned`/`reviewed` → `in_progress` sin revisión, o una acción sensible sin aprobar), el seguimiento se registra igual, el workflow no se mueve y el motivo queda en `payload.workflow_sync` (`applied`, `unchanged`, `not_applicable`, `skipped`) y `workflow_sync_reason`. Solo mientras el workflow admite seguimiento (no rechazada, vencida, medida ni cerrada: 422 `opportunity_closed`). Las del grupo de control, y las de otra empresa, responden 404. **Predictily no envía mensajes**: registra lo que una persona hizo.

        Habilidad requerida: `decisions.manage` (analyst, admin, owner; el viewer recibe 403).
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RadarFeedbackRequest'}
      responses:
        '201':
          description: Seguimiento registrado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RadarFeedbackResult'}
        '200':
          description: 'Reintento de la misma petición (misma `idempotency_key`): se devuelve el resultado original sin otro evento'
          headers:
            Idempotent-Replayed: {schema: {type: string, enum: ['true']}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RadarFeedbackResult'}
        '403':
          description: 'Sin la habilidad decisions.manage, o el estado CIERRA la oportunidad (pedido_recibido, descartado) y el rol no podría hacer esa transición del workflow (code forbidden con required_ability, o decision_segregation_of_duties): no se registra nada'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: La clave de idempotencia ya se usó con otro contenido (code idempotency_key_reused)
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '422':
          description: 'Validación, transición inválida (`invalid_transition`, con `from`, `to` y `allowed`), oportunidad cerrada (`opportunity_closed`) o posposición más allá del vencimiento (`snooze_beyond_expiry`)'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
      x-ability: decisions.manage
  /radar/agenda:
    get:
      tags: [Revenue Radar]
      summary: Agenda comercial de una fecha, agrupada por cliente
      description: |-
        Oportunidades a gestionar en `date` (por defecto hoy en la zona horaria de la empresa), **agrupadas por cliente** (un cliente no se duplica por SKU) y paginadas por cliente. Vigentes a esa fecha (corte ≤ fecha, sin vencer), sin pedido recibido ni descartadas, y las **pospuestas solo reaparecen desde su fecha de reactivación**. Cada grupo trae el recuento, el mejor puntaje, la prioridad más urgente, el recuento por estado, la próxima acción (la de su mejor oportunidad) y las oportunidades. Mismos filtros que `/radar/opportunities` (cliente, SKU, horizonte, vendedor, segmento, zona, categoría, estado); con `state` se ve exactamente ese estado. Las del grupo de control no se asignan ni se muestran. Un `seller_id` sin oportunidades asignadas devuelve lista vacía, no la de otros. TODO(W6): alcance por cartera del rol vendedor.

