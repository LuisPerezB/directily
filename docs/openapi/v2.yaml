      tags: [Factor Intelligence]
      summary: Rechazar un evento propuesto
      description: 'Motivo obligatorio, usuario distinto de quien lo propuso (403 `segregation_of_duties`) y la versión revisada (`review_token` o If-Match; 422 `review_token_required`,
        409 `event_changed_since_review`).


        Habilidad requerida: `settings.manage`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
