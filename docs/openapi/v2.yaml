  /supply/simulations:
    post:
      tags: [Abastecimiento]
      summary: Solicitar una simulación histórica de operación (asíncrona)
      description: 'Re-juega políticas (`current`, `reference`, `planner`) con la información disponible a cada fecha. No reemplaza la validación con datos
        reales.


        Habilidad requerida: `forecast.run`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                days: {type: integer, minimum: 28, maximum: 365}
                review_days: {type: integer, minimum: 1, maximum: 60}
                as_of:
                  type: [string, 'null']
                  format: date
                seed: {type: integer, minimum: 0, maximum: 1000000}
      responses:
        '202':
          description: Corrida histórica en cola
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/SupplyRun'}
        '402': {$ref: '#/components/responses/PlanLimit'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: '`supply_run_in_progress`'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/Validation'}
      x-ability: forecast.run
    get:
      tags: [Abastecimiento]
      summary: Listar simulaciones
      description: 'Habilidad requerida: `forecast.view`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      - {$ref: '#/components/parameters/Page'}
      - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200':
          description: Corridas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/SupplyRun'}
                  meta: {$ref: '#/components/schemas/PageMeta'}
        '403': {$ref: '#/components/responses/Forbidden'}
      x-ability: forecast.view
  /supply/simulations/{id}:
    get:
      tags: [Abastecimiento]
      summary: Resultado de una simulación
      description: 'Habilidad requerida: `forecast.view`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: Corrida y resultados por política (servicio, no atendido, sobrestock, días de inventario, costos, capital); result_type = evaluation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      run: {$ref: '#/components/schemas/SupplyRun'}
                      results:
                        type: [object, 'null']
                        additionalProperties: true
                  envelope: {$ref: '#/components/schemas/ResultEnvelope'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      x-ability: forecast.view
  /syncs/{id}:
    get:
      tags: [Core de Datos]
      summary: Detalle de una sincronización
      description: 'Habilidad requerida: `datasources.manage`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: Sincronización
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/SourceSync'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      x-ability: datasources.manage
  /tenant/core-config/{core}:
    put:
      tags: [Plataforma]
      summary: Definir los valores de empresa de un core (validados por el motor)
      description: '`overrides: {}` elimina los valores de empresa. Claves desconocidas, tipos o rangos inválidos: 422 `invalid_config`. No modifica ejecuciones
        pasadas.


        Habilidad requerida: `settings.manage`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      - {$ref: '#/components/parameters/CoreName'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                overrides: {type: object, additionalProperties: true}
              required: [overrides]
      responses:
        '200':
          description: Configuración efectiva resultante
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/EffectiveConfig'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Validation'}
        '503':
          description: '`engine_unavailable`'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
      x-ability: settings.manage
  /tenant/effective-config:
    get:
      tags: [Plataforma]
      summary: Configuración efectiva de un core (valor y procedencia por clave)
      description: 'Habilidad requerida: `data.view`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      - name: core
        in: query
        schema:
          type: string
          enum: [demand, customer, supply, cost, scenario]
        required: true
      responses:
        '200':
          description: Configuración
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/EffectiveConfig'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Validation'}
        '503':
          description: '`engine_unavailable`'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
      x-ability: data.view
  /tenant/export/{export}/download:
    get:
      tags: [Privacidad]
      summary: Descargar una exportación completa (ZIP, URL firmada temporal)
      description: Ruta firmada; solo quien solicitó la exportación puede descargarla. Se audita (`data.exported`).
      parameters:
      - {$ref: '#/components/parameters/ExportId'}
      responses:
        '200':
          description: Archivo ZIP con un CSV por tabla (incluye los resultados de los cores de la etapa 2; nunca credenciales)
          content:
            application/zip:
              schema: {type: string, format: binary}
        '403': {description: Firma inválida o vencida}
        '404': {$ref: '#/components/responses/NotFound'}
  /unit-conversions:
    get:
      tags: [Core de Datos]
      summary: Listar conversiones de unidades declaradas
      description: 'Sin una conversión declarada, dos unidades distintas son un error: nunca se asume una conversión.


        Habilidad requerida: `data.view`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      - name: product_id
        in: query
        schema: {type: integer}
      responses:
        '200':
          description: Conversiones (generales y del producto)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/UnitConversion'}
        '403': {$ref: '#/components/responses/Forbidden'}
      x-ability: data.view
    post:
      tags: [Core de Datos]
      summary: Declarar una conversión de unidades
      description: 'Habilidad requerida: `catalog.manage`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product_sku:
                  type: [string, 'null']
                from_unit: {type: string}
                to_unit: {type: string}
                factor: {type: number, exclusiveMinimum: 0}
                valid_from:
                  type: [string, 'null']
                  format: date
                source:
                  type: [string, 'null']
              required: [from_unit, to_unit, factor]
      responses:
        '201':
          description: Conversión
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/UnitConversion'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Validation'}
      x-ability: catalog.manage
  /unit-conversions/{id}:
    delete:
      tags: [Core de Datos]
      summary: Eliminar una conversión de unidades
      description: 'Habilidad requerida: `catalog.manage`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      - {$ref: '#/components/parameters/Id'}
      responses:
        '204': {description: Eliminada}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
      x-ability: catalog.manage
  /warehouses:
    get:
      tags: [Core de Datos]
      summary: Listar almacenes
      description: 'Habilidad requerida: `data.view`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      responses:
        '200':
          description: Almacenes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Warehouse'}
        '403': {$ref: '#/components/responses/Forbidden'}
      x-ability: data.view
    post:
      tags: [Core de Datos]
      summary: Crear o actualizar un almacén (importador)
      description: 'Habilidad requerida: `catalog.manage`.'
      parameters:
      - {$ref: '#/components/parameters/TenantHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: {type: string}
                name: {type: string}
                branch_code: {type: string}
                storage_capacity:
                  type: [number, 'null']
                capacity_unit:
                  type: [string, 'null']
                is_active: {type: boolean}
              required: [code, name, branch_code]
      responses:
        '201':
          description: Almacén
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Warehouse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Validation'}
      x-ability: catalog.manage
components:
  parameters:
    MappingId:
      name: mapping
      in: path
      required: true
      schema: {type: integer}
    CoreName:
      name: core
      in: path
      required: true
      schema:
        type: string
        enum: [demand, customer, supply, cost, scenario]
    ExportId:
      name: export
      in: path
      required: true
      schema: {type: integer}
    CustomerHorizon:
      name: horizon
      in: query
      description: 'Horizonte de comportamiento de compra. Por defecto 30 (o el mayor que permita el plan). Fuera del plan: 402.'
      schema:
        type: integer
        enum: [7, 30, 90]
  schemas:
    PageMeta:
      type: object
      properties:
        current_page: {type: integer}
        per_page: {type: integer}
        total: {type: integer}
        last_page: {type: integer}
    ResultEnvelope:
      type: object
      description: Envoltura común de resultados (ADR-V2-03). `status` = estado técnico del trabajo; `quality_status` = aptitud del resultado. Un resultado
        sin ejecución completada lleva `quality_status = insufficient_data` (abstención explícita).
      properties:
        tenant_id: {type: integer}
        run_id:
          type: [integer, 'null']
        core:
          type: string
          enum: [demand, customer, supply, cost, scenario]
        run_version:
          type: [integer, 'null']
        status:
          type: [string, 'null']
          description: Estado técnico de la ejecución (≠ quality_status)
        as_of:
          type: [string, 'null']
          format: date
        horizon_start:
          type: [string, 'null']
          format: date
        horizon_end:
          type: [string, 'null']
          format: date
        target_definition:
          type: [object, 'null']
          additionalProperties: true
        entity_keys:
          type: [array, 'null']
          items: {type: string}
        unit:
          type: [string, 'null']
        currency:
          type: [string, 'null']
        result_type:
          type: [string, 'null']
          enum: [forecast, conditional_simulation, causal_estimate, optimized_plan, evaluation, null]
        model_version:
          type: [object, 'null']
          additionalProperties: true
          description: 'Versiones de modelo servidas por horizonte/objetivo (p. ej. claves «7», «30», «90»). Siempre objeto JSON, también con claves numéricas o vacío;
            null cuando la corrida no registra modelos'
        data_snapshot_id:
          type: [integer, 'null']
        config_version:
          type: [string, 'null']
          description: Hash de la configuración efectiva
        assumptions:
          type: array
          items: {type: string}
        limitations:
          type: array
          items: {type: string}
        quality_status:
          type: [string, 'null']
          enum: [ok, degraded, insufficient_data, not_configured, insufficient_evidence, null]
        uncertainty_source:
          type: [string, 'null']
          enum: [empirical_holdout, conformal, model, unknown, none, null]
    CoreTrainingJob:
      type: object
      properties:
        id: {type: integer}
        job_type: {type: string, description: 'customer_train, customer_predict, supply_plan, cost_forecast, supply_simulation, scenario_evaluation, ...'}
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        stage:
          type: [string, 'null']
        progress: {type: integer}
        attempts: {type: integer}
        error_message:
          type: [string, 'null']
        queued_at:
          type: [string, 'null']
          format: date-time
        started_at:
          type: [string, 'null']
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
        duration_ms:
          type: [integer, 'null']
        result:
          type: [object, 'null']
          additionalProperties: true
    CustomerRun:
      type: object
      properties:
        id: {type: integer}
        version: {type: integer}
        run_type:
          type: string
          enum: [production, historical]
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled]
        quality_status:
          type: [string, 'null']
        result_type:
          type: [string, 'null']
        triggered_by: {type: string}
        as_of:
          type: [string, 'null']
          format: date
        is_current: {type: boolean}
        config_version:
          type: [string, 'null']
        data_snapshot_id:
          type: [integer, 'null']
        summary:
          type: [object, 'null']
          additionalProperties: true
        assumptions:
          type: array
          items: {type: string}
        limitations:
          type: array
          items: {type: string}
        error_message:
          type: [string, 'null']
        started_at:
          type: [string, 'null']
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
        created_at: {type: string, format: date-time}
        training_job:
          oneOf:
          - {$ref: '#/components/schemas/CoreTrainingJob'}
          - {type: 'null'}
        operation:
          type: string
          enum: [train, predict]
        horizons:
          type: array
          items:
            type: integer
            enum: [7, 30, 90]
        model_versions:
          type: [object, 'null']
          additionalProperties: true
          description: Versiones servidas por horizonte (clave = horizonte). Siempre objeto JSON (ver ResultEnvelope.model_version)
        envelope: {$ref: '#/components/schemas/ResultEnvelope'}
    SupplyRun:
      type: object
      properties:
        id: {type: integer}
        version: {type: integer}
        run_type:
          type: string
          enum: [production, historical]
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled]
        quality_status:
          type: [string, 'null']
        result_type:
          type: [string, 'null']
        triggered_by: {type: string}
        as_of:
          type: [string, 'null']
          format: date
        is_current: {type: boolean}
        config_version:
          type: [string, 'null']
        data_snapshot_id:
          type: [integer, 'null']
        summary:
          type: [object, 'null']
          additionalProperties: true
        assumptions:
          type: array
          items: {type: string}
        limitations:
          type: array
          items: {type: string}
        error_message:
          type: [string, 'null']
        started_at:
          type: [string, 'null']
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
        created_at: {type: string, format: date-time}
        training_job:
          oneOf:
          - {$ref: '#/components/schemas/CoreTrainingJob'}
          - {type: 'null'}
        core:
          type: string
          enum: [supply, cost, scenario]
        operation: {type: string, description: 'plan, simulate, cost_forecast, evaluate'}
        uncertainty_source:
          type: [string, 'null']
        horizon_start:
          type: [string, 'null']
          format: date
        horizon_end:
          type: [string, 'null']
          format: date
        options:
          type: object
          additionalProperties: true
          description: Opciones de la solicitud. Siempre objeto JSON, también `{}` cuando no hay opciones
    SourceMapping:
      type: object
      properties:
        id: {type: integer}
        data_source_id: {type: integer}
        entity: {type: string}
        version: {type: integer}
        query: {type: string, description: Una sola sentencia SELECT (o vista) de solo lectura}
        field_map: {type: object, additionalProperties: true}
        options: {type: object, additionalProperties: true}
        is_active: {type: boolean}
        approved_at:
          type: [string, 'null']
          format: date-time
        approved_by:
          oneOf:
          - type: object
            properties:
              id: {type: integer}
              name: {type: string}
          - {type: 'null'}
        created_at: {type: string, format: date-time}
    SourceMappingInput:
      type: object
      properties:
        entity: {type: string, maxLength: 30, description: 'sales, products, customers, inventory, commitments, costs, branches, suppliers'}
        query: {type: string, description: Una sola sentencia SELECT de solo lectura; 422 sql_query_rejected (reason) si no lo es}
        field_map:
          type: object
          minProperties: 1
          additionalProperties: {type: string}
          description: '{campo_predictily: columna_origen}'
        options: {type: object, additionalProperties: true}
      required: [entity, query, field_map]
    SourceSync:
      type: object
      properties:
        id: {type: integer}
        data_source_id: {type: integer}
        entity: {type: string}
        mapping_version:
          type: [integer, 'null']
        mode:
          type: string
          enum: [full, incremental]
        status:
          type: string
          enum: [queued, running, completed, needs_review, failed]
        triggered_by:
          type: string
          enum: [user, schedule]
        since:
          type: [string, 'null']
          format: date-time
        watermark:
          type: [string, 'null']
          format: date-time
        rows_extracted: {type: integer}
        pages: {type: integer}
        import_job_id:
          type: [integer, 'null']
        stats: {type: object, additionalProperties: true}
        error_message:
          type: [string, 'null']
        started_at:
          type: [string, 'null']
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
        created_at: {type: string, format: date-time}
    DataCoverage:
      type: object
      properties:
        id: {type: integer}
        entity: {type: string}
        data_source_id:
          type: [integer, 'null']
        branch_id:
          type: [integer, 'null']
        complete_from:
          type: [string, 'null']
          format: date
        complete_through:
          type: [string, 'null']
          format: date
        basis:
          type: string
          enum: [declared, inferred]
        last_ingested_at:
          type: [string, 'null']
          format: date-time
        notes:
          type: [string, 'null']
    CalendarEvent:
      type: object
      description: Una revisión del evento. Con `as_of` solo se devuelven revisiones con `known_at` ≤ corte (las de `known_at` desconocido se excluyen).
      properties:
        id: {type: integer}
        tenant_id:
          type: [integer, 'null']
          description: null = calendario público (solo lectura)
        scope:
          type: string
          enum: [country, region, tenant, branch, category, product, sector]
        scope_ref:
          type: [string, 'null']
        code: {type: string}
        name: {type: string}
        category: {type: string, description: 'holiday, local_holiday, commercial_season, campaign, promotion, sector_event, agricultural_season, international_peak,
            exceptional'}
        starts_on: {type: string, format: date}
        ends_on: {type: string, format: date}
        status:
          type: string
          enum: [planned, confirmed, cancelled]
        known_at:
          type: [string, 'null']
          format: date-time
        source: {type: string}
        revision: {type: integer}
    CalendarEventInput:
      type: object
      properties:
        scope:
          type: string
          enum: [country, region, tenant, branch, category, product, sector]
        scope_ref:
          type: [string, 'null']
          maxLength: 80
        code: {type: string, maxLength: 80}
        name: {type: string, maxLength: 200}
        category: {type: string}
        starts_on: {type: string, format: date}
        ends_on:
          type: [string, 'null']
          format: date
        status:
          type: string
          enum: [planned, confirmed, cancelled]
        known_at:
          type: [string, 'null']
          format: date-time
        source:
          type: [string, 'null']
          maxLength: 50
      required: [scope, code, name, category, starts_on]
    CommitmentItem:
      type: object
      properties:
        line_number: {type: integer}
        product_id: {type: integer}
        quantity: {type: number}
        quantity_fulfilled: {type: number}
        pending: {type: number}
        unit:
          type: [string, 'null']
        unit_price:
          type: [number, 'null']
        delivery_date:
          type: [string, 'null']
          format: date
        source_quantity:
          type: [number, 'null']
        source_unit:
          type: [string, 'null']
        conversion_factor:
          type: [number, 'null']
          description: Factor declarado aplicado (null = sin conversión)
    Commitment:
      type: object
      description: Intención comercial / compromiso confirmado. NO es una venta realizada ni se suma a la demanda.
      properties:
        id: {type: integer}
        commitment_type:
          type: string
          enum: [quote, order, contract]
        external_id: {type: string}
        status:
          type: string
          enum: [open, confirmed, partially_fulfilled, fulfilled, cancelled, expired]
        issued_at: {type: string, format: date-time}
        known_at:
          type: [string, 'null']
          format: date-time
        known_at_unknown: {type: boolean}
        valid_from:
          type: [string, 'null']
          format: date
        valid_to:
          type: [string, 'null']
          format: date
        expected_delivery_date:
          type: [string, 'null']
          format: date
        cancelled_at:
          type: [string, 'null']
          format: date-time
        cancellation_date_unknown: {type: boolean}
        currency: {type: string}
        customer_id:
          type: [integer, 'null']
        branch_id:
          type: [integer, 'null']
        data_source_id:
          type: [integer, 'null']
        items:
          type: array
          items: {$ref: '#/components/schemas/CommitmentItem'}
        pending_total: {type: number}
        revisions:
          type: array
          items:
            type: object
            properties:
              revision: {type: integer}
              status: {type: string}
              known_at:
                type: [string, 'null']
                format: date-time
              cancelled_at:
                type: [string, 'null']
                format: date-time
              recorded_at:
                type: [string, 'null']
                format: date-time
          description: Solo en el detalle
        status_at_cutoff: {type: string, description: 'Solo con `as_of`: estado reconstruido al corte'}
        known_basis:
          type: string
          enum: [declared, ingestion]
          description: Solo con `as_of`
    CommitmentInput:
      type: object
      properties:
        commitment_type: {type: string, maxLength: 40, description: 'quote | order | contract (se aceptan sinónimos: cotización, pedido, contrato...)'}
        external_id: {type: string, maxLength: 100}
        status:
