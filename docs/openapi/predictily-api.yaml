openapi: 3.1.0
info:
  title: Predictily API pública v1
  version: 1.0.0
  description: 'API pública de Predictily (Laravel 13), rutas del núcleo: autenticación, empresas, usuarios,

    catálogos, ventas, importaciones, fuentes de datos, privacidad y administración de plataforma.


    Incluye las rutas del núcleo y las analíticas (pronósticos, dashboard, precisión, inventario, alertas, escenarios,
    exportaciones). Archivo generado por `infra/scripts/merge_openapi.py`; editar `core.yaml` o `analytics.yaml`.

    '
servers:
- url: /api/v1
security:
- sessionCookie: []
- bearerToken: []
tags:
- name: Autenticación
- name: Empresas
- name: Usuarios
- name: Catálogos
- name: Ventas
- name: Importaciones
- name: Fuentes de datos
- name: Privacidad
- name: Plataforma
- name: Pronósticos
- name: Dashboard
- name: Precisión
- name: Inventario
- name: Alertas
- name: Escenarios
- name: Exportaciones
paths:
  /accuracy/comparison:
    get:
      tags:
      - Precisión
      summary: Pronóstico de una ejecución pasada frente a ventas reales
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - name: run_id
        in: query
        required: true
        schema:
          type: integer
      - $ref: '#/components/parameters/BranchId'
      - $ref: '#/components/parameters/CategoryId'
      - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Puntos diarios; días censurados por quiebre de stock se excluyen de las métricas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      points:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                              format: date
                            yhat:
                              type: number
                            lo_80:
                              type:
                              - number
                              - 'null'
                            hi_80:
                              type:
                              - number
                              - 'null'
                            actual:
                              type:
                              - number
                              - 'null'
                            censored:
                              type: boolean
                      metrics:
                        $ref: '#/components/schemas/Metrics'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
  /accuracy/summary:
    get:
      tags:
      - Precisión
      summary: Métricas de backtesting, precisión realizada y explicación en lenguaje sencillo
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AccuracySummary'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/plans:
    get:
      tags:
      - Plataforma
      summary: Planes
      responses:
        '200':
          description: OK
  /admin/tenants:
    get:
      tags:
      - Plataforma
      summary: Empresas (superadmin; sin datos de negocio)
      responses:
        '200':
          description: OK
        '403':
          $ref: '#/components/responses/Error'
  /admin/tenants/{uuid}:
    parameters:
    - name: uuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      tags:
      - Plataforma
      summary: Asignar plan, estado o límites específicos
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_code:
                  type: string
                  enum:
                  - trial
                  - basico
                  - profesional
                  - empresarial
                status:
                  type: string
                  enum:
                  - active
                  - suspended
                plan_overrides:
                  type: object
      responses:
        '200':
          description: OK
  /admin/usage:
    get:
      tags:
      - Plataforma
      summary: Consumo mensual por empresa
      responses:
        '200':
          description: OK
  /alerts:
    get:
      tags:
      - Alertas
      summary: Listar alertas
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - open
          - acknowledged
          - resolved
      - name: type
        in: query
        schema:
          type: string
      - name: severity
        in: query
        schema:
          type: string
          enum:
          - info
          - warning
          - critical
      responses:
        '200':
          description: Lista paginada de alertas
  /alerts/{id}:
    patch:
      tags:
      - Alertas
      summary: Reconocer o resolver una alerta
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - open
                  - acknowledged
                  - resolved
      responses:
        '200':
          description: Actualizada
        '404':
          $ref: '#/components/responses/NotFound'
  /audit-logs:
    parameters:
    - $ref: '#/components/parameters/TenantId'
    get:
      tags:
      - Privacidad
      summary: Bitácora de auditoría (audit.view)
      responses:
        '200':
          description: OK
  /auth/login:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión (sesión SPA o token Bearer si no hay sesión)
      description: 5 intentos por minuto por correo + IP. Éxitos y fallos se auditan.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                remember:
                  type: boolean
      responses:
        '200':
          $ref: '#/components/responses/LoginResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      tags:
      - Autenticación
      summary: Cerrar sesión (revoca el token actual si aplica)
      responses:
        '204':
          description: Sesión cerrada
  /auth/me:
    get:
      tags:
      - Autenticación
      summary: Usuario actual y sus empresas
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      tenants:
                        type: array
                        items:
                          $ref: '#/components/schemas/TenantSummary'
        '401':
          $ref: '#/components/responses/Error'
  /auth/password:
    put:
      tags:
      - Autenticación
      summary: Cambiar contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - current_password
              - password
              - password_confirmation
              properties:
                current_password:
                  type: string
                password:
                  type: string
                  minLength: 10
                password_confirmation:
                  type: string
      responses:
        '204':
          description: Contraseña actualizada
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/register:
    post:
      tags:
      - Autenticación
      summary: Registrar usuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - email
              - password
              - password_confirmation
              - accept_terms
              properties:
                name:
                  type: string
                  maxLength: 150
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 10
                  description: Debe contener letras y números
                password_confirmation:
                  type: string
                accept_terms:
                  type: boolean
      responses:
        '201':
          $ref: '#/components/responses/LoginResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /branches:
    parameters:
    - $ref: '#/components/parameters/TenantId'
    get:
      tags:
      - Catálogos
      summary: Sucursales
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Branch'
    post:
      tags:
      - Catálogos
      summary: Crear sucursal (branches.manage; límite max_branches)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchInput'
      responses:
        '201':
          description: Creada
        '402':
          $ref: '#/components/responses/Error'
  /branches/{branch}:
    parameters:
    - $ref: '#/components/parameters/TenantId'
    - name: branch
      in: path
      required: true
      schema:
        type: integer
    get:
      tags:
      - Catálogos
      summary: Sucursal
      responses:
        '200':
          description: OK
        '404':
          $ref: '#/components/responses/Error'
    patch:
      tags:
      - Catálogos
      summary: Actualizar sucursal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchInput'
      responses:
        '200':
          description: OK
    delete:
      tags:
      - Catálogos
      summary: Eliminar (o desactivar si tiene ventas)
      responses:
        '200':
          description: OK
  /connectors:
    parameters:
    - $ref: '#/components/parameters/TenantId'
    get:
      tags:
      - Fuentes de datos
      summary: 'Conectores [{key, name, description, status: available|requires_credentials|planned, entity_types}]'
      responses:
        '200':
          description: OK
  /dashboard/summary:
    get:
      tags:
      - Dashboard
      summary: Resumen comercial (cuánto venderé, qué sube/baja, qué podría agotarse, inversión, confiabilidad)
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/Horizon'
      - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Resumen (KPIs de pronóstico en null si no hay ejecución vigente)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DashboardSummary'
  /data-sources:
    parameters:
    - $ref: '#/components/parameters/TenantId'
    get:
      tags:
      - Fuentes de datos
      summary: Fuentes (nunca devuelve credenciales)
      responses:
        '200':
          description: OK
    post:
      tags:
      - Fuentes de datos
      summary: Crear fuente (datasources.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              - name
              properties:
                type:
                  type: string
                  enum:
                  - file_upload
                  - rest_api
                  - connector
                name:
                  type: string
                connector_key:
                  type: string
                config:
                  type: object
                credentials:
                  type: object
                  description: Se guardan cifradas; nunca se devuelven
      responses:
        '201':
          description: Creada
  /data-sources/{dataSource}:
    parameters:
    - $ref: '#/components/parameters/TenantId'
    - name: dataSource
      in: path
      required: true
      schema:
        type: integer
    patch:
      tags:
      - Fuentes de datos
      summary: Actualizar
      responses:
        '200':
          description: OK
    delete:
      tags:
      - Fuentes de datos
      summary: Eliminar (revoca sus tokens)
      responses:
        '204':
          description: Eliminada
  /data-sources/{dataSource}/test:
    parameters:
    - $ref: '#/components/parameters/TenantId'
    - name: dataSource
      in: path
      required: true
      schema:
        type: integer
    post:
      tags:
      - Fuentes de datos
      summary: Probar conector (sin efectos)
      responses:
        '200':
          description: 'data: {ok, message, details}'
  /data-sources/{dataSource}/tokens:
    parameters:
    - $ref: '#/components/parameters/TenantId'
    - name: dataSource
      in: path
      required: true
      schema:
        type: integer
    post:
      tags:
      - Fuentes de datos
      summary: Crear token Bearer ligado a la empresa (se muestra una sola vez)
      responses:
        '201':
          description: 'data: {token, token_id, expires_at, abilities}'
        '402':
          $ref: '#/components/responses/Error'
  /data-sources/{dataSource}/tokens/{tokenId}:
    parameters:
    - $ref: '#/components/parameters/TenantId'
    - name: dataSource
      in: path
      required: true
      schema:
        type: integer
    - name: tokenId
      in: path
      required: true
      schema:
        type: integer
    delete:
      tags:
      - Fuentes de datos
      summary: Revocar token
      responses:
        '204':
          description: Revocado
  /exports/accuracy.csv:
    get:
      tags:
      - Exportaciones
      summary: Evaluaciones de modelos
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/Delimiter'
      responses:
        '200':
          description: CSV
          content:
            text/csv:
              schema:
                type: string
  /exports/forecasts.csv:
    get:
      tags:
      - Exportaciones
      summary: Pronóstico por producto (resumen o por período si se indica granularity)
      description: Requiere `data.export`. UTF-8 con BOM. Queda auditado (`data.exported`).
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/Horizon'
      - $ref: '#/components/parameters/BranchId'
      - $ref: '#/components/parameters/CategoryId'
      - $ref: '#/components/parameters/Granularity'
      - $ref: '#/components/parameters/Delimiter'
      responses:
        '200':
          description: CSV
          content:
            text/csv:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /exports/recommendations.csv:
    get:
      tags:
      - Exportaciones
      summary: Recomendaciones de abastecimiento
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/Delimiter'
      responses:
        '200':
          description: CSV
          content:
            text/csv:
              schema:
                type: string
  /exports/sales-summary.csv:
    get:
      tags:
      - Exportaciones
      summary: Resumen de ventas válidas por período
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - name: date_from
        in: query
        schema:
          type: string
          format: date
      - name: date_to
        in: query
        schema:
          type: string
          format: date
      - $ref: '#/components/parameters/BranchId'
      - $ref: '#/components/parameters/CategoryId'
      - $ref: '#/components/parameters/ProductId'
      - $ref: '#/components/parameters/Granularity'
      - $ref: '#/components/parameters/Delimiter'
      responses:
        '200':
          description: CSV
          content:
            text/csv:
              schema:
                type: string
  /forecast-runs:
    post:
      tags:
      - Pronósticos
      summary: Solicitar una ejecución de pronóstico (asíncrona)
      description: Requiere la habilidad `forecast.run` (propietario, administrador, analista).
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                horizon_days:
                  type: integer
                  enum:
                  - 7
                  - 30
                  - 90
                  default: 90
                cutoff_date:
                  type: string
                  format: date
                  description: Fecha de corte pasada; crea una ejecución `historical` (nunca vigente).
      responses:
        '202':
          description: Ejecución creada en cola
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ForecastRun'
        '402':
          $ref: '#/components/responses/PlanLimit'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Ya hay una ejecución en cola o en proceso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  code:
                    type: string
                    const: forecast_run_in_progress
                  active_run:
                    type: object
                    properties:
                      id:
                        type: integer
                      version:
                        type: integer
                      status:
                        type: string
                      created_at:
                        type: string
                        format: date-time
        '422':
          $ref: '#/components/responses/Validation'
    get:
      tags:
      - Pronósticos
      summary: Listar ejecuciones (más reciente primero)
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
          - cancelled
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedForecastRuns'
  /forecast-runs/{id}:
    get:
      tags:
      - Pronósticos
      summary: Detalle de una ejecución
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ForecastRun'
        '404':
          $ref: '#/components/responses/NotFound'
  /forecasts/categories:
    get:
      tags:
      - Pronósticos
      summary: Pronóstico por categoría
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/Horizon'
      - $ref: '#/components/parameters/BranchId'
      - name: search
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Categorías
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        category:
                          type: object
                          properties:
                            id:
                              type:
                              - integer
                              - 'null'
                            name:
                              type: string
                        history_units:
                          type: number
                        forecast_units:
                          type: number
                        change_pct:
                          type:
                          - number
                          - 'null'
                        trend:
                          type: string
                          enum:
                          - up
                          - down
                          - flat
                        forecast_revenue:
                          type:
                          - number
                          - 'null'
                  run:
                    $ref: '#/components/schemas/RunRef'
  /forecasts/products:
    get:
      tags:
      - Pronósticos
      summary: Ranking de productos (pronóstico vs período histórico equivalente)
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/Horizon'
      - $ref: '#/components/parameters/BranchId'
      - $ref: '#/components/parameters/CategoryId'
      - name: search
        in: query
        schema:
          type: string
          maxLength: 100
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - change_pct
          - -change_pct
          - forecast_units
          - -forecast_units
          - revenue
          - -revenue
          - name
          default: -forecast_units
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Lista paginada (o data vacía y run null si no hay pronóstico)
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginationEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ProductForecast'
                    run:
                      $ref: '#/components/schemas/RunRef'
                    horizon:
                      type: integer
  /forecasts/series:
    get:
      tags:
      - Pronósticos
      summary: Historia y pronóstico de un nodo de la jerarquía
      description: 'Nodo: sin filtros → `total`; branch → `branch:{b}`; category → `category:{c}`;

        branch+category → `branch_category:{b}:{c}`; product → `product:{p}`; product+branch → `series:{b}:{p}`.

        '
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/BranchId'
      - $ref: '#/components/parameters/CategoryId'
      - $ref: '#/components/parameters/ProductId'
      - $ref: '#/components/parameters/Granularity'
      - $ref: '#/components/parameters/Horizon'
      - name: history_days
        in: query
        schema:
          type: integer
          minimum: 7
          maximum: 730
          default: 90
      responses:
        '200':
          description: Serie
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SeriesResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
  /import-fields/{entityType}:
    parameters:
    - name: entityType
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ImportEntity'
    get:
      tags:
      - Importaciones
      summary: Definición de campos [{key, label, required, type, description, synonyms}]
      responses:
        '200':
          description: OK
  /import-templates/{entityType}:
    parameters:
    - name: entityType
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ImportEntity'
    get:
      tags:
      - Importaciones
      summary: Plantilla CSV con encabezados canónicos
      responses:
        '200':
          description: CSV
  /imports:
    parameters:
    - $ref: '#/components/parameters/TenantId'
    get:
      tags:
      - Importaciones
      summary: Importaciones
      parameters:
      - name: status
        in: query
        schema:
          type: string
      - name: entity_type
        in: query
        schema:
          $ref: '#/components/schemas/ImportEntity'
      responses:
        '200':
          description: OK
    post:
      tags:
      - Importaciones
      summary: Subir archivo CSV/XLSX (máx. 20 MB) — detecta columnas y sugiere mapeo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - entity_type
              properties:
                file:
                  type: string
                  format: binary
                entity_type:
                  $ref: '#/components/schemas/ImportEntity'
                data_source_id:
                  type: integer
      responses:
        '201':
          $ref: '#/components/responses/ImportJobResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /imports/{import}:
    parameters:
    - $ref: '#/components/parameters/TenantId'
    - $ref: '#/components/parameters/ImportId'
    get:
      tags:
