        '200':
          description: OK
  /tenant/shared-training-consent:
    parameters:
    - $ref: '#/components/parameters/TenantId'
    put:
      tags:
      - Privacidad
      summary: Consentimiento para entrenamiento compartido entre empresas (solo propietario)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - allow
              properties:
                allow:
                  type: boolean
      responses:
        '200':
          $ref: '#/components/responses/TenantResponse'
  /tenant/usage:
    parameters:
    - $ref: '#/components/parameters/TenantId'
    get:
      tags:
      - Empresas
      summary: Consumo del período y límites del plan
      responses:
        '200':
          description: OK
  /tenant/users:
    parameters:
    - $ref: '#/components/parameters/TenantId'
    get:
      tags:
      - Usuarios
      summary: Miembros (users.manage)
      responses:
        '200':
          description: OK
    post:
      tags:
      - Usuarios
      summary: Agregar miembro (crea la cuenta si no existe; contraseña temporal mostrada una vez)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - role
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '201':
          description: Agregado
        '402':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /tenant/users/{user}:
    parameters:
    - $ref: '#/components/parameters/TenantId'
    - name: user
      in: path
      required: true
      schema:
        type: integer
    patch:
      tags:
      - Usuarios
      summary: Cambiar rol (solo un propietario asigna/quita owner; nunca sin propietario)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - role
              properties:
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: OK
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - Usuarios
      summary: Quitar miembro
      responses:
        '204':
          description: Eliminado
  /tenants:
    get:
      tags:
      - Empresas
      summary: Empresas del usuario
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TenantSummary'
    post:
      tags:
      - Empresas
      summary: Crear empresa (el usuario queda como propietario, plan trial)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - sector
              properties:
                name:
                  type: string
                legal_name:
                  type: string
                tax_id:
                  type: string
                  pattern: ^\d{13}$
                  description: RUC
                sector:
                  $ref: '#/components/schemas/Sector'
                timezone:
                  type: string
                  default: America/Guayaquil
                currency:
                  type: string
                  enum:
                  - USD
      responses:
        '201':
          $ref: '#/components/responses/TenantResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: predictily-session
      description: 'SPA: GET /sanctum/csrf-cookie y luego enviar X-XSRF-TOKEN'
    bearerToken:
      type: http
      scheme: bearer
  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Uuid de la empresa activa (ignorado con tokens ligados a empresa)
    ImportId:
      name: import
      in: path
      required: true
      schema:
        type: integer
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    TenantHeader:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    RunId:
      name: run_id
      in: query
      description: Por defecto, la ejecución vigente
      schema:
        type: integer
    BranchId:
      name: branch_id
      in: query
      schema:
        type: integer
    CategoryId:
      name: category_id
      in: query
      schema:
        type: integer
    ProductId:
      name: product_id
      in: query
      schema:
        type: integer
    Granularity:
      name: granularity
      in: query
      schema:
        type: string
        enum:
        - day
        - week
        - month
    Horizon:
      name: horizon
      in: query
      description: Por defecto settings.default_horizon_days de la empresa
      schema:
        type: integer
        enum:
        - 7
        - 30
        - 90
    Delimiter:
      name: delimiter
      in: query
      schema:
        type: string
        enum:
        - ','
        - ;
        default: ','
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Error de validación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    LoginResponse:
      description: Usuario autenticado
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
                    description: Solo para clientes sin sesión (no SPA)
                  token_type:
                    type: string
    TenantResponse:
      description: Empresa
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/Tenant'
    ImportJobResponse:
      description: Trabajo de importación
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/ImportJob'
    NotFound:
      description: No existe o pertenece a otra empresa
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Sin permiso para la acción (code forbidden)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Validation:
      description: Error de validación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PlanLimit:
      description: Límite del plan
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              code:
                type: string
                const: plan_limit_exceeded
              limit:
                type: string
              current:
                type:
                - number
                - 'null'
              max:
                type:
                - number
                - 'null'
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    Paginated:
      type: object
      properties:
        meta:
          type: object
          properties:
            current_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            last_page:
              type: integer
        links:
          type: object
    Sector:
      type: string
      enum:
      - ferreteria
      - distribuidora
      - repuestos_automotrices
      - repuestos_agricolas
      - retail_multisucursal
      - importadora
      - consumo_recurrente
      - otro
    Role:
      type: string
      enum:
      - owner
      - admin
      - analyst
      - viewer
    ImportEntity:
      type: string
      enum:
      - sales
      - products
      - inventory
      - lead_times
      - branches
      - suppliers
      - promotions
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        locale:
          type: string
        is_superadmin:
          type: boolean
        last_login_at:
          type:
          - string
          - 'null'
          format: date-time
    TenantSummary:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
        sector:
          $ref: '#/components/schemas/Sector'
        status:
          type: string
